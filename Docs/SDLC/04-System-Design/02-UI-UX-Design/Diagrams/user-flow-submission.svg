="276.719" fill="#F3F4F6" font-size="12.5" textLength="207.739" font-family="Arial">Review capture selection and confirm</text><rect x="225.449" y="306.451" width="334.204" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="231.699" y="324.426" fill="#F3F4F6" font-size="12.5" textLength="321.704" font-family="Arial">Validate authority, request identity and material availability</text><polygon points="337.662,354.159,447.44,354.159,459.94,366.659,447.44,379.159,337.662,379.159,325.162,366.659,337.662,354.159" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="337.662" y="371.196" fill="#F3F4F6" font-size="12.5" textLength="109.778" font-family="Arial">Capture confirmed?</text><text x="305.71" y="364.01" fill="#F3F4F6" font-size="12.5" textLength="19.452" font-family="Arial">yes</text><text x="459.94" y="364.01" fill="#F3F4F6" font-size="12.5" textLength="75.745" font-family="Arial">no / uncertain</text><rect x="16.667" y="389.575" width="365.454" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="22.917" y="407.55" fill="#F3F4F6" font-size="12.5" textLength="352.954" font-family="Arial">Show immutable submission event and exact retained materials</text><rect x="56.968" y="437.282" width="284.851" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="63.218" y="455.257" fill="#F3F4F6" font-size="12.5" textLength="272.351" font-family="Arial">Later profile edits / withdrawal leave history intact</text><rect x="36.47" y="484.989" width="325.848" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="42.72" y="502.964" fill="#F3F4F6" font-size="12.5" textLength="313.348" font-family="Arial">Open submitted-material view through authorized history</text><rect x="402.954" y="389.575" width="365.509" height="26.8