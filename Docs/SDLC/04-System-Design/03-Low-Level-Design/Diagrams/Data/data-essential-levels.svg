<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:888px;height:642px;background:#111827;" width="888.542px" height="642.708px" viewBox="0 0 888 642" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="888.542" height="642.708" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="4"><rect x="93.343" y="20.833" width="700.132" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="99.593" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="687.632" font-weight="700" font-family="Arial">Proposed / illustrative — Conceptual to logical to physical refinement</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0001" data-source-line="9"><rect x="389.958" y="76.04" width="247.341" height="78.328" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="400.375" y="98.181" fill="#F3F4F6" font-size="12.5" textLength="63.239" font-family="Arial">Conceptual</text><text x="400.375" y="112.555" fill="#F3F4F6" font-size="12.5" textLength="197.375" font-family="Arial">Meaning and independent identities</text><text x="400.375" y="126.929" fill="#F3F4F6" font-size="12.5" textLength="151.465" font-family="Arial">No physical types / indexes</text><text x="400.375" y="141.302" fill="#F3F4F6" font-size="12.5" textLength="226.508" font-family="Arial">Source, draft, publication, actual material</text></g><!--entity L--><g class="entity" data-qualified-name="L" id="ent0002" data-source-line="10"><rect x="135.427" y="232.488" width="312.655" height="78.328" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="145.844" y="254.629" fill="#F3F4F6" font-size="12.5" textLength="39.612" font-family="Arial">Logical</text><text x="145.844" y="269.003" fill="#F3F4F6" font-size="12.5" textLength="163.977" font-family="Arial">Owned records and attributes</text><text x="145.844" y="283.377" fill="#F3F4F6" font-size="12.5" textLength="255.005" font-family="Arial">Identity / relationships / candidate cardinalities</text><text x="145.844" y="297.75" fill="#F3F4F6" font-size="12.5" textLength="291.821" font-family="Arial">Publication belongs to resume; live selection is exact</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0003" data-source-line="11"><rect x="17.708" y="388.946" width="298.086" height="78.328" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="28.125" y="411.087" fill="#F3F4F6" font-size="12.5" textLength="104.23" font-family="Arial">Physical candidate</text><text x="28.125" y="425.461" fill="#F3F4F6" font-size="12.5" textLength="277.252" font-family="Arial">Selected-engine columns and key representations</text><text x="28.125" y="439.835" fill="#F3F4F6" font-size="12.5" textLength="264.032" font-family="Arial">PK / scoped FK / uniqueness / checks / indexes</text><text x="28.125" y="454.209" fill="#F3F4F6" font-size="12.5" textLength="232.062" font-family="Arial">Actual transaction and query mechanisms</text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0004" data-source-line="12"><rect x="155.208" y="545.394" width="287.667" height="78.328" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="165.625" y="567.535" fill="#F3F4F6" font-size="12.5" textLength="61.835" font-family="Arial">Verification</text><text x="165.625" y="581.909" fill="#F3F4F6" font-size="12.5" textLength="218.518" font-family="Arial">Exact source criteria + actual candidate</text><text x="165.625" y="596.283" fill="#F3F4F6" font-size="12.5" textLength="245.227" font-family="Arial">Round-trip / concurrency / privacy / recovery</text><text x="165.625" y="610.657" fill="#F3F4F6" font-size="12.5" textLength="266.833" font-family="Arial">Real DB and storage evidence where applicable</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="18"><path d="M484.188,256.238 L484.188,287.068 A4.167,4.167 0 0 0 488.354,291.235 L863.901,291.235 A4.167,4.167 0 0 0 868.068,287.068 L868.068,262.488 L857.651,252.071 L488.354,252.071 A4.167,4.167 0 0 0 484.188,256.238" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M857.651,252.071 L857.651,260.404 A2.083,2.083 0 0 0 859.735,262.488 L868.068,262.488 L857.651,252.071" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="490.438" y="269.004" fill="#F3F4F6" font-size="12.5" textLength="295.996" font-family="Arial">ORM class, logical entity and table need not map 1:1.</text><text x="490.438" y="283.378" fill="#F3F4F6" font-size="12.5" textLength="362.006" font-family="Arial">A valid FK does not provide current authorization or usable bytes.</text></g><!--link C to L--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="13" data-link-type="dependency"><path d="M389.74,143.019 C364.875,153.05 340.677,166.8 321.958,185.613 C309.594,198.06 303.61,210.853 299.287,226.967" style="stroke:#2A9FD6;stroke-width:3.125;" fill="none" id="C-to-L"/><polygon points="297.938,231.998,304.391,224.023,299.287,226.967,296.342,221.864,297.938,231.998" fill="#2A9FD6" style="stroke:#2A9FD6;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="323" y="198.379" fill="#F3F4F6" font-size="12.5" textLength="298.773" font-family="Arial">add justified structure, not guessed source constraints</text></g><!--link L to P--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M186.094,311.144 C174.292,319.592 163.844,329.79 156.333,342.071 C147.958,355.769 147.378,367.956 150.805,383.341" style="stroke:#2A9FD6;stroke-width:3.125;" fill="none" id="L-to-P"/><polygon poi