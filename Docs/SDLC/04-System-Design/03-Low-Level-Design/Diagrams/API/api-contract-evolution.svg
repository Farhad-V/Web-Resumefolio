<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:679px;height:650px;background:#111827;" width="679.167px" height="650px" viewBox="0 0 679 650" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="679.167" height="650" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="4"><rect x="64.469" y="20.833" width="548.49" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="70.719" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="535.99" font-weight="700" font-family="Arial">Proposed contract evolution and compatibility checks</text></g><ellipse cx="327.938" cy="84.373" rx="10.417" ry="10.417" fill="#93C" style="stroke:#55B2DE;stroke-width:1.042;"/><rect x="167.434" y="115.623" width="321.008" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="173.684" y="133.598" fill="#F3F4F6" font-size="12.5" textLength="308.508" font-family="Arial">Identify owner, source obligation and actual consumers;</text><text x="173.684" y="147.972" fill="#F3F4F6" font-size="12.5" textLength="303.625" font-family="Arial">include clients, workers, callbacks and stored payloads</text><rect x="183.068" y="177.704" width="289.74" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="189.318" y="195.679" fill="#F3F4F6" font-size="12.5" textLength="215.381" font-family="Arial">Assess shape AND semantic changes;</text><text x="189.318" y="210.052" fill="#F3F4F6" font-size="12.5" textLength="277.24" font-family="Arial">authority, defaults, outcomes, ordering and effects</text><polygon points="229.281,239.785,426.595,239.785,439.095,252.285,426.595,264.785,229.281,264.785,216.781,252.285,229.281,239.785" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="229.281" y="256.823" fill="#F3F4F6" font-size="12.5" textLength="197.314" font-family="Arial">Compatible with actual consumers?</text><text x="140.346" y="249.636" fill="#F3F4F6" font-size="12.5" textLength="76.434" font-family="Arial">demonstrated</text><text x="439.095" y="249.636" fill="#F3F4F6" font-size="12.5" textLength="110.492" font-family="Arial">breaking / unproven</text><rect x="16.667" y="275.201" width="291.119" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="22.917" y="293.176" fill="#F3F4F6" font-size="12.5" textLength="278.619" font-family="Arial">Verify old/new interaction and preservation checks</text><rect x="328.619" y="275.201" width="330.06" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="334.869" y="293.176" fill="#F3F4F6" font-size="12.5" textLength="262.634" font-family="Arial">Define explicit version or coordinated transition;</text><text x="334.869" y="307.55" fill="#F3F4F6" font-size="12.5" textLength="317.56" font-family="Arial">compatible readers/writers and pending-payload handling</text><rect x="350.18" y="337.282" width="286.938" height="26.874" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="356.43" y="355.257" fill="#F3F4F6" font-size="12.5" textLength="274.438" font-family="Arial">Implement / verify coexistence and migration plan</text><polygon points="327.938,370.406,340.438,382.906,327.938,395.406,315.438,382.906,327.938,370.406" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="153.542" y="416.239" width="348.792" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="159.792" y="434.214" fill="#F3F4F6" font-size="12.5" textLength="200.14" font-family="Arial">Evaluate actual candidate evidence;</text><text x="159.792" y="448.588" fill="#F3F4F6" font-size="12.5" textLength="336.292" font-family="Arial">protected history and external attempt meaning remain intact</text><polygon points="236.913,478.32,418.963,478.32,431.463,490.82,418.963,503.32,236.913,503.32,224.413,490.82,236.913,478.32" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="236.913" y="495.358" fill="#F3F4F6" font-size="12.5" textLength="182.05" font-family="Arial">Evidence / disposition complete?</text><text x="204.961" y="488.171" fill="#F3F4F6" font-size="12.5" textLength="19.452" font-family="Arial">yes</text><text x="431.463" y="488.171" fill="#F3F4F6" font-size="12.5" textLength="13.904" font-family="Arial">no</text><rect x="24.845" y="513.737" width="309.174" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="31.095" y="531.712" fill="#F3F4F6" font-size="12.5" textLength="152.148" font-family="Arial">Promote reviewed contract;</text><text x="31.095" y="546.086" fill="#F3F4F6" font-size="12.5" textLength="296.674" font-family="Arial">retire old form only under actual consumer disposition</text><rect x="354.852" y="513.737" width="243.182" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="361.102" y="531.712" fill="#F3F4F6" font-size="12.5" textLength="204.279" font-family="Arial">Retain unresolved compatibility gate;</text><text x="361.102" y="546.086" fill="#F3F4F6" font-size="12.5" textLength="230.682" font-family="Arial">revise change or gather missing evidence</text><polygon points="327.938,561.235,340.438,573.735,327.938,586.235,315.438,573.735,327.938,561.235" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="327.938" cy="618.526" rx="11.458" ry="11.458" fill="none" style="stroke:#55B2DE;stroke-width:1.042;"/><ellipse cx="327.938" cy="618.