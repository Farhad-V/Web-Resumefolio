.042;" fill="#93C"/><path d="M822.391,304.165 L822.391,312.498 A2.083,2.083 0 0 0 824.474,314.581 L832.807,314.581 L822.391,304.165" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="495.521" y="321.098" fill="#F3F4F6" font-size="12.5" textLength="307.8" font-family="Arial">Rotation/renewal, if selected, creates or rebinds context</text><text x="495.521" y="335.472" fill="#F3F4F6" font-size="12.5" textLength="312.659" font-family="Arial">under the actual invalidation policy, not immortal refresh.</text><text x="495.521" y="349.845" fill="#F3F4F6" font-size="12.5" textLength="321.661" font-family="Arial">No numeric lifetime, JWT or OAuth refresh token adopted.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="24"><path d="M16.667,592.071 L16.667,637.276 A4.167,4.167 0 0 0 20.833,641.442 L403.326,641.442 A4.167,4.167 0 0 0 407.493,637.276 L407.493,598.321 L397.076,587.904 L216.25,587.904 L212.083,524.727 L207.917,587.904 L20.833,587.904 A4.167,4.167 0 0 0 16.667,592.071" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M397.076,587.904 L397.076,596.238 A2.083,2.083 0 0 0 399.16,598.321 L407.493,598.321 L397.076,587.904" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="22.917" y="604.837" fill="#F3F4F6" font-size="12.5" textLength="368.951" font-family="Arial">Report completion only at actual server-side invalidation boundary.</text><text x="22.917" y="619.211" fill="#F3F4F6" font-size="12.5" textLength="311.951" font-family="Arial">Old restored state must not reactivate revoked sessions.</text><text x="22.917" y="633.585" fill="#F3F4F6" font-size="12.5" textLength="325.171" font-family="Arial">Provider and Git credentials have separate scope/lifecycle.</text></g><!--link *start* to Establishing--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="9" data-link-type="dependency"><path d="M520.417,96.05 C520.417,113.05 520.417,143.79 520.417,168.36