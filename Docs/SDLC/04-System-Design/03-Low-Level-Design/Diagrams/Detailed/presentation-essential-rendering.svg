<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1454px;height:414px;background:#111827;" width="1454.167px" height="414.583px" viewBox="0 0 1454 414" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1454.167" height="414.583" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="4"><rect x="389.105" y="20.833" width="674.589" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="395.355" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="662.089" font-weight="700" font-family="Arial">Proposed — Version-bound rendering inputs and separate outputs</text></g><!--entity D--><g class="entity" data-qualified-name="D" id="ent0001" data-source-line="9"><rect x="286.5" y="83.227" width="128.518" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="296.917" y="105.369" fill="#F3F4F6" font-size="12.5" textLength="103.516" font-family="Arial">Exact draft version</text><text x="296.917" y="119.742" fill="#F3F4F6" font-size="12.5" textLength="107.684" font-family="Arial">owner-only preview</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0002" data-source-line="10"><rect x="451.708" y="83.227" width="300.179" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="462.125" y="105.369" fill="#F3F4F6" font-size="12.5" textLength="174.384" font-family="Arial">Committed publication manifest</text><text x="462.125" y="119.742" fill="#F3F4F6" font-size="12.5" textLength="279.346" font-family="Arial">content / selection / language / artifact provenance</text></g><!--entity T--><g class="entity" data-qualified-name="T" id="ent0003" data-source-line="11"><rect x="788.177" y="76.04" width="252.242" height="63.955" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="798.594" y="98.181" fill="#F3F4F6" font-size="12.5" textLength="182.751" font-family="Arial">Identified layout / template inputs</text><text x="798.594" y="112.555" fill="#F3F4F6" font-size="12.5" textLength="194.519" font-family="Arial">section structure / style parameters</text><text x="798.594" y="126.929" fill="#F3F4F6" font-size="12.5" textLength="231.409" font-family="Arial">versioning and safe content rules pending</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0004" data-source-line="12"><rect x="505.906" y="218.113" width="191.781" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="516.323" y="240.254" fill="#F3F4F6" font-size="12.5" textLength="133.417" font-family="Arial">Evaluated safe renderer</text><text x="516.323" y="254.628" fill="#F3F4F6" font-size="12.5" textLength="170.947" font-family="Arial">exact input and output contract</text></g><!--entity W--><g class="entity" data-qualified-name="W" id="ent0005" data-source-line="13"><rect x="17.708" y="353.008" width="236.934" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="28.125" y="375.15" fill="#F3F4F6" font-size="12.5" textLength="216.101" font-family="Arial">Web preview / eligible publication page</text></g><!--entity F--><g class="entity" data-qualified-name="F" id="ent0006" data-source-line="14"><rect x="290.625" y="345.821" width="282.772" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="301.042" y="367.962" fill="#F3F4F6" font-size="12.5" textLength="87.543" font-family="Arial">Generated PDF</text><text x="301.042" y="382.336" fill="#F3F4F6" font-size="12.5" textLength="261.938" font-family="Arial">separate actual rendition work / Files protection</text></g><!--entity V--><g class="entity"