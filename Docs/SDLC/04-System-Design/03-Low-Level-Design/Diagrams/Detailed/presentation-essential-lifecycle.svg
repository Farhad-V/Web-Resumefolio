th="174.961" height="52.083" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="190.135" y1="443.382" x2="365.097" y2="443.382" style="stroke:#55B2DE;stroke-width:1.042;"/><text x="200.552" y="435.746" fill="#F3F4F6" font-size="11.458" textLength="154.128" font-family="Arial">Immutable publication revision</text></g><g class="entity" data-qualified-name="L" id="ent0004" data-source-line="12"><rect x="147.448" y="549.998" width="260.323" height="52.083" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="147.448" y1="586.767" x2="407.77" y2="586.767" style="stroke:#55B2DE;stroke-width:1.042;"/><text x="157.865" y="565.954" fill="#F3F4F6" font-size="11.458" textLength="118.449" font-family="Arial">Live selection / visibility</text><text x="157.865" y="579.13" fill="#F3F4F6" font-size="11.458" textLength="239.489" font-family="Arial">separate owner-controlled pointer and eligibility</text></g><g class="entity" data-qualified-name="T" id="ent0005" data-source-line="13"><rect x="177.719" y="680.206" width="199.797" height="52.083" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><line x1="177.719" y1="716.975" x2="377.516" y2="716.975" style="stroke:#55B2DE;stroke-width:1.042;"/><text x="188.135" y="696.162" fill="#F3F4F6" font-size="11.458" textLength="77.707" font-family="Arial">Retired content</text><text x="188.135" y="709.338" fill="#F3F4F6" font-size="11.458" textLength="178.964" font-family="Arial">only under reviewed lifecycle policy</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="14"><ellipse cx="277.615" cy="85.415" rx="10.417" ry="10.417" fill="#93C" style="stroke:#55B2DE;stroke-width:1.042;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="23"><path d="M64.854,799.998 L64.854,845.203 A4.167,4.167 0 0 0 69.021,849.369 L486.206,849.369 A4.167,4.167 0 0 0 490.373,845.203 L49