<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:800px;height:844px;background:#111827;" width="800px" height="844.792px" viewBox="0 0 800 844" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="800" height="844.792" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="5"><rect x="59.468" y="20.833" width="679.401" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="65.718" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="666.901" font-weight="700" font-family="Arial">Candidate web middleware chain — owner checks remain essential</text></g><!--entity I--><g class="entity" data-qualified-name="I" id="ent0001" data-source-line="10"><rect x="286.953" y="76.04" width="224.422" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="297.369" y="98.181" fill="#F3F4F6" font-size="12.5" textLength="203.589" font-family="Arial">Request / trusted transport boundary</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0002" data-source-line="11"><rect x="283.484" y="173.748" width="231.362" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="293.901" y="195.889" fill="#F3F4F6" font-size="12.5" textLength="155.658" font-family="Arial">Bounded correlation context</text><text x="293.901" y="210.263" fill="#F3F4F6" font-size="12.5" textLength="210.529" font-family="Arial">Treat incoming metadata as untrusted</text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0003" data-source-line="12"><rect x="276.546" y="285.831" width="245.247" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="286.963" y="307.973" fill="#F3F4F6" font-size="12.5" textLength="224.414" font-family="Arial">Payload/media limits / schema boundary</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0004" data-source-line="13"><rect x="235.89" y="383.54" width="326.558" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="246.307" y="405.681" fill="#F3F4F6" font-size="12.5" textLength="305.725" font-family="Arial">Applicable session/authentication / anti-forgery controls</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0005" data-source-line="14"><rect x="283.14" y="481.248" width="232.052" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="293.557" y="503.389" fill="#F3F4F6" font-size="12.5" textLength="211.218" font-family="Arial">Reviewed abuse / resource admission</text></g><!--entity H--><g class="entity" data-qualified-name="H" id="ent0006" data-source-line="15"><rect x="231.901" y="578.946" width="334.536" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="242.317" y="601.087" fill="#F3F4F6" font-size="12.5" textLength="142.444" font-family="Arial">Resource-owning handler</text><text x="242.317" y="615.461" fill="#F3F4F6" font-size="12.5" textLength="313.702" font-family="Arial">Current scoped authorization + lifecycle/version invariant</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0007" data-source-line="16"><rect x="297.744" y="691.029" width="202.846" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="308.161" y="713.171" fill="#F3F4F6" font-size="12.5" textLength="182.013" font-family="Arial">Permitted result / error projection</text><text x="308.161" y="727.545" fill="#F3F4F6" font-size="12.5" textLength="152.856" font-family="Arial">Restricted diagnostic hooks</text></g><!--link I to C--><g class="link" data