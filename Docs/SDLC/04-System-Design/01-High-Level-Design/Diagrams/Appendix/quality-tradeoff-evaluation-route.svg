s and cross-attribute costs</text><polygon points="241.793,273.118,512.789,273.118,525.289,285.618,512.789,298.118,241.793,298.118,229.293,285.618,241.793,273.118" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="241.793" y="290.156" fill="#F3F4F6" font-size="12.5" textLength="270.996" font-family="Arial">Targets and safe evaluation prerequisites ready?</text><text x="209.841" y="282.969" fill="#F3F4F6" font-size="12.5" textLength="19.452" font-family="Arial">yes</text><text x="525.289" y="282.969" fill="#F3F4F6" font-size="12.5" textLength="13.904" font-family="Arial">no</text><rect x="16.667" y="308.535" width="359.253" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="22.917" y="326.51" fill="#F3F4F6" font-size="12.5" textLength="346.753" font-family="Arial">Evaluate actual identified candidate under controlled workload;</text><text x="22.917" y="340.883" fill="#F3F4F6" font-size="12.5" textLength="216.748" font-family="Arial">retain failures, raw measures and limits</text><rect x="61.863" y="370.616" width="268.86" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="68.113" y="388.59" fill="#F3F4F6" font-size="12.5" textLength="249.426" font-family="Arial">Compare exact criterion and reviewed target;</text><text x="68.113" y="402.964" fill="#F3F4F6" font-size="12.5" textLength="256.36" font-family="Arial">record risks, sensitivities and trade-off findings</text><rect x="396.753" y="308.535" width="323.071" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="403.003" y="326.51" fill="#F3F4F6" font-size="12.5" textLength="310.571" font-family="Arial">Record missing target / mechanism / enabling evidence;</text><text x="403.003" y="340.883" fill="#F3F4F6" font-size="12.5" textLength="195.282" font-family="Arial">prepare bounded next investigation</t