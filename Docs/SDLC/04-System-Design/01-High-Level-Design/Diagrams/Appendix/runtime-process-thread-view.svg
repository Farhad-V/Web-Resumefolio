<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:816px;height:642px;background:#111827;" width="816.667px" height="642.708px" viewBox="0 0 816 642" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="816.667" height="642.708" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="5"><rect x="109.289" y="20.833" width="596.006" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="115.539" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="583.506" font-weight="700" font-family="Arial">Proposed processes, execution contexts and durable work</text></g><!--cluster Trusted web runtime--><g class="cluster" data-qualified-name="Trusted web runtime" id="ent0002" data-source-line="11"><polygon points="27.083,170.623,37.5,160.206,358.333,160.206,358.333,406.238,347.917,416.654,27.083,416.654,27.083,170.623" fill="#555" style="stroke:#2A9FD6;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.917" y1="170.623" x2="358.333" y2="160.206" style="stroke:#2A9FD6;stroke-width:1.042;"/><line x1="27.083" y1="170.623" x2="347.917" y2="170.623" style="stroke:#2A9FD6;stroke-width:1.042;"/><line x1="347.917" y1="170.623" x2="347.917" y2="416.654" style="stroke:#2A9FD6;stroke-width:1.042;"/><text x="127.076" y="185.473" fill="#F3F4F6" font-size="12.5" textLength="122.931" font-weight="700" font-family="Arial">Trusted web runtime</text></g><!--cluster Bounded background runtime--><g class="cluster" data-qualified-name="Bounded background runtime" id="ent0008" data-source-line="18"><polygon points="528.125,322.279,538.542,311.863,785.417,311.863,785.417,406.238,775,416.654,528.125,416.654,528.125,322.279" fill="#555" style="stroke:#2A9FD6;stroke-width:1.042;stroke-linejoin:miter