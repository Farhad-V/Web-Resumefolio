ges</text><polygon points="275.319,273.118,478.896,273.118,491.396,285.618,478.896,298.118,275.319,298.118,262.819,285.618,275.319,273.118" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="275.319" y="290.156" fill="#F3F4F6" font-size="12.5" textLength="203.577" font-family="Arial">Current authority and versions valid?</text><text x="243.368" y="282.969" fill="#F3F4F6" font-size="12.5" textLength="19.452" font-family="Arial">yes</text><text x="491.396" y="282.969" fill="#F3F4F6" font-size="12.5" textLength="74.359" font-family="Arial">denied / stale</text><rect x="84.23" y="308.535" width="310.608" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="90.48" y="326.51" fill="#F3F4F6" font-size="12.5" textLength="161.908" font-family="Arial">Apply only selected changes;</text><text x="90.48" y="340.883" fill="#F3F4F6" font-size="12.5" textLength="298.108" font-family="Arial">show Saved Draft and unchanged Published Revision</text><rect x="415.671" y="308.535" width="198.022" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="421.921" y="326.51" fill="#F3F4F6" font-size="12.5" textLength="166.736" font-family="Arial">Safe refusal or conflict review;</text><text x="421.921" y="340.883" fill="#F3F4F6" font-size="12.5" textLength="185.522" font-family="Arial">preserve permitted intended edits</text><ellipse cx="514.682" cy="382.074" rx="11.458" ry="11.458" fill="none" style="stroke:#55B2DE;stroke-width:1.042;"/><ellipse cx="514.682" cy="382.074" rx="6.25" ry="6.25" fill="none" style="stroke:#55B2DE;stroke-width:1.042;"/><path d="M484.096,403.949 L484.096,443.113 L770.003,443.113 L770.003,414.366 L759.587,403.949 L484.096,403.949" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M759.587,403.949 L759.587,414.366 L770.003,414.366 L759.587,403.949" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#