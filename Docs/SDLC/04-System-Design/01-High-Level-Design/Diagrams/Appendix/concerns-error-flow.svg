x="22.917" y="216.722" fill="#F3F4F6" font-size="12.5" textLength="238.318" font-family="Arial">Return safe invalid / denied / conflict result;</text><text x="22.917" y="231.095" fill="#F3F4F6" font-size="12.5" textLength="295.294" font-family="Arial">no fabricated mutation or private existence disclosure</text><polygon points="520.185,198.747,759.211,198.747,771.711,211.247,759.211,223.747,520.185,223.747,507.685,211.247,520.185,198.747" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="520.185" y="215.785" fill="#F3F4F6" font-size="12.5" textLength="239.026" font-family="Arial">Failure before any possible external effect?</text><text x="488.233" y="208.598" fill="#F3F4F6" font-size="12.5" textLength="19.452" font-family="Arial">yes</text><text x="771.711" y="208.598" fill="#F3F4F6" font-size="12.5" textLength="79.907" font-family="Arial">possible effect</text><rect x="355.711" y="234.163" width="264.703" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="361.961" y="252.138" fill="#F3F4F6" font-size="12.5" textLength="252.203" font-family="Arial">Resolve local transaction/command outcome;</text><text x="361.961" y="266.512" fill="#F3F4F6" font-size="12.5" textLength="216.095" font-family="Arial">repeat only if bounded contract permits</text><rect x="641.248" y="234.163" width="300.171" height="41.248" fill="#2A9FD6" style="stroke:#55B2DE;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="647.498" y="252.138" fill="#F3F4F6" font-size="12.5" textLength="270.978" font-family="Arial">Retain confirmed / partial / unknown observation;</text><text x="647.498" y="266.512" fill="#F3F4F6" font-size="12.5" textLength="287.671" font-family="Arial">reconcile same attempt before consequential repeat</text><polygon points="639.698,281.661,652.198,294.161,639.698,306.661,627.198,294.161,639.698,281.661" fill="#444" style="stroke:#777;stroke-width:1.042;stroke-linejoin:m