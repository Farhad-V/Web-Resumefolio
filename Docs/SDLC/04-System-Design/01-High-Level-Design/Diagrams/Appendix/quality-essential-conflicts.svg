ext></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0004" data-source-line="13"><rect x="17.708" y="311.863" width="219.564" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="28.125" y="334.004" fill="#F3F4F6" font-size="12.5" textLength="198.73" font-family="Arial">Storage / cleanup / recovery burden</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0005" data-source-line="14"><rect x="308.021" y="311.863" width="161.849" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="318.438" y="334.004" fill="#F3F4F6" font-size="12.5" textLength="141.016" font-family="Arial">More worker concurrency</text></g><!--entity W--><g class="entity" data-qualified-name="W" id="ent0006" data-source-line="15"><rect x="126.031" y="434.363" width="238.332" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="136.448" y="456.504" fill="#F3F4F6" font-size="12.5" textLength="217.499" font-family="Arial">Queue delay / web resource contention</text></g><!--entity I--><g class="entity" data-qualified-name="I" id="ent0007" data-source-line="16"><rect x="458.01" y="434.363" width="147.298" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="468.427" y="456.504" fill="#F3F4F6" font-size="12.5" textLength="126.465" font-family="Arial">Execution containment</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0008" data-source-line="17"><rect x="429.177" y="547.696" width="204.964" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="439.594" y="569.837" fill="#F3F4F6" font-size="12.5" textLength="184.131" font-family="Arial">Capacity / setup / operating effort</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="26"><path d="M506.729,306.873 L506.729