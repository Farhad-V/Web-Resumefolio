<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:763px;height:795px;background:#111827;" width="763.542px" height="795.833px" viewBox="0 0 763 795" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="763.542" height="795.833" fill="#111827" style="stroke:none;"/><g class="title" data-source-line="5"><rect x="42.993" y="20.833" width="675.871" height="36.456" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="49.243" y="46.625" fill="#F3F4F6" font-size="20.833" textLength="663.371" font-weight="700" font-family="Arial">Candidate resilience composition — not a generic retry-all wrapper</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0001" data-source-line="10"><rect x="242.149" y="76.04" width="269.558" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="252.566" y="98.181" fill="#F3F4F6" font-size="12.5" textLength="248.724" font-family="Arial">Operation-specific eligibility / repetition policy</text></g><!--entity B--><g class="entity" data-qualified-name="B" id="ent0002" data-source-line="11"><rect x="247.691" y="174.79" width="258.48" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="258.107" y="196.931" fill="#F3F4F6" font-size="12.5" textLength="160.522" font-family="Arial">Bulkhead / admission budget</text><text x="258.107" y="211.305" fill="#F3F4F6" font-size="12.5" textLength="237.646" font-family="Arial">Bounded work class and shared headroom</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0003" data-source-line="12"><rect x="260.889" y="287.915" width="232.094" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="271.305" y="310.056" fill="#F3F4F6" font-size="12.5" textLength="136.853" font-family="Arial">Circuit breaker if justified</text><text x="271.305" y="324.43" fill="#F3F4F6" font-size="12.5" textLength="211.261" font-family="Arial">Scoped dependency health/admission</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0004" data-source-line="13"><rect x="251.857" y="415.623" width="250.149" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="262.274" y="437.764" fill="#F3F4F6" font-size="12.5" textLength="229.315" font-family="Arial">Adapter with evaluated deadline / timeout</text><text x="262.274" y="452.138" fill="#F3F4F6" font-size="12.5" textLength="210.51" font-family="Arial">Timeout does not confirm remote stop</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0005" data-source-line="14"><rect x="286.274" y="528.738" width="181.325" height="35.207" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="296.691" y="550.879" fill="#F3F4F6" font-size="12.5" textLength="160.492" font-family="Arial">Actual outcome classification</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0006" data-source-line="15"><rect x="104.305" y="642.071" width="251.503" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="114.722" y="664.212" fill="#F3F4F6" font-size="12.5" textLength="221.655" font-family="Arial">Safe read / proven no-effect local failure</text><text x="114.722" y="678.586" fill="#F3F4F6" font-size="12.5" textLength="230.67" font-family="Arial">Bounded retry only when contract permits</text></g><!--entity U--><g class="entity" data-qualified-name="U" id="ent0007" data-source-line="16"><rect x="392.139" y="642.071" width="265.413" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="402.555" y="664.212" fill="#F3F4F6" font-size="12.5" textLength="161.908" font-family="Arial">Possible consequential effect</text><text x="402.555" y="678.586" fill="#F3F4F6" font-size="12.5" textLength="244.58" font-family="Arial">Same-attempt reconciliation, no blind repeat</text></g><!--link P to B--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="17" data-link-type="dependency"><path d="M376.93,111.373 C376.93,128.456 376.93,149.977 376.93,169.331" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="P-to-B"/><polygon points="376.93,174.54,381.097,165.165,376.93,169.331,372.764,165.165,376.93,174.54" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to C--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="18" data-link-type="dependency"><path d="M376.93,224.717 C376.93,243.342 376.93,263.79 376.93,282.404" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="B-to-C"/><polygon points="376.93,287.613,381.097,278.238,376.93,282.404,372.764,278.238,376.93,287.613" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C to A--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="19" data-link-type="dependency"><path d="M376.93,337.967 C376.93,360.206 376.93,387.79 376.93,410.008" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="C-to-A"/><polygon points="376.93,415.217,381.097,405.842,376.93,410.008,372.764,405.842,376.93,415.217" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="377.972" y="381.514" fill="#F3F4F6" font-size="12.5" textLength="178.583" font-family="Arial">closed / eligible controlled probe</text></g><!--link A to O--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="20" data-link-type="dependency"><path d="M376.93,465.54 C376.93,484.831 376.93,506.196 376.93,523.269" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="A-to-O"/><polygon points="376.93,528.477,381.097,519.102,376.93,523.269,372.764,519.102,376.93,528.477" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link O to R--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-source-line="21" data-link-type="dependency"><path d="M355.889,564.352 C330.743,584.633 292.557,615.426 264.026,638.437" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="O-to-R"/><polygon points="259.972,641.706,269.885,639.064,264.026,638.437,264.654,632.578,259.972,641.706" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="317.691" y="607.962" fill="#F3F4F6" font-size="12.5" textLength="113.947" font-family="Arial">known safe eligibility</text></g><!--link O to U--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk13" data-source-line="22" data-link-type="dependency"><path d="M400.097,564.363 C412.232,573.373 427.284,584.727 440.472,595.196 C459.472,610.279 476.42,624.406 492.67,638.219" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="O-to-U"/><polygon points="496.639,641.592,492.194,632.345,492.67,638.219,486.797,638.695,496.639,641.592" fill="#CBD5E1" style="stroke:#CBD5E1;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="460.274" y="607.962" fill="#F3F4F6" font-size="12.5" textLength="128.546" font-family="Arial">partial / unknown effect</text></g><g class="legend" data-source-line="23"><rect x="20.833" y="710.402" width="720.19" height="62.808" fill="none" style="stroke:#777;stroke-width:1.042;" rx="4.167" ry="4.167"/><text x="27.083" y="730.331" fill="#F3F4F6" font-size="14.583" textLength="590.995" font-family="Arial">Values, backend, isolation budget, breaker scope and probe mechanism require evaluation.</text><t