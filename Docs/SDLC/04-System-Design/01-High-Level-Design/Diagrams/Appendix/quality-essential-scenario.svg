ntity" data-qualified-name="A" id="ent0003" data-source-line="12"><rect x="262.926" y="331.238" width="250.814" height="49.581" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="273.343" y="353.379" fill="#F3F4F6" font-size="12.5" textLength="38.898" font-family="Arial">Artifact</text><text x="273.343" y="367.753" fill="#F3F4F6" font-size="12.5" textLength="229.98" font-family="Arial">Sharing / Identity / Files serving boundary</text></g><!--entity E--><g class="entity" data-qualified-name="E" id="ent0004" data-source-line="13"><rect x="345.906" y="189.165" width="253.615" height="63.955" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="356.322" y="211.306" fill="#F3F4F6" font-size="12.5" textLength="70.172" font-family="Arial">Environment</text><text x="356.322" y="225.68" fill="#F3F4F6" font-size="12.5" textLength="221.637" font-family="Arial">Concurrent change; warm or cold cache</text><text x="356.322" y="240.054" fill="#F3F4F6" font-size="12.5" textLength="232.782" font-family="Arial">actual selected candidate and mechanism</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0005" data-source-line="14"><rect x="249.718" y="444.363" width="277.242" height="63.955" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="260.135" y="466.504" fill="#F3F4F6" font-size="12.5" textLength="56.287" font-family="Arial">Response</text><text x="260.135" y="480.878" fill="#F3F4F6" font-size="12.5" textLength="252.899" font-family="Arial">Only current permitted exact content admitted</text><text x="260.135" y="495.252" fill="#F3F4F6" font-size="12.5" textLength="256.409" font-family="Arial">truthful denial / unavailable; no private fallback</text></g><!--entity M--><g class="entity" data-qualified-name="M" id="ent0006" data-source-line="15"><rect x="263.968" y="571.863" width="248.733" height="78.328" fill="#444" style="stroke:#55B2DE;stroke-width:2.083;" rx="4.167" ry="4.167"/><text x="274.385" y="594.004" fill="#F3F4F6" font-size="12.5" textLength="108.392" font-family="Arial">Response measure</text><text x="274.385" y="608.378" fill="#F3F4F6" font-size="12.5" textLength="204.968" font-family="Arial">Actual admission/revocation ordering</text><text x="274.385" y="622.752" fill="#F3F4F6" font-size="12.5" textLength="227.899" font-family="Arial">permitted vs prohibited byte observations</text><text x="274.385" y="637.125" fill="#F3F4F6" font-size="12.5" textLength="189.673" font-family="Arial">latency/errors recorded separately</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M205.093,717.894 L205.093,763.098 A4.167,4.167 0 0 0 209.26,767.265 L567.418,767.265 A4.167,4.167 0 0 0 571.585,763.098 L571.585,724.144 L561.168,713.727 L392.499,713.727 L388.333,650.633 L384.166,713.727 L209.26,713.727 A4.167,4.167 0 0 0 205.093,717.894" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><path d="M561.168,713.727 L561.168,722.06 A2.083,2.083 0 0 0 563.251,724.144 L571.585,724.144 L561.168,713.727" style="stroke:#AD5CD6;stroke-width:1.042;" fill="#93C"/><text x="211.343" y="730.66" fill="#F3F4F6" font-size="12.5" textLength="344.617" font-family="Arial">QA-01 example, not a test result or accepted numerical target.</text><text x="211.343" y="745.034" fill="#F3F4F6" font-size="12.5" textLength="229.297" font-family="Arial">Already emitted bytes cannot be recalled.</text><text x="211.343" y="759.408" fill="#F3F4F6" font-size="12.5" textLength="299.475" font-family="Arial">Fast responses cannot offset unauthorized disclosure.</text></g><!--link S to T--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="16" data-link-type="dependency"><path d="M198.749,126.081 C198.749,144.185 198.749,163.894 198.749,183.519" style="stroke:#CBD5E1;stroke-width:3.125;" fill="none" id="S-to-T"/><polygon points="198.749,188.727,202.916,179.352,198.