es</text><text x="409.26" y="504.156" fill="#F3F4F6" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="11" y="528.487" width="314.803" height="33.799" fill="#1F2937" style="stroke:#94A3B8;stroke-width:1;" rx="12.5" ry="12.5"/><text x="21" y="549.743" fill="#F3F4F6" font-size="12" textLength="294.803" font-family="Arial">Attach evidence and limitations to RTM / release record</text><rect x="345.803" y="528.487" width="197.428" height="47.598" fill="#1F2937" style="stroke:#94A3B8;stroke-width:1;" rx="12.5" ry="12.5"/><text x="355.803" y="549.743" fill="#F3F4F6" font-size="12" textLength="177.428" font-family="Arial">Record failure, affected capability</text><text x="355.803" y="563.542" fill="#F3F4F6" font-size="12" textLength="104.039" font-family="Arial">and corrective work</text><polygon points="306.459,582.085,318.459,594.085,306.459,606.085,294.459,594.085,306.459,582.085" fill="#164E63" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="573.23" y="319.292" width="311.516" height="33.799" fill="#1F2937" style="stroke:#94A3B8;stroke-width:1;" rx="12.5" ry="12.5"/><text x="583.23" y="340.548" fill="#F3F4F6" font-size="12" textLength="291.516" font-family="Arial">Record unresolved input, owner and required evidence</text><polygon points="517.724,612.085,529.724,624.085,517.724,636.085,505.724,624.085,517.724,612.085" fill="#164E63" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="346.942" y="656.085" width="341.563" height="33.799" fill="#1F2937" style="stroke:#94A3B8;stroke-width:1;" rx="12.5" ry="12.5"/><text x="356.942" y="677.341" fill="#F3F4F6" font-size="12" textLength="321.563" font-family="Arial">Keep affected gate open until evidence supports acceptance</text><ellipse cx="517.724" cy="720.884" rx="11" ry="11" fill="none" style="stroke:#000;stroke-width:1;"/><ellipse cx="517.724" cy="720.884" rx="6" ry="6" fill="#FFF" style="stroke:#000;stroke-width:1;"