e="33.75" textLength="206.257" font-family="Arial">UC-D10-RUN</text></a></g><!--entity deploy--><g class="entity" data-qualified-name="Resumefolio . System boundary.deploy" id="ent0005" data-source-line="29"><a target="_top" href="../04-scenarios-and-models/user-stories-and-scenarios.md#uc-d10-deploy" xlink:href="../04-scenarios-and-models/user-stories-and-scenarios.md#uc-d10-deploy" xlink:type="simple" xlink:actuate="onRequest" xlink:show="new" title="../04-scenarios-and-models/user-stories-and-scenarios.md#uc-d10-deploy" xlink:title="../04-scenarios-and-models/user-stories-and-scenarios.md#uc-d10-deploy"><ellipse cx="996.374" cy="459.219" rx="298.672" ry="65.134" fill="#213955" style="stroke:#9FB2CD;stroke-width:1.125;"/><text x="734.639" y="464.297" fill="#F1F5F9" font-size="33.75" textLength="523.471" font-family="Arial">Request an authorized deployment</text><text x="861.341" y="503.107" fill="#F1F5F9" font-size="33.75" textLength="270.066" font-family="Arial">UC-D10-DEPLOY</text></a></g><!--entity requester--><g class="entity" data-qualified-name="requester" id="ent0001" data-source-line="25"><ellipse cx="280.84" cy="159.702" rx="18" ry="18" fill="#F1F1F1" style="stroke:#F1F5F9;stroke-width:1.125;"/><path d="M280.84,177.702 L280.84,238.452 M251.59,195.702 L310.09,195.702 M280.84,238.452 L251.59,272.202 M280.84,238.452 L310.09,272.202" style="stroke:#F1F5F9;stroke-width:1.125;" fill="none"/><text x="95.108" y="307.234" fill="#F1F5F9" font-size="33.75" textLength="371.464" font-family="Arial">Authorized run requester</text></g><!--entity deployer--><g class="entity" data-qualified-name="deployer" id="ent0002" data-source-line="26"><ellipse cx="280.83" cy="411.702" rx="18" ry="18" fill="#F1F1F1" style="stroke:#F1F5F9;stroke-width:1.125;"/><path d="M280.83,429.702 L280.83,490.452 M251.58,447.702 L310.08,447.702 M280.83,490.452 L251.58,524.202 M280.83,490.452 L310.08,524.202" style="stroke:#F1F5F9;stroke-width:1.125;" fill="none"/><text x="13.5" y="559.234" fill="#