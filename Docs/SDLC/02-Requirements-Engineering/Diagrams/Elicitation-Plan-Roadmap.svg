1F5F9" font-size="33.75" textLength="808.583" font-family="Arial">Required material, access and participation available?</text><text x="578.886" y="712.497" fill="#F1F5F9" font-size="33.75" textLength="52.52" font-family="Arial">yes</text><text x="1493.988" y="712.497" fill="#F1F5F9" font-size="33.75" textLength="101.316" font-family="Arial">not yet</text><rect x="325.866" y="769.15" width="480.289" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="348.366" y="823.307" fill="#F1F5F9" font-size="33.75" textLength="435.289" font-family="Arial">Conduct the bounded activity</text><rect x="112.036" y="897.959" width="907.949" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="134.536" y="952.116" fill="#F1F5F9" font-size="33.75" textLength="862.949" font-family="Arial">Record actual date, sources, raw evidence and limitations</text><rect x="36" y="1026.768" width="1060.021" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="58.5" y="1080.925" fill="#F1F5F9" font-size="33.75" textLength="1015.021" font-family="Arial">Separate interpretation and record actual feedback / pending review</text><rect x="165.471" y="1155.577" width="801.079" height="83.809" fill="#173B34" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="187.971" y="1209.734" fill="#F1F5F9" font-size="33.75" textLength="756.079" font-family="Arial">Hand reviewed needs and explicit gaps to analysis</text><rect x="1141.021" y="769.15" width="836.724" height="83.809" fill="#49351C" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="1163.521" y="823.307" fill="#F1F5F9" font-size="33.75" textLength="791.724" font-family="Arial">Keep activity planned; record blocker and next action</text><rect x="1229.195" y="897.959" width="660.377" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="1251.695" y="952.116" fill="#F1F5F9" font-size="33.75" textLength="615.377" font-family="Arial">Keep dependent commitment unresolved</text><polygon points="1062.697,1252.886,1089.697,1279.886,1062.697,1306.886,1035.697,1279.886,1062.697,1252.886" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="611.458" y="1351.886" width="902.477" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="633.958" y="1406.043" fill="#F1F5F9" font-size="33.75" textLength="857.477" font-family="Arial">Update remaining questions, owner and dependent gates</text><polygon points="1062.697,336.031,1089.697,363.031,1062.697,390.031,1035.697,363.031,1062.697,336.031" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="753.113,1480.696,1372.281,1480.696,1399.281,1507.696,1372.281,1534.696,753.113,1534.696,726.113,1507.696,753.113,1480.696" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1071.697" y="1566.353" fill="#F1F5F9" font-size="33.75" textLength="37.54" font-family="Arial">no</text><text x="753.113" y="1519.948" fill="#F1F5F9" font-size="33.75" textLength="619.167" font-family="Arial">Another ready gap needs elicitation now?</text><text x="1399.281" y="1500.543" fill="#F1F5F9" font-size="33.75" textLength="52.52" font-family="Arial">yes</text><rect x="574.009" y="1613.446" width="977.377" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="596.509" y="1667.603" fill="#F1F5F9" font-size="33.75" textLength="932.377" font-family="Arial">Retain plan and actual activity records in their separate homes</text><ellipse cx="1062.697" cy="1767.005" rx="24.75" ry="24.75" fill="none" style="stroke:#222;stroke-width:2.25;"/><ellipse cx="1062.697" cy="1767.005" 