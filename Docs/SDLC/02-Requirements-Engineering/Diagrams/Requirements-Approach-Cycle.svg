ct x="375.333" y="821.459" width="810.406" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="397.833" y="875.616" fill="#F1F5F9" font-size="33.75" textLength="765.406" font-family="Arial">Define acceptance criteria and verification methods</text><rect x="469.134" y="967.143" width="622.804" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="491.634" y="1021.3" fill="#F1F5F9" font-size="33.75" textLength="577.804" font-family="Arial">Add scenarios, models and traceability</text><rect x="380.005" y="1095.952" width="801.063" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="402.505" y="1150.109" fill="#F1F5F9" font-size="33.75" textLength="756.063" font-family="Arial">Verify specification quality and validate user needs</text><rect x="395.899" y="1224.761" width="769.274" height="83.809" fill="#49351C" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="418.399" y="1278.918" fill="#F1F5F9" font-size="33.75" textLength="724.274" font-family="Arial">Record findings, questions and dependent gates</text><polygon points="780.536,464.84,807.536,491.84,780.536,518.84,753.536,491.84,780.536,464.84" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="411.89,1353.571,1149.183,1353.571,1176.183,1380.571,1149.183,1407.571,411.89,1407.571,384.89,1380.571,411.89,1353.571" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="789.536" y="1439.228" fill="#F1F5F9" font-size="33.75" textLength="37.54" font-family="Arial">no</text><text x="411.89" y="1392.823" fill="#F1F5F9" font-size="33.75" textLength="737.292" font-family="Arial">Blocking ambiguity or further refinement needed?</text><text x="1176.183" y="1373.418" fill="#F1F5F9" font-size="33.75" textLength="52.52" font-family="Arial">yes</text><polygon points="393.145,1486.321,1167.928,1486.321,1194.928,1513.321,1167.928,1540.321,393.145,1540.321,366.145,1513.321,393.145,1486.321" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.145" y="1525.573" fill="#F1F5F9" font-size="33.75" textLength="774.783" font-family="Arial">Actual owner acceptance recorded for this revision?</text><text x="313.625" y="1506.168" fill="#F1F5F9" font-size="33.75" textLength="52.52" font-family="Arial">yes</text><text x="1194.928" y="1506.168" fill="#F1F5F9" font-size="33.75" textLength="101.316" font-family="Arial">not yet</text><rect x="36" y="1562.821" width="615.289" height="83.809" fill="#173B34" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="58.5" y="1616.978" fill="#F1F5F9" font-size="33.75" textLength="570.289" font-family="Arial">Record accepted content and its limits</text><rect x="940.732" y="1562.821" width="553.392" height="83.809" fill="#49351C" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="963.232" y="1616.978" fill="#F1F5F9" font-size="33.75" textLength="508.392" font-family="Arial">Retain candidate status for review</text><polygon points="780.536,1660.13,807.536,1687.13,780.536,1714.13,753.536,1687.13,780.536,1660.13" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="459.749" y="1759.13" width="641.574" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="482.249" y="1813.287" fill="#F1F5F9" font-size="33.75" textLength="596.574" font-family="Arial">Maintain links and assess later changes</text><ellipse cx="780.536" cy="1912.689" rx="24.75" ry="24.75" fill="none" style="stroke:#222;stroke-width:2.25;"/><ellipse cx="780.536" cy="1912.689" rx="13.5" ry="13.5" fill="#222" style="stroke:#222;stroke-width:2.25;"/><line x1="780.536" y1="162.222" x2="780