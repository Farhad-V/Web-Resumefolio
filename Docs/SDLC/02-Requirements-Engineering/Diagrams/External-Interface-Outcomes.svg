tLength="37.54" font-family="Arial">no</text><rect x="378.776" y="541.34" width="896.726" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="401.276" y="595.497" fill="#F1F5F9" font-size="33.75" textLength="851.726" font-family="Arial">Perform bounded operation under interface-specific rules</text><polygon points="659.23,670.15,995.049,670.15,1022.049,697.15,995.049,724.15,659.23,724.15,632.23,697.15,659.23,670.15" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="659.23" y="709.402" fill="#F1F5F9" font-size="33.75" textLength="335.819" font-family="Arial">Outcome established?</text><text x="579.71" y="689.997" fill="#F1F5F9" font-size="33.75" textLength="52.52" font-family="Arial">yes</text><text x="1022.049" y="689.997" fill="#F1F5F9" font-size="33.75" textLength="283.348" font-family="Arial">unknown / pending</text><rect x="36" y="746.65" width="763.44" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="58.5" y="800.807" fill="#F1F5F9" font-size="33.75" textLength="718.44" font-family="Arial">Record actual success, rejection or partial result</text><rect x="844.44" y="746.65" width="784.237" height="83.809" fill="#49351C" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="866.94" y="800.807" fill="#F1F5F9" font-size="33.75" textLength="739.237" font-family="Arial">Retain uncertainty and defined reconciliation path</text><polygon points="827.139,843.959,854.139,870.959,827.139,897.959,800.139,870.959,827.139,843.959" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="425.677" y="942.959" width="802.925" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="448.177" y="997.116" fill="#F1F5F9" font-size="33.75" textLength="757.925" font-family="Arial">Apply only effects supported by established results</text><rect x="376.914" y="1071.768" width="900.45" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="399.414" y="1125.925" fill="#F1F5F9" font-size="33.75" textLength="855.45" font-family="Arial">Handle retry / cancellation under operation-specific policy</text><rect x="1696.177" y="541.34" width="915.447" height="83.809" fill="#49351C" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="1718.677" y="595.497" fill="#F1F5F9" font-size="33.75" textLength="870.447" font-family="Arial">Deny or report invalid request without protected disclosure</text><polygon points="1490.52,1169.077,1517.52,1196.077,1490.52,1223.077,1463.52,1196.077,1490.52,1169.077" fill="#49351C" style="stroke:#F2BA72;stroke-width:1.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1105.941" y="1268.077" width="769.158" height="83.809" fill="#1C3453" style="stroke:#9FB2CD;stroke-width:1.125;" rx="28.125" ry="28.125"/><text x="1128.441" y="1322.234" fill="#F1F5F9" font-size="33.75" textLength="724.158" font-family="Arial">Show truthful permitted outcome and next action</text><ellipse cx="1490.52" cy="1421.636" rx="24.75" ry="24.75" fill="none" style="stroke:#222;stroke-width:2.25;"/><ellipse cx="1490.52" cy="1421.636" rx="13.5" ry="13.5" fill="#222" style="stroke:#222;stroke-width:2.25;"/><line x1="1490.52" y1="162.222" x2="1490.52" y2="207.222" style="stroke:#9FB2CD;stroke-width:2.25;"/><polygon points="1481.52,184.722,1490.52,207.222,1499.52,184.722,1490.52,193.722" fill="#9FB2CD" style="stroke:#9FB2CD;stroke-width:2.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1490.52" y1="291.031" x2="1490.52" y2="336.031" style="stroke:#9FB2CD;stroke-width:2.25;"/><polygon points="1481.52,313.531,1490.52,336.031,1499.52,313.531,1490.52,322.531" fill="#9FB2CD" style="stroke:#9FB2CD;stroke-width:2.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="632.23" 