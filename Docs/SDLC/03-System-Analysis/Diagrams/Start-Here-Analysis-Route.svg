<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:608px;height:747px;background:#0D1525;" width="608px" height="747px" viewBox="0 0 608 747" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="608" height="747" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="27"><text x="163.967" y="35.107" fill="#EDF4FF" font-size="14" textLength="278.906" font-weight="700" font-family="Segoe UI">System Analysis — iterative working route</text></g><ellipse cx="155.276" cy="64.621" rx="10" ry="10" fill="#DDD" style="stroke:#DDD;stroke-width:1;"/><rect x="21.056" y="94.621" width="268.441" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="31.056" y="118.649" fill="#EDF4FF" font-size="13" textLength="248.441" font-family="Segoe UI">Read accepted scope, current requirements</text><text x="31.056" y="135.94" fill="#EDF4FF" font-size="13" textLength="109.808" font-family="Segoe UI">and decision status</text><rect x="61.925" y="169.203" width="186.702" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="71.925" y="193.231" fill="#EDF4FF" font-size="13" textLength="139.718" font-family="Segoe UI">Maintain system context</text><text x="71.925" y="210.522" fill="#EDF4FF" font-size="13" textLength="166.702" font-family="Segoe UI">(roles, exchanges, exclusions)</text><rect x="16" y="287.785" width="278.553" height="37.291" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="311.813" fill="#EDF4FF" font-size="13" textLength="258.553" font-family="Segoe UI">Refine domain concepts and conceptual data</text><rect x="55.508" y="345.076" width="199.537" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="65.508" y="369.104" fill="#EDF4FF" font-size="13" textLength="179.537" font-family="Segoe UI">Develop the relevant functional</text><text x="65.508" y="386.396" fill="#EDF4FF" font-size="13" textLength="119.52" font-family="Segoe UI">and behavioral views</text><rect x="27.464" y="427.158" width="255.625" height="37.291" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="37.464" y="451.187" fill="#EDF4FF" font-size="13" textLength="235.625" font-family="Segoe UI">State constraints and operation contracts</text><rect x="38.483" y="484.449" width="233.586" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="48.483" y="508.478" fill="#EDF4FF" font-size="13" textLength="213.586" font-family="Segoe UI">Check sources, cross-view agreement</text><text x="48.483" y="525.769" fill="#EDF4FF" font-size="13" textLength="108.799" font-family="Segoe UI">and actual findings</text><polygon points="155.276,243.785,167.276,255.785,155.276,267.785,143.276,255.785,155.276,243.785" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="60.049,559.031,250.504,559.031,262.504,571.031,250.504,583.031,60.049,583.031,48.049,571.031,60.049,559.031" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="159.276" y="594.901" fill="#EDF4FF" font-size="11" textLength="12.67" font-family="Segoe UI">no</text><text x="60.049" y="576.414" fill="#EDF4FF" font-size="13" textLength="190.455" font-family="Segoe UI">Unresolved model inconsistency?</text><text x="262.504" y="568.271" fill="#EDF4FF" font-size="11" textLength="15.743" font-family="Segoe UI">yes</text><path d="M311.957,606.401 L311.957,641.983 L291.957,645.983 L311.957,649.983 L311.957,685.565 A0,0 0 0 0 311.957,685.565 L587.84,685.565 A0,0 0 0 0 587.84,685.565 L587.84,616.401 L577.84,606.401 L311.957,606.401 A0,0 0 0 0 311.957,606.401" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M577.84,606.401 L577.84,616.401 L587.84,616.401 L577.84,606.401" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="317.957" y="625.43" fill="#EDF4FF" font-size="13" textLength="238.393" font-family="Segoe UI">A reviewed candidate is not automatically</text><text x="317.957" y="642.721" fill="#EDF4FF" font-size="13" textLength="160.348" font-family="Segoe UI">an accepted phase baseline.</text><text x="317.957" y="660.012" fill="#EDF4FF" font-size="13" textLength="225.5" font-family="Segoe UI">Return to the primary requirement only</text><text x="317.957" y="677.303" fill="#EDF4FF" font-size="13" textLength="254.884" font-family="Segoe UI">when its meaning actually needs refinement.</text><rect x="18.596" y="618.692" width="273.36" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="4" ry="4"/><text x="28.596" y="642.721" fill="#EDF4FF" font-size="13" textLength="253.36" font-family="Segoe UI">Prepare identified design-handoff candidate</text><text x="28.596" y="660.012" fill="#EDF4FF" font-size="13" textLength="168.708" font-family="Segoe UI">with explicit dependent gates</text><ellipse cx="155.276" cy="716.565" rx="11" ry="11" fill="none" style="stroke:#DDD;stroke-width:1;"/><ellipse cx="155.276" cy="716.565" rx="6" ry="6" fill="#DDD" style="stroke:#DDD;stroke-width:1;"/><line x1="155.276" y1="74.621" x2="155.276" y2="94.621" style="stroke:#91AED1;stroke-width:1;"/><polygon points="151.276,84.621,155.276,94.621,159.276,84.621,155.276,88.621" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="155.276" y1="149.203" x2="155.276" y2="169.203" style="stroke:#91AED1;stroke-width:1;"/><polygon points="151.276,159.203,155.276,169.203,159.276,159.203,155.276,163.203" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="155.276" y1="325.076" x2="155.276" y2="345.076" style="