<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:761px;height:581px;background:#FFFFFF;" width="761px" height="581px" viewBox="0 0 761 581" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="234.674" y="25.107" fill="#000" font-size="14" textLength="284.751" font-weight="700" font-family="Segoe UI">HD — delivery reconciliation before coding</text></g><!--entity Inputs--><g class="entity" data-qualified-name="Inputs" id="ent0001" data-source-line="15"><rect x="191.73" y="46.621" width="354.414" height="37.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="201.73" y="70.649" fill="#000" font-size="13" textLength="334.414" font-family="Segoe UI">Current requirements + analysis/design + remaining gates</text></g><!--entity Work--><g class="entity" data-qualified-name="Work" id="ent0002" data-source-line="16"><rect x="177.77" y="125.911" width="382.318" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="187.77" y="149.939" fill="#000" font-size="13" textLength="362.318" font-family="Segoe UI">Reviewable work outcomes + dependencies + full effort ranges</text><text x="187.77" y="167.23" fill="#000" font-size="13" textLength="332.668" font-family="Segoe UI">Include learning/docs/testing/recovery/operations/rework</text></g><!--entity Forecast--><g class="entity" data-qualified-name="Forecast" id="ent0003" data-source-line="17"><rect x="212.35" y="222.491" width="313.167" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="222.35" y="246.519" fill="#000" font-size="13" textLength="229.493" font-family="Segoe UI">Compare to 20 total project hours/week</text><text x="222.35" y="263.81" fill="#000" font-size="13" textLength="293.167" font-family="Segoe UI">Actual availability/progress and dependency delays</text><text x="222.35" y="281.101" fill="#000" font-size="13" textLength="195.292" font-family="Segoe UI">Requested date remains a request</text></g><!--entity Tracking--><g class="entity" data-qualified-name="Tracking" id="ent0004" data-source-line="18"><rect x="55.77" y="340.011" width="262.322" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="65.77" y="364.039" fill="#000" font-size="13" textLength="234.762" font-family="Segoe UI">Inspect/reconcile actual live issues/board</text><text x="65.77" y="381.33" fill="#000" font-size="13" textLength="242.322" font-family="Segoe UI">Select first ready Sprint Goal / items / plan</text></g><!--entity Baseline--><g class="entity" data-qualified-name="Baseline" id="ent0005" data-source-line="19"><rect x="7" y="440.241" width="359.866" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="464.269" fill="#000" font-size="13" textLength="301.831" font-family="Segoe UI">Complete agreed initial SDLC documentation/design</text><text x="17" y="481.56" fill="#000" font-size="13" textLength="339.866" font-family="Segoe UI">Actual pre-implementation baseline decision before coding</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="25"><path d="M355.76,336.361 L355.76,398.234 A0,0 0 0 0 355.76,398.234 L746.098,398.234 A0,0 0 0 0 746.098,398.234 L746.098,346.361 L736.098,336.361 L503.14,336.361 L429.03,294.721 L495.14,336.361 L355.76,336.361 A0,0 0 0 0 355.76,336.361" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M736.098,336.361 L736.098,346.361 L746.098,346.361 L736.098,336.361" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="361.76" y="355.389" fill="#000" font-size="13" textLength="365.638" font-family="Segoe UI">No hours, throughput or accepted delivery date estimated here.</text><text x="361.76" y="372.68" fill="#000" font-size="13" textLength="339.339" font-family="Segoe UI">Do not fix all future Sprints or silently reduce agreed scope.</text><text x="361.76" y="389.971" fill="#000" font-size="13" textLength="369.338" font-family="Segoe UI">A coherent commit records change; it is not acceptance by itself.</text></g><!--link Inputs to Work--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="20" data-link-type="dependency"><path d="M368.93,84.071 C368.93,96.071 368.93,107.101 368.93,120.601" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Inputs-to-Work"/><polygon points="368.93,125.601,372.93,116.601,368.93,120.601,364.93,116.601,368.93,125.601" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Work to Forecast--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="21" data-link-type="dependency"><path d="M368.93,180.781 C368.93,193.451 368.93,203.771 368.93,217.371" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Work-to-Forecast"/><polygon points="368.93,222.371,372.93,213.371,368.93,217.371,364.93,213.371,368.93,222.371" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Forecast to Tracking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M308.84,294.721 C283.99,309.311 259.962,323.42 236.862,336.98" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Forecast-to-Tracking"/><polygon points="232.55,339.511,242.336,338.405,236.862,336.98,238.287,331.505,232.55,339.511" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Tracking to Baseline--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="23" data-link-type="de