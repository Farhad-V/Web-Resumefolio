<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390"><rect width="100%" height="100%" fill="#0D1525"/><text x="30" y="36" font-family="Segoe UI, sans-serif" font-size="18" fill="#EDF4FF">As-Is — evidence-bounded current-process view</text><rect x="30" y="90" width="740" height="150" rx="0" fill="#0D1525" stroke="#DFE6F1" stroke-width="2"/><text x="85" y="151" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">Current preparation / sharing workflow</text><text x="85" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">Black-box participant: internal actions and sequence not observed.</text><text x="85" y="193" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">Do not infer the target process is today&#x27;s actual routine.</text><text x="30" y="291" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">BPMN 2.0 black-box pool; deliberately no invented sequence flow.</text><text x="30" y="312" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">CP-P01/02 and CP-H01/02 identify evidence needs and hypotheses.</text><text x="30" y="333" font-family="Segoe UI, sans-serif" font-size="15" fill="#EDF4FF">This records the evidence boundary, not a completed As-Is study.</text></svg>