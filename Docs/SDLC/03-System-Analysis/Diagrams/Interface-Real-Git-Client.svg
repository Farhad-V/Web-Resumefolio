<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:889px;height:337px;background:#0D1525;" width="889px" height="337px" viewBox="0 0 889 337" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="889" height="337" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="16"><text x="333.107" y="25.107" fill="#EDF4FF" font-size="14" textLength="215.852" font-weight="700" font-family="Segoe UI">IF-06 — Real Git-client boundary</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" id="ent0001" data-source-line="17"><rect x="7" y="77.521" width="168.269" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="101.549" fill="#EDF4FF" font-size="13" textLength="148.269" font-family="Segoe UI">Supported real Git client /</text><text x="17" y="118.84" fill="#EDF4FF" font-size="13" textLength="133.396" font-family="Segoe UI">intended repository-ref</text></g><!--entity Product--><g class="entity" data-qualified-name="Product" id="ent0002" data-source-line="18"><rect x="578.17" y="77.521" width="178.99" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="588.17" y="101.549" fill="#EDF4FF" font-size="13" textLength="158.99" font-family="Segoe UI">ProjectForge real repository</text><text x="588.17" y="118.84" fill="#EDF4FF" font-size="13" textLength="95.069" font-family="Segoe UI">access boundary</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="23"><path d="M461.27,169.881 L461.27,231.754 A0,0 0 0 0 461.27,231.754 L874.066,231.754 A0,0 0 0 0 874.066,231.754 L874.066,179.881 L864.066,169.881 L671.67,169.881 L667.67,132.441 L663.67,169.881 L461.27,169.881 A0,0 0 0 0 461.27,169.881" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M864.066,169.881 L864.066,179.881 L874.066,179.881 L864.066,169.881" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="467.27" y="188.909" fill="#EDF4FF" font-size="13" textLength="370.246" font-family="Segoe UI">Transport / credentials / client versions / Git engine not selected.</text><text x="467.27" y="206.2" fill="#EDF4FF" font-size="13" textLength="391.796" font-family="Segoe UI">Admin root SSH and development GitHub are not product Git proof.</text><text x="467.27" y="223.491" fill="#EDF4FF" font-size="13" textLength="386.452" font-family="Segoe UI">Browser PR/review/merge is IF-01; push grants no deploy authority.</text></g><!--link Client to Product--><!--link Client to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="20" data-link-type="dependency"><path d="M175.53,111.691 C183.21,112.151 190.88,112.541 198.27,112.811 C330.34,117.781 478.474,113.433 572.714,109.433" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Client-to-Product-1"/><polygon points="577.71,109.221,568.548,105.606,572.714,109.433,568.888,113.599,577.71,109.221" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="229.27" y="91.839" fill="#EDF4FF" font-size="13" textLength="178.807" font-family="Segoe UI">Authorized clone/fetch/pull OR</text><text x="275.995" y="109.13" fill="#EDF4FF" font-size="13" textLength="85.357" font-family="Segoe UI">push/ref intent</text></g><!--link Product to Client--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="21" data-link-type="dependency"><path d="M577.75,112.431 C539.84,118.701 496.35,130.091 461.27,150.811 C447.98,158.661 452.34,170.481 438.27,176.811 C341.02,220.631 300.23,208.141 198.27,176.811 C169.75,168.051 145.871,151.918 125.901,135.488" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Product-to-Client"/><polygon poi