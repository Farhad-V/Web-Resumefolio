<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:700px;height:593px;background:#0D1525;" width="700px" height="593px" viewBox="0 0 700 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="700" height="593" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="16"><text x="168.368" y="25.107" fill="#EDF4FF" font-size="14" textLength="356.556" font-weight="700" font-family="Segoe UI">DC-O02 — Apply selected source changes to one draft</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="17"><rect x="275.82" y="46.621" width="177.892" height="71.873" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="285.82" y="70.649" fill="#EDF4FF" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="285.82" y="87.94" fill="#EDF4FF" font-size="13" textLength="157.892" font-family="Segoe UI">Source differs; independent</text><text x="285.82" y="105.231" fill="#EDF4FF" font-size="13" textLength="153.315" font-family="Segoe UI">draft/live/history identified</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="18"><rect x="95.61" y="196.491" width="224.306" height="71.873" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="105.61" y="220.519" fill="#EDF4FF" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="105.61" y="237.81" fill="#EDF4FF" font-size="13" textLength="204.306" font-family="Segoe UI">Selected draft saved; live and actual</text><text x="105.61" y="255.101" fill="#EDF4FF" font-size="13" textLength="98.89" font-family="Segoe UI">history preserved</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="19"><rect x="93.32" y="311.361" width="228.889" height="71.873" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="103.32" y="335.389" fill="#EDF4FF" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="103.32" y="352.68" fill="#EDF4FF" font-size="13" textLength="208.889" font-family="Segoe UI">Other resumes and overrides remain</text><text x="103.32" y="369.971" fill="#EDF4FF" font-size="13" textLength="72.973" font-family="Segoe UI">independent</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="23"><path d="M358.24,210.141 L358.24,254.723 L685.292,254.723 L685.292,220.141 L675.292,210.141 L358.24,210.141" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M675.292,210.141 L675.292,220.141 L685.292,220.141 L675.292,210.141" style="stroke:#F1AD8A;stroke-width:1;" fill="#4A302B"/><text x="364.24" y="229.169" fill="#EDF4FF" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="364.24" y="246.46" fill="#EDF4FF" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="27"><path d="M6,426.241 L6,488.114 A0,0 0 0 0 6,488.114 L409.529,488.114 A0,0 0 0 0 409.529,488.114 L409.529,436.241 L399.529,426.241 L211.76,426.241 L207.76,383.621 L203.76,426.241 L6,426.241 A0,0 0 0 0 6,426.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M399.529,426.241 L399.529,436.241 L409.529,436.241 L399.529,426.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="12" y="445.269" fill="#EDF4FF" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.56" fill="#EDF4FF" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="479.851" fill="#EDF4FF" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="20" data-link-type="dependency"><path d="M314.42,118.901 C305.95,125.461 297.43,132.471 289.76,139.491 C270.68,156.971 254.556,174.659 239.436,192.469" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="236.2,196.281,245.074,192.009,239.436,192.469,238.975,186.831,236.2,196.281" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="368.344" y="154.519" fill="#EDF4FF" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O02</text><text x="290.76" y="171.81" fill="#EDF4FF" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="23" data-link-type="association"><path d="M454.16,107.751 C470.48,115.621 486.04,125.961 497.76,139.491 C514.83,159.191 519.97,189.591 521.41,209.981" style="stroke:#91AED1;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="31"><rect x="65.984" y="509.114" width="561.325" height="65.863" fill="none" style="stroke:#FFF;stroke-width:1;" rx="7.5" ry="7.5"/><text x="70.984" y="529.222" fill="#EDF4FF" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="70.984" y="547.843" fill="#EDF4FF" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="70.984" y="566.464" fill="#EDF4FF" font-size="14" textLength="551.325" font-family="Segoe UI">No transaction, implementation component, rollback or deployment authority is selected.</text></g><?plantuml-src TLJ1RkCs4BthAmQxXxQ0PLkEqsOtG07PbXO64djX9osAkWU66jc4AL8WAQVkgH_HBzmlsQ4ePzKq1Gp39eTlvhrvCz_1-jTLjedlV_aSJyQJ7-CaYSTJC7WI-FmHw1YuDWWZu4PR6_F6EQ7sGvZxqzgWHUMO4rgDM5rBmSFlKaYqe0tO0pDO06lSGHlXpYE3N9_Gd46e4pE2AKV9AYQKXGxWIU8miaUXQcPO1K-C7_T6DwgOQqc8xyUBv7fotOiei6IDTBbMhWl95laqpzyEMR4AOOjxZV2uV3jaA_v2IAvwbqIZqCz474ecBVPkKcFqSvVsGv9cYwHtIMGTKtk9izSaadJoOJf-CrIR0it_8Ihj_WisJQ_6azdhg3vEdgIBc_HV4GMrheQhctuDJ1tzuNGIELs3q_2adTEaZV3bKMEZo0ad4HRpU3sUm9U__u6KkdO6Yv8YgDDMDuOZy0EH8GiGXbO8XM6bYruumhjPbgyt6Tagkrj-MiwMTyk7ttPg6nuNeYpHs5loI84rqfToEzLYZAGuuUWWhDFUG_v6b0ABTy0ipB0aL_RJpDUhVBcvpnQmVPpFi-qMrgixd-XIRWiAbfsmk0MF3KoHNRbhcDofIvxMv-RKfKbBXwQV9T-azvxBvytw8Pi_KBRxB5qjLvzsQkqEQAYvjgb83O_jtM-eSDlvVgTwB5lyt7YBlaz-cewlqoYGWZZ-EII6ZvtwErMZgOJpD904uwwhczh1jIg5gR28mfluzuCeAC4Vv695I6sAoDlaqc9TNkIRDyPGAO1_CWzvcTos-BAHqgj1-8NmXWXJUnv63wGLq8U1r7kQOkbhSCP369JjLXXuNn8iqXAXlz0QT1WHyzQmhyi9DIxB2pa29viwmUG0l5n-6idRZJeg8ZM0GhVuN39H1Qc6qQD5Qcw5iIQjsYA0DXi9mR7TH8eBASBvzrxLgviVXb7GdoujrUyNa_FSNX02ZLxJV2ZlH7lMvjYZ977lVmTIKUxLes5hd1ru5KUrjkwRb0CeVUO1ISInxjIbrxMcjKWZHdkseHCoWr34bfEbA6Co7aOfzm_81xNHVlM6dVsoLxlRMz2j6mjqJCZGB7f0HVWDhPWyM-5TMGg57deOhJIG1Ceo7eYBgfRjLP2CwwgcwLPk04PBwJUrxmW98_MvBUwRUmZviYDQVO8oNm40?></g></svg>