<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1049px;height:480px;background:#FFFFFF;" width="1049px" height="480px" viewBox="0 0 1049 480" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="364.947" y="25.107" fill="#000" font-size="14" textLength="312.143" font-weight="700" font-family="Segoe UI">SQ — mixed workload and observed host limits</text></g><!--entity Host--><g class="entity" data-qualified-name="Host" id="ent0001" data-source-line="15"><rect x="83.44" y="46.621" width="255.447" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.44" y="70.649" fill="#000" font-size="13" textLength="151.023" font-family="Segoe UI">Observed demo allocation</text><text x="93.44" y="87.94" fill="#000" font-size="13" textLength="184.057" font-family="Segoe UI">2 vCPU / 4 GB RAM / 40 GB disk</text><text x="93.44" y="105.231" fill="#000" font-size="13" textLength="235.447" font-family="Segoe UI">Historical observation, not capacity proof</text></g><!--entity Mix--><g class="entity" data-qualified-name="Mix" id="ent0002" data-source-line="16"><rect x="62.03" y="238.621" width="298.256" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="72.03" y="262.649" fill="#000" font-size="13" textLength="161.357" font-family="Segoe UI">Competing logical workload</text><text x="72.03" y="279.94" fill="#000" font-size="13" textLength="269.471" font-family="Segoe UI">Private/employer paths + files/media + real Git</text><text x="72.03" y="297.231" fill="#000" font-size="13" textLength="278.256" font-family="Segoe UI">Conditional processing / maintenance / recovery</text></g><!--entity Evidence--><g class="entity" data-qualified-name="Evidence" id="ent0003" data-source-line="17"><rect x="685.32" y="151.271" width="349.716" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="695.32" y="175.299" fill="#000" font-size="13" textLength="329.716" font-family="Segoe UI">Defined current workload + limits + actual later measures</text><text x="695.32" y="192.59" fill="#000" font-size="13" textLength="326.549" font-family="Segoe UI">Admission / degradation / errors / retained/temp growth</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M15.15,156.271 L15.15,200.853 A0,0 0 0 0 15.15,200.853 L407.164,200.853 A0,0 0 0 0 407.164,200.853 L407.164,166.271 L397.164,156.271 L215.16,156.271 L211.16,118.731 L207.16,156.271 L15.15,156.271 A0,0 0 0 0 15.15,156.271" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M397.164,156.271 L397.164,166.271 L407.164,166.271 L397.164,156.271" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="21.15" y="175.299" fill="#000" font-size="13" textLength="349.153" font-family="Segoe UI">Nginx / MySQL / PHP-FPM and Laravel demo were observed.</text><text x="21.15" y="192.59" fill="#000" font-size="13" textLength="371.014" font-family="Segoe UI">Idle free memory/disk does not prove combined usable capacity.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,348.271 L6,392.853 A0,0 0 0 0 6,392.853 L416.321,392.853 A0,0 0 0 0 416.321,392.853 L416.321,358.271 L406.321,348.271 L215.16,348.271 L211.16,310.731 L207.16,348.271 L6,348.271 A0,0 0 0 0 6,348.271" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M406.321,348.271 L406.321,358.271 L416.321,358.271 L406.321,348.271" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="367.299" fill="#000" font-size="13" textLength="389.321" font-family="Segoe UI">Conditional jobs still need independent enabling/isolation evidence.</text><text x="12" y="384.59" fill="#000" font-size="13" textLength="333.322" font-family="Segoe UI">This model does not choose co-hosting or new purchases.</text></g><!--link Host to Evidence--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M339.22,101.411 C437.94,116.061 571.004,135.797 680.024,151.977" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Host-to-Evidence"/><polygon points="684.97,152.711,676.655,147.433,680.024,151.977,675.48,155.347,684.97,152.711" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="438.32" y="112.379" fill="#000" font-size="13" textLength="225.767" font-family="Segoe UI">actual evaluated configuration required</text></g><!--link Mix to Evidence--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M360.6,252.531 C457.23,238.201 578.734,220.175 680.114,205.125" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Mix-to-Evidence"/><polygon points="685.06,204.391,675.57,201.756,680.114,205.125,676.745,209.669,685.06,204.391" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="477.32" y="205.639" fill="#000" font-size="13" textLength="147.532" font-family="Segoe UI">users are not concurrency</text></g><g class="legend" data-source-line="29"><rect x="254.116" y="413.853" width="533.804" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="259.116" y="433.961" fill="#000" font-size="14" textLength="523.804" font-family="Segoe UI">Logical analysis / evidence boundaries, not installed controls or selected architecture.</text><text x="259.116" y="452.582" fill="#000" font-size="14" textLength="492.762" font-family="Segoe UI">No security, load, provider, backup, restore or live-change operation performed.</text></g><?plantuml-src TLJBSjj64BpZAwRi