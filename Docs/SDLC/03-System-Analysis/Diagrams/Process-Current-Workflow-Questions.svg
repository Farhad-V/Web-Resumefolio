<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:666px;height:541px;background:#FFFFFF;" width="666px" height="541px" viewBox="0 0 666 541" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="177.983" y="25.107" fill="#000" font-size="14" textLength="303.078" font-weight="700" font-family="Segoe UI">CP — bounded current-process evidence need</text></g><!--entity Areas--><g class="entity" data-qualified-name="Areas" id="ent0001" data-source-line="15"><rect x="114.274" y="46.621" width="374.885" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="124.274" y="70.649" fill="#000" font-size="13" textLength="199.996" font-family="Segoe UI">Eight source-defined process areas</text><text x="124.274" y="87.94" fill="#000" font-size="13" textLength="354.885" font-family="Segoe UI">Preparation / presentation / actual applications / coordination</text><text x="124.274" y="105.231" fill="#000" font-size="13" textLength="318.011" font-family="Segoe UI">Work / Git-execution / files-admin / operating-recovery</text></g><!--entity Case--><g class="entity" data-qualified-name="Case" id="ent0002" data-source-line="16"><rect x="112.684" y="179.491" width="378.059" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="122.684" y="203.519" fill="#000" font-size="13" textLength="200.814" font-family="Segoe UI">For a relevant actual case, establish</text><text x="122.684" y="220.81" fill="#000" font-size="13" textLength="342.278" font-family="Segoe UI">Actor + trigger + actual inputs/steps/tools/handoffs/output</text><text x="122.684" y="238.101" fill="#000" font-size="13" textLength="358.059" font-family="Segoe UI">Authority/provenance + exceptions + observed time if needed</text></g><!--entity Limit--><g class="entity" data-qualified-name="Limit" id="ent0003" data-source-line="17"><rect x="83.104" y="312.371" width="437.231" height="54.582" fill="#FFF3DF" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.104" y="336.399" fill="#000" font-size="13" textLength="194.74" font-family="Segoe UI">Keep unresolved elements explicit</text><text x="93.104" y="353.69" fill="#000" font-size="13" textLength="417.231" font-family="Segoe UI">No target use case or reference-project name substitutes for observation</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M61.224,409.951 L61.224,454.533 A0,0 0 0 0 61.224,454.533 L542.207,454.533 A0,0 0 0 0 542.207,454.533 L542.207,419.951 L532.207,409.951 L305.714,409.951 L301.714,367.341 L297.714,409.951 L61.224,409.951 A0,0 0 0 0 61.224,409.951" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M532.207,409.951 L532.207,419.951 L542.207,419.951 L532.207,409.951" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="67.224" y="428.979" fill="#000" font-size="13" textLength="432.948" font-family="Segoe UI">This is an evidence plan, not a performed session or invented as-is diagram.</text><text x="67.224" y="446.27" fill="#000" font-size="13" textLength="459.983" font-family="Segoe UI">No broad study is added as a blanket new gate for independent analysis/design.</text></g><!--link Areas to Case--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M301.714,118.971 C301.714,137.751 301.714,155.731 301.714,174.441" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Areas-to-Case"/><polygon points="301.714,179.441,305.714,170.441,301.714,174.441,297.714,170.441,301.714,179.441" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.714" y="154.519" fill="#000" font-size="13" textLength="292.106" font-family="Segoe UI">only if a dependent conclusion needs this evidence</text></g><!--link Case to Limit--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M301.714,251.781 C301.714,270.961 301.714,289.281 301.714,306.931" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Case-to-Limit"/><polygon points="301.714,311.931,305.714,302.931,301.714,306.931,297.714,302.931,301.714,311.931" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.714" y="287.399" fill="#000" font-size="13" textLength="216.119" font-family="Segoe UI">record source / date / method / limits</text></g><g class="legend" data-source-line="25"><rect x="12" y="475.533" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="495.641" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="514.262" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLJBRXit5DtFLrmaYoxiySIlf7600h5Z5KKQnwZRPkCDXxmpmueY9tn8LbVzY7vXlgI77BsQfe0WYUHzddlE_Ou-Vhgx_QN-yFjzVVRYx6LzUbg_k23FIyshA_h0SN2A6b9EfWNRI5OiTI-YTlQ47gGRkTPMySZumkledUGGchtLctotr8ezEKy-MOj__2GMe-50mZDP5mdfOSUUFoSTTEHmKeMvjgFmOa6jaFFUksJLZJC8iXfWSV2kk1F9n9cpyKuic1wuTqo__VHjamVz9zFf-S5Z68HoAsrxweG9Xv7VUkzMKzBdbsSlhrzT7pnwbb7Otl3rL_KzltqtkvXzszHv8F5_4O74VuFDPhFpTxElhGxZNBz-VNdvwbyMYWEFTFxzOGt2plFbnLaLTJHCD_VqvQ-_gSsvM95CtcE4zMQ4n7beLc8-pAgARgJeO1oZ0vmwTuJfLhlEwDcjxeT8mIKlkGRWsYBgDXe6BSAZlVUSgyck81Kc7f1oUnGo9c58ZAFHibm6t4g7NhKjvqVxoVavBd_KiUOdbcdZsccmgHPgeVC9hCmvR5-ZFBTaltv68c2QgE6muXdG4nYEuQK0UJVvfGXyJ1oYQ8qEmwDzAoCCZoXwtVUS_sqi0MsAeGcHnz14vqne1c6Lwx