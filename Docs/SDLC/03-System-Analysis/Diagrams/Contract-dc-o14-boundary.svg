<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:713px;height:593px;background:#FFFFFF;" width="713px" height="593px" viewBox="0 0 713 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="161.33" y="25.107" fill="#000" font-size="14" textLength="383.633" font-weight="700" font-family="Segoe UI">AFTER MVP — DC-O14 — Unlink a local provider mapping</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="16"><rect x="291.49" y="46.621" width="256.539" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="301.49" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="301.49" y="87.94" fill="#000" font-size="13" textLength="236.539" font-family="Segoe UI">Local association identified; provider may</text><text x="301.49" y="105.231" fill="#000" font-size="13" textLength="94.32" font-family="Segoe UI">be disconnected</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="17"><rect x="82.07" y="196.491" width="251.397" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.07" y="220.519" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="92.07" y="237.81" fill="#000" font-size="13" textLength="231.397" font-family="Segoe UI">Only intended local mapping removed if</text><text x="92.07" y="255.101" fill="#000" font-size="13" textLength="58.367" font-family="Segoe UI">confirmed</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="18"><rect x="85.96" y="311.361" width="243.603" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="95.96" y="335.389" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="95.96" y="352.68" fill="#000" font-size="13" textLength="223.603" font-family="Segoe UI">Provider event is not deleted by unlink;</text><text x="95.96" y="369.971" fill="#000" font-size="13" textLength="156.749" font-family="Segoe UI">local authority still required</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="22"><path d="M371.24,210.141 L371.24,254.723 L698.292,254.723 L698.292,220.141 L688.292,210.141 L371.24,210.141" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M688.292,210.141 L688.292,220.141 L698.292,220.141 L688.292,210.141" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="377.24" y="229.169" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="377.24" y="246.46" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="26"><path d="M6,426.241 L6,488.114 A0,0 0 0 0 6,488.114 L409.529,488.114 A0,0 0 0 0 409.529,488.114 L409.529,436.241 L399.529,426.241 L211.76,426.241 L207.76,383.621 L203.76,426.241 L6,426.241 A0,0 0 0 0 6,426.241" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.241 L399.529,436.241 L409.529,436.241 L399.529,426.241" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.269" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.56" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="479.851" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="19" data-link-type="dependency"><path d="M291.4,116.911 C278.95,123.201 267.12,130.661 256.76,139.491 C239.28,154.391 228.989,172.506 221.129,191.646" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="219.23,196.271,226.349,189.465,221.129,191.646,218.949,186.426,219.23,196.271" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="335.344" y="154.519" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O14</text><text x="257.76" y="171.81" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="22" data-link-type="association"><path d="M451.66,118.921 C457.47,125.661 463.39,132.721 468.76,139.491 C487.33,162.881 507.12,190.911 520.13,209.821" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="30"><rect x="72.484" y="509.114" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="77.484" y="529.222" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="77.484" y="547.843" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="77.484" y="566.464" fill="#000" font-size="14" textLength=