" y="115.2" fill="#EDF4FF" font-size="13" textLength="159.999" font-family="Segoe UI">conditional actual capability</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="26"><path d="M396.02,165.241 L396.02,227.114 A0,0 0 0 0 396.02,227.114 L821.251,227.114 A0,0 0 0 0 821.251,227.114 L821.251,175.241 L811.251,165.241 L612.63,165.241 L608.63,127.801 L604.63,165.241 L396.02,165.241 A0,0 0 0 0 396.02,165.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M811.251,165.241 L811.251,175.241 L821.251,175.241 L811.251,165.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="402.02" y="184.269" fill="#EDF4FF" font-size="13" textLength="305.43" font-family="Segoe UI">Local unlink needs no active provider write capability.</text><text x="402.02" y="201.56" fill="#EDF4FF" font-size="13" textLength="250.802" font-family="Segoe UI">Local unlink does not delete provider event.</text><text x="402.02" y="218.851" fill="#EDF4FF" font-size="13" textLength="404.231" font-family="Segoe UI">Reconnect does not automatically refresh/replay; conflicts stay explicit.</text></g><!--link User to Product--><!--link User to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="21" data-link-type="dependency"><path d="M184.24,107.111 C191.94,107.541 199.61,107.911 207.02,108.171 C315.47,112.091 435.515,108.492 516.655,104.902" style="stroke:#91AED1;stroke-width:1;" fill="none" id="User-to-Product-1"/><polygon points="521.65,104.681,512.482,101.083,516.655,104.902,512.836,109.075,521.65,104.681" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.339" y="87.199" fill="#EDF4FF" font-size="13" textLength="135.884" font-family="Segoe UI">Local change/unlink OR</text><text x="221.52" y="104.49" fill="#EDF4FF" font-size="13" textLength="137.522" font-family="Segoe UI">selected provider action</text></g><!--link Product to User--