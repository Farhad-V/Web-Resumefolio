<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:717px;height:593px;background:#0D1525;" width="717px" height="593px" viewBox="0 0 717 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="717" height="593" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="16"><text x="98.149" y="25.107" fill="#EDF4FF" font-size="14" textLength="513.994" font-weight="700" font-family="Segoe UI">AFTER MVP — DC-O30 — Attempt a separately target-authorized deployment</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="17"><rect x="318.75" y="46.621" width="210.03" height="71.873" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="328.75" y="70.649" fill="#EDF4FF" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="328.75" y="87.94" fill="#EDF4FF" font-size="13" textLength="190.03" font-family="Segoe UI">Exact target/artifact and separate</text><text x="328.75" y="105.231" fill="#EDF4FF" font-size="13" textLength="183.079" font-family="Segoe UI">approval/conditions established</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="18"><rect x="78.22" y="196.491" width="259.091" height="71.873" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="88.22" y="220.519" fill="#EDF4FF" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="88.22" y="237.81" fill="#EDF4FF" font-size="13" textLength="239.091" font-family="Segoe UI">Intended required target effect confirmed</text><text x="88.22" y="255.101" fill="#EDF4FF" font-size="13" textLength="105.987" font-family="Segoe UI">by actual evidence</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="19"><rect x="88.86" y="311.361" width="237.801" height="71.873" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="98.86" y="335.389" fill="#EDF4FF" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="98.86" y="352.68" fill="#EDF4FF" font-size="13" textLength="217.801" font-family="Segoe UI">Build/merge permission is insufficient;</text><text x="98.86" y="369.971" fill="#EDF4FF" font-size="13" textLength="208.997" font-family="Segoe UI">unknown target needs reconciliation</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="23"><path d="M375.24,210.141 L375.24,254.723 L702.292,254.723 L702.292,220.141 L692.292,210.141 L375.24,210.141" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M692.292,210.141 L692.292,220.141 L702.292,220.141 L692.292,210.141" style="stroke:#F1AD8A;stroke-width:1;" fill="#4A302B"/><text x="381.24" y="229.169" fill="#EDF4FF" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="381.24" y="246.46" fill="#EDF4FF" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="27"><path d="M6,426.241 L6,488.114 A0,0 0 0 0 6,488.114 L409.529,488.114 A0,0 0 0 0 409.529,488.114 L409.529,436.241 L399.529,426.241 L211.76,426.241 L207.76,383.621 L203.76,426.241 L6,426.241 A0,0 0 0 0 6,426.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M399.529,426.241 L399.529,436.241 L409.529,436.241 L399.529,426.241" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="12" y="445.269" fill="#EDF4FF" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.56" fill="#EDF4FF" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="479.851" fill="#EDF4FF" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="20" data-link-type="dependency"><path d="M318.64,106.261 C297.27,114.281 276.06,125.051 258.76,139.491 C240.97,154.351 230.262,172.501 221.992,191.651" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="220.01,196.241,227.25,189.564,221.992,191.651,219.906,186.393,220.01,196.241" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="337.344" y="154.519" fill="#EDF4FF" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O30</text><text x="259.76" y="171.81" fill="#EDF4FF" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="23" data-link-type="association"><path d="M453.94,118.791 C459.6,125.601 465.42,132.721 470.76,139.491 C489.45,163.181 509.92,191.151 523.47,209.971" style="stroke:#91AED1;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="31"><rect x="74.484" y="509.114" width="561.325" height="65.863" fill="none" style="stroke:#FFF;stroke-width:1;" rx="7.5" ry="7.5"/><text x="79.484" y="529.222" fill="#EDF4FF" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="79.484" y="547.843" fill="#EDF4FF" font-size="14" textLength="535.09" font-