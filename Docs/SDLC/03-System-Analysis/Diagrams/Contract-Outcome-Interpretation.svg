<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:976px;height:588px;background:#0D1525;" width="976px" height="588px" viewBox="0 0 976 588" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="976" height="588" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="15"><text x="315.839" y="25.107" fill="#EDF4FF" font-size="14" textLength="338.119" font-weight="700" font-family="Segoe UI">Contract outcomes — evidence required for a claim</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0001" data-source-line="17"><rect x="59.76" y="46.621" width="361.428" height="57.242" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="69.76" y="71.729" fill="#EDF4FF" font-size="14" textLength="262.356" font-family="Segoe UI">Identify exact operation / subject / context</text><text x="69.76" y="90.35" fill="#EDF4FF" font-size="14" textLength="341.428" font-family="Segoe UI">Evaluate current authority and applicable preconditions</text></g><!--entity deny--><g class="entity" data-qualified-name="deny" id="ent0002" data-source-line="18"><rect x="7" y="166.861" width="294.955" height="75.863" fill="#4A302B" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="191.969" fill="#EDF4FF" font-size="14" textLength="97.31" font-family="Segoe UI">Denied / invalid</text><text x="17" y="210.59" fill="#EDF4FF" font-size="14" textLength="237.022" font-family="Segoe UI">No permitted consequential operation</text><text x="17" y="229.211" fill="#EDF4FF" font-size="14" textLength="274.955" font-family="Segoe UI">Do not expose unrelated private information</text></g><!--entity eligible--><g class="entity" data-qualified-name="eligible" id="ent0003" data-source-line="19"><rect x="337.05" y="176.171" width="224.853" height="57.242" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="347.05" y="201.279" fill="#EDF4FF" font-size="14" textLength="94.637" font-family="Segoe UI">Eligible request</text><text x="347.05" y="219.9" fill="#EDF4FF" font-size="14" textLength="204.853" font-family="Segoe UI">Eligibility alone is not completion</text></g><!--entity evidence--><g class="entity" data-qualified-name="evidence" id="ent0004" data-source-line="20"><rect x="308.21" y="305.721" width="282.534" height="57.242" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="318.21" y="330.829" fill="#EDF4FF" font-size="14" textLength="172.874" font-family="Segoe UI">Actual attributable evidence</text><text x="318.21" y="349.45" fill="#EDF4FF" font-size="14" textLength="262.534" font-family="Segoe UI">Assess only the relevant effect and context</text></g><!--entity success--><g class="entity" data-qualified-name="success" id="ent0005" data-source-line="21"><rect x="41.68" y="425.971" width="229.604" height="75.863" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="51.68" y="451.079" fill="#EDF4FF" font-size="14" textLength="170.905" font-family="Segoe UI">Confirmed required success</text><text x="51.68" y="469.7" fill="#EDF4FF" font-size="14" textLength="209.604" font-family="Segoe UI">Claim the matching postcondition</text><text x="51.68" y="488.321" fill="#EDF4FF" font-size="14" textLength="181.699" font-family="Segoe UI">Apply frame to this operation</text></g><!--entity other--><g class="entity" data-qualified-name="other" id="ent0006" data-source-line="22"><rect x="306.06" y="425.971" width="286.841" height="75.863" fill="#4A302B" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="316.06" y="451.079" fill="#EDF4FF" font-size="14" textLength="266.841" font-family="Segoe UI">Definite failure / bounded partial / pending</text><text x="316.06" y="469.7" fill="#EDF4FF" font-size="14" textLength="231.383" font-family="Segoe UI">Report the specific known disposition</text><text x="316.06" y="488.321" fill="#EDF4FF" font-size="14" textLength="242.088" font-family="Segoe UI">Do not claim the success postcondition</text></g><!--entity unknown--><g class="entity" data-qualified-name="unknown" id="ent0007" data-source-line="23"><rect x="628.16" y="425.971" width="334.638" height="75.863" fill="#4A302B" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="638.16" y="451.079" fill="#EDF4FF" font-size="14" textLength="199.876" font-family="Segoe UI">Unknown or contradictory effect</text><text x="638.16" y="469.7" fill="#EDF4FF" font-size="14" textLength="212.071" font-family="Segoe UI">DC-O38: reconcile same operation</text><text x="638.16" y="488.321" fill="#EDF4FF" font-size="14" textLength="314.638" font-family="Segoe UI">No blind consequential repeat or assumed rollback</text></g><!--link request to deny--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="24" data-link-type="dependency"><path d="M221.6,104.231 C209.24,122.571 195.745,142.585 182.305,162.525" style="stroke:#91AED1;stroke-width:1;" fill="none" id="request-to-deny"/><polygon points="179.51,166.671,187.857,161.444,182.305,162.525,181.223,156.972,179.51,166.671" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.18" y="140.81" fill="#EDF4FF" font-size="12" textLength="130.781" font-family="Segoe UI">prerequisite not satisfied</text></g><!--link request to eligible--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="25" data-link-type="dependency"><path d="M303.68,104.341 C317.71,111.221 332.31,118.911 345.48,126.861 C369.7,141.481 391.338,157.275 411.058,172.665" style="stroke:#91AED1;stroke-width:1;" fill="none" id="request-to-eligible"/><polygon points="415,175.741,410.366,167.051,411.058,172.665,405.444,173.357,415,175.741" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.28" y="140.81" fill="#EDF4FF" font-size="12" textLength="171.896" font-family="Segoe UI">applicable prerequisites satisfied</text></g><!--link eligible to evidence--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="26" data-link-type="dependency"><path d="M449.48,233.781 C449.48,255.051 449.48,279.171 449.48,300.421" style="stroke:#91AED1;stroke-width:1;" fill="none" id="eligible-to-evidence"/><polygon points="449.48,305.421,453.48,296.421,449.48,300.421,445.48,296.421,449.48,305.421" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="450.48" y="279.67" fill="#EDF4FF" font-size="12" textLength="88.09" font-family="Segoe UI">inspect outcome</text></g><!--link evidence to success--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="27" data-link-type="dependency"><path d="M358.12,363.441 C338.54,370.221 318.13,377.871 299.48,385.971 C272.97,397.471 249.148,409.687 224.848,423.087" style="stroke:#91AED1;stroke-width:1;" fill="none" id="evidence-to-success"/><polygon points="220.47,425.501,230.283,424.658,224.848,423.087,226.42,417.652,220.47,425.501" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.48" y="399.92" fill="#EDF4FF" font-size="12" textLength="140.602" font-family="Segoe UI">required effect established</text></g><!--link evidence to other--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk12" data-source-line="28" data-link-type="dependency"><path d="M449.48,363.341 C449.48,381.671 449.48,400.841 449.48,420.771" style="stroke:#91AED1;stroke-width:1;" fill="none" id="evidence-to-other"/><polygon points="449.48,425.771,453.48,416.771,449.48,420.771,445.48,416.771,449.48,425.771" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="450.48" y="399.92" fill="#EDF4FF" font-size="12" textLength="218.068" font-family="Segoe UI">bounded evidence of another disposition</text></g><!--link evidence to unknown--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk13" data-source-line="29" data-link-type="dependency"><path d="M591.21,358.521 C620.34,365.571 650.38,374.571 677.48,385.971 C701.71,396.161 722.29,408.513 742.78,422.713" style="stroke:#91AED1;stroke-width:1;" fill="none" id="evidence-to-unknown"/><polygon points="746.89,425.561,741.771,417.147,742.78,422.713,737.214,423.722,746.89,425.561" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="709.52" y="399.92" fill="#EDF4FF" font-size="12" textLength="232.477" font-family="Segoe UI">required evidence unavailable / inconsistent</text></g><g class="legend" data-source-line="30"><rect x="166.577" y="521.834" width="636.644" height="47.242" fill="none" style="stroke:#FFF;stroke-width:1;" rx="7.5" ry="7.5"/><text x="171.577" y="541.942" fill="#EDF4FF" font-size="14" textLength="497.205" font-family="Segoe UI">Interpretation guide, not a new execution algorithm, stored enum or retry policy.</text><text x="171.577" y="560.563" fill="#EDF4FF" font-size="14" textLength="626.644" font-family="Segoe UI">Read-only operations and admission/cancellation requests have their own bounded success meaning.</text></g><?plantuml-src TLNBSkCs4BppAwOsXrnMriDoigj3ghIMLEL3l2blRNBH1GA7qiGWmE0XhtBAH-GByoMP0IcASfmR2vX7JtSF-3ry_krn_JJw-TTVHhF9x8VHT3gQpC7ZaV1b0NmCsdc4CMZlGXZf52FP_GtSosdZCQ2DAfApOzKqXdJxNP710Cv3E2YF9QWK3yvJF8qzQdT4VmAoH-L9sSZDQaKsG5TWP_2c2Cza6-LL3Jkbd_VU9LlUEyCLlvkifdUpkq54YPLA9cwSZLt8UhMPRpPlXpog6k4BxXt2ruUtGxxGdmZJ-U2InoZT2myEbJ811pTBxzrBr_RZTBbUJLzVNYhE1bVCGrHsR_3Jw_ccozd7-UJDKETBzF_NpBhutsBpvUrazkbrrB3EPhfSVLXUHPIiQWEtGuwziizoEByh8aM3hB-DNka8BaNjQbRxdx_-1hPDYLOZO_uZaIXVSGy5sYYgY-WQY0vsBaR7X9C