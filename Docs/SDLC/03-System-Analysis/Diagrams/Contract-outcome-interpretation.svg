<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:976px;height:588px;background:#FFFFFF;" width="976px" height="588px" viewBox="0 0 976 588" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="315.839" y="25.107" fill="#000" font-size="14" textLength="338.119" font-weight="700" font-family="Segoe UI">Contract outcomes — evidence required for a claim</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0001" data-source-line="16"><rect x="59.76" y="46.621" width="361.428" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="69.76" y="71.729" fill="#000" font-size="14" textLength="262.356" font-family="Segoe UI">Identify exact operation / subject / context</text><text x="69.76" y="90.35" fill="#000" font-size="14" textLength="341.428" font-family="Segoe UI">Evaluate current authority and applicable preconditions</text></g><!--entity deny--><g class="entity" data-qualified-name="deny" id="ent0002" data-source-line="17"><rect x="7" y="166.861" width="294.955" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="191.969" fill="#000" font-size="14" textLength="97.31" font-family="Segoe UI">Denied / invalid</text><text x="17" y="210.59" fill="#000" font-size="14" textLength="237.022" font-family="Segoe UI">No permitted consequential operation</text><text x="17" y="229.211" fill="#000" font-size="14" textLength="274.955" font-family="Segoe UI">Do not expose unrelated private information</text></g><!--entity eligible--><g class="entity" data-qualified-name="eligible" id="ent0003" data-source-line="18"><rect x="337.05" y="176.171" width="224.853" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="347.05" y="201.279" fill="#000" font-size="14" textLength="94.637" font-family="Segoe UI">Eligible request</text><text x="347.05" y="219.9" fill="#000" font-size="14" textLength="204.853" font-family="Segoe UI">Eligibility alone is not completion</text></g><!--entity evidence--><g class="entity" data-qualified-name="evidence" id="ent0004" data-source-line="19"><rect x="308.21" y="305.721" width="282.534" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="318.21" y="330.829" fill="#000" font-size="14" textLength="172.874" font-family="Segoe UI">Actual attributable evidence</text><text x="318.21" y="349.45" fill="#000" font-size="14" textLength="262.534" font-family="Segoe UI">Assess only the relevant effect and context</text></g><!--entity success--><g class="entity" data-qualified-name="success" id="ent0005" data-source-line="20"><rect x="41.68" y="425.971" width="229.604" height="75.863" fill="#DFF1EA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="51.68" y="451.079" fill="#000" font-size="14" textLength="170.905" font-family="Segoe UI">Confirmed required success</text><text x="51.68" y="469.7" fill="#000" font-size="14" textLength="209.604" font-family="Segoe UI">Claim the matching postcondition</text><text x="51.68" y="488.321" fill="#000" font-size="14" textLength="181.699" font-family="Segoe UI">Apply frame to this operation</text></g><!--entity other--><g class="entity" data-qualified-name="other" id="ent0006" data-source-line="21"><rect x="306.06" y="425.971" width="286.841" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="316.06" y="451.079" fill="#000" font-size="14" textLength="266.841" font-family="Segoe UI">Definite failure / bounded partial / pending</text><text x="316.06" y="469.7" fill="#000" font-size="14" textLength="231.383" font-family="Segoe UI">Report the specific known disposition</text><text x="316.06" y="488.321" fill="#000" font-size="14" textLength="242.088" font-family="Segoe UI">Do not claim the success postcondition</text></g><!--entity unknown--><g class="entity" data-qualified-name="unknown" id="ent0007" data-source-line="22"><rect x="628.16" y="425.971" width="334.638" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="638.16" y="451.079" fill="#000" font-size="14" textLength="199.876" font-family="Segoe UI">Unknown or contradictory effect</text><text x="638.16" y="469.7" fill="#000" font-size="14" textLength="212.071" font-family="Segoe UI">DC-O38: reconcile same operation</text><text x="638.16" y="488.321" fill="#000" font-size="14" textLength="314.638" font-family="Segoe UI">No blind consequential repeat or assumed rollback</text></g><!--link request to deny--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M221.6,104.231 C209.24,122.571 195.745,142.585 182.305,162.525" style="stroke:#486777;stroke-width:1;" fill="none" id="request-to-deny"/><polygon points="179.51,166.671,187.857,161.444,182.305,162.525,181.223,156.972,179.51,166.671" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.18" y="140.81" fill="#000" font-size="12" textLength="130.781" font-family="Segoe UI">prerequisite not satisfied</text></g><!--link request to eligible--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="24" data-link-type="dependency"><path d="M303.68,104.341 C317.71,111.221 332.31,118.911 345.48,126.861 C369.7,141.481 391.338,157.275 411.058,172.665" style="stroke:#486777;stroke-width:1;" fill="none" id="request-to-eligible"/><polygon points="415,175.741,410.366,167.051,411.058,172.665,405.444,173.357,415,175.741" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x=