<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:761px;height:581px;background:#0D1525;" width="761px" height="581px" viewBox="0 0 761 581" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="761" height="581" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="14"><text x="234.794" y="25.107" fill="#EDF4FF" font-size="14" textLength="284.751" font-weight="700" font-family="Segoe UI">HD — delivery reconciliation before coding</text></g><!--entity Inputs--><g class="entity" data-qualified-name="Inputs" id="ent0001" data-source-line="16"><rect x="192" y="46.621" width="354.414" height="37.291" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="202" y="70.649" fill="#EDF4FF" font-size="13" textLength="334.414" font-family="Segoe UI">Current requirements + analysis/design + remaining gates</text></g><!--entity Work--><g class="entity" data-qualified-name="Work" id="ent0002" data-source-line="17"><rect x="192.5" y="125.621" width="352.668" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="202.5" y="149.649" fill="#EDF4FF" font-size="13" textLength="251.52" font-family="Segoe UI">Reviewable work outcomes + dependencies</text><text x="202.5" y="166.94" fill="#EDF4FF" font-size="13" textLength="332.668" font-family="Segoe UI">Include learning/docs/testing/recovery/operations/rework</text></g><!--entity Forecast--><g class="entity" data-qualified-name="Forecast" id="ent0003" data-source-line="18"><rect x="239" y="222.621" width="260.138" height="71.873" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="249" y="246.649" fill="#EDF4FF" font-size="13" textLength="185.561" font-family="Segoe UI">Review scope and dependencies</text><text x="249" y="263.94" fill="#EDF4FF" font-size="13" textLength="240.138" font-family="Segoe UI">Verify actual progress and required inputs</text><text x="249" y="281.231" fill="#EDF4FF" font-size="13" textLength="153.924" font-family="Segoe UI">Retain unresolved blockers</text></g><!--entity Tracking--><g class="entity" data-qualified-name="Tracking" id="ent0004" data-source-line="19"><rect x="56" y="340.121" width="262.322" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66" y="364.149" fill="#EDF4FF" font-size="13" textLength="234.762" font-family="Segoe UI">Inspect/reconcile actual live issues/board</text><text x="66" y="381.44" fill="#EDF4FF" font-size="13" textLength="242.322" font-family="Segoe UI">Select first ready Sprint Goal / items / plan</text></g><!--entity Baseline--><g class="entity" data-qualified-name="Baseline" id="ent0005" data-source-line="20"><rect x="7" y="440.621" width="359.866" height="54.582" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="464.649" fill="#EDF4FF" font-size="13" textLength="301.831" font-family="Segoe UI">Complete agreed initial SDLC documentation/design</text><text x="17" y="481.94" fill="#EDF4FF" font-size="13" textLength="339.866" font-family="Segoe UI">Actual pre-implementation baseline decision before coding</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="26"><path d="M356,336.621 L356,398.494 A0,0 0 0 0 356,398.494 L746.338,398.494 A0,0 0 0 0 746.338,398.494 L746.338,346.621 L736.338,336.621 L503.83,336.621 L428.59,294.661 L495.83,336.621 L356,336.621 A0,0 0 0 0 356,336.621" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M736.338,336.621 L736.338,346.621 L746.338,346.621 L736.338,336.621" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="362" y="355.649" fill="#EDF4FF" font-size="13" textLength="332.947" font-family="Segoe UI">Work is selected by prerequisites and observed outcomes.</text><text x="362" y="372.94" fill="#EDF4FF" font-size="13" textLength="339.339" font-family="Segoe UI">Do not fix all future Sprints or silently reduce agreed scope.</text><text x="362" y="390.231" fill="#EDF4FF" font-size="13" textLength="369.338" font-family="Segoe UI">A coherent commit records change; it is not acceptance by itself.</text></g><!--link Inputs to Work--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="21" data-link-type="dependency"><path d="M369,83.941 C369,95.941 369,106.991 369,120.501" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Inputs-to-Work"/><polygon points="369,125.501,373,116.501,369,120.501,365,116.501,369,125.501" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Work to Forecast--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="22" data-link-type="dependency"><path d="M369,180.771 C369,193.471 369,203.831 369,217.471" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Work-to-Forecast"/><polygon points="369,222.471,373,213.471,369,217.471,365,213.471,369,222.471" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Forecast to Tracking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M309.41,294.661 C284.32,309.411 259.911,323.758 236.601,337.458" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Forecast-to-Tracking"/><polygon points="232.29,339.991,242.076,338.879,236.601,337.458,238.022,331.982,232.29,339.991" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Tracking to Baseline--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="24" data-link-type="dependency"><path d="M187,395.281 C187,409.291 187,421.421 187,435.441" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Tracking-to-Baseline"/><polygon points="187,440.441,191,431.441,187,435.441,183,431.441,187,440.441" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="31"><rect x="39.464" y="515.203" width="675.41" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="44.464" y="535.311" fill="#EDF4FF" font-size="14" textLength="665.41" font-family="Segoe UI">Qualified analysis/design input, not a selected architecture, accepted delivery outcome or operational proof.</text><text x="44.464" y="553.932" fill="#EDF4FF" font-size="14" textLength="621.927" font-family="Segoe UI">No coding, provider/host operation, live tracker update, spending or baseline acceptance performed.</text></g><?plantuml-src TLJ1SYCr4BtFLtJj7ZXWUsp7WLssYYedZY5LR5XYsBtaef7Qjh2i7jIQ9ER4H_25V0ajZSSPad2nDLBhTRz-h_KL_Fpbvkfs-F7pf-5qFFrcE9aCnpC8U6_nuJluQ1_HW1n22UicDW57S8jHMI_RLI1bC0phGARH4HGpQQkY9S-2y4TZ0m8-rivg6u_NmPD1SAf2nnyoSCF8GDuTG5F0ib9iDNmAz3lgkAImmL71E-jh5TGUAgLtcq2DDvVaAC3RyM9oFZtlHHXSgyR9JH-F8LUBvMovV3taHkqHLhWXXD-kNmzPsJyH9cUzGzugGm_MRs2j76FlP1u2FHpJlf_ChnQJtc4GGifl75uy9p6PJz_Fng-6Kf0E_n-Yf_WIR3O_6qyldaVrSPQJ-UBT_3yH1XbhE7lNhq7vNTgSJOjeeqFuSG7__FMtjCRPUmo7L2HvRLshE5Iu5lr4H2ETAIBL40agYf6adJOnagZYn0pUN3OXe8-TK_QoPlWQb5Vkm9PBgSbklEp8cHWkzNkZ8l8RCHfS-xg9t8UxpPPLbQmVAEo0cgXfZmdIO8tUe1IBVEUllNPDCY6ga51BGvfB0Oxf8x5Az4ggCRHUbhs4cFD-aSNBhC1QmgLqyopNPmnsVG2bOwCSoA1i0ZBdm2Dj0pPJkVFjN47Z9OJSVHemHtg7eMKiiu1QSUndl_PSorVPIO5TfYGHMEO6kQn81NFdL-Wa5DOsSEgvCWTOrS6A03-Gt2Z1Hjop_DTE-Ppnro3UIcBsHQDzxJ1A8c6IYxVHolNLugTBa4OsISRSjgD-TtxUaSUXJPTF4JBDB6RoA4tJbb-OA1TnqSMydNmx6v_FYrPv60w_RyL8F_dhrA1kaNTF9Bf5tkrGYpGSdKjf_OIHKIq3vwubBGw9GHQDfLEjXbGnXgHKPxPHiQ0qSDBcHr3ETQzUssbvvmAmoEIZI_CZh-QfaTb1es8ktBUOvq80zpRcCGk6GMz50lmWCgMwKWwbDTOYZ818TJPAhUjH8UxB8ryK3ZVfesLN_28YsBMLLCydB1jmq48-4LP1RuMeJlKFZhdGF8t_aNAYT1gLrkCaLTpGKSH1s