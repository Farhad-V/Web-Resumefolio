<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:666px;height:586px;background:#0D1525;" width="666px" height="586px" viewBox="0 0 666 586" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="666" height="586" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="14"><text x="206.937" y="25.107" fill="#EDF4FF" font-size="14" textLength="245.171" font-weight="700" font-family="Segoe UI">CP — hypothesis support or rejection</text></g><!--entity Hypothesis--><g class="entity" data-qualified-name="Hypothesis" id="ent0001" data-source-line="16"><rect x="213.378" y="46.621" width="288.652" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="223.378" y="70.649" fill="#EDF4FF" font-size="13" textLength="268.652" font-family="Segoe UI">Specific suspected mechanism / possible effect</text><text x="223.378" y="87.94" fill="#EDF4FF" font-size="13" textLength="268.404" font-family="Segoe UI">State competing explanation and affected case</text></g><!--entity Method--><g class="entity" data-qualified-name="Method" id="ent0002" data-source-line="17"><rect x="26.798" y="144.201" width="395.807" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="36.798" y="168.229" fill="#EDF4FF" font-size="13" textLength="236.825" font-family="Segoe UI">Define actual evidence and interpretation</text><text x="36.798" y="185.52" fill="#EDF4FF" font-size="13" textLength="375.807" font-family="Segoe UI">Relevant case + policy + measure; no invented target/sample size</text></g><!--entity Observe--><g class="entity" data-qualified-name="Observe" id="ent0003" data-source-line="18"><rect x="81.148" y="259.781" width="323.107" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="91.148" y="283.809" fill="#EDF4FF" font-size="13" textLength="250.942" font-family="Segoe UI">Inspect permitted actual case / record limits</text><text x="91.148" y="301.1" fill="#EDF4FF" font-size="13" textLength="303.107" font-family="Segoe UI">Distinguish genuine rework from intended difference</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" id="ent0004" data-source-line="19"><rect x="167.788" y="357.371" width="391.827" height="54.582" fill="#17405A" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="177.788" y="381.399" fill="#EDF4FF" font-size="13" textLength="309.582" font-family="Segoe UI">Support, reject or narrow only what evidence warrants</text><text x="177.788" y="398.69" fill="#EDF4FF" font-size="13" textLength="371.827" font-family="Segoe UI">Unknown remains unknown; no automatic root-cause conclusion</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M142.938,454.951 L142.938,499.533 A0,0 0 0 0 142.938,499.533 L584.457,499.533 A0,0 0 0 0 584.457,499.533 L584.457,464.951 L574.457,454.951 L367.698,454.951 L363.698,412.341 L359.698,454.951 L142.938,454.951 A0,0 0 0 0 142.938,454.951" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M574.457,454.951 L574.457,464.951 L584.457,464.951 L574.457,454.951" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="148.938" y="473.979" fill="#EDF4FF" font-size="13" textLength="420.52" font-family="Segoe UI">Current CP-H rows are untested, not confirmed user/product bottlenecks.</text><text x="148.938" y="491.27" fill="#EDF4FF" font-size="13" textLength="337.022" font-family="Segoe UI">Documentation facts CP-F have a different evidence scope.</text></g><!--link Hypothesis to Method--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="20" data-link-type="dependency"><path d="M320.658,101.541 C302.208,114.791 284.028,127.853 265.608,141.093" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Hypothesis-to-Method"/><polygon points="261.548,144.011,271.19,142.006,265.608,141.093,266.521,135.51,261.548,144.011" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Method to Observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="21" data-link-type="dependency"><path d="M215.648,199.241 C212.798,211.441 211.198,225.991 214.698,238.781 C216.638,245.871 217.481,248.622 221.151,255.092" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Method-to-Observe"/><polygon points="223.618,259.441,222.657,249.639,221.151,255.092,215.698,253.586,223.618,259.441" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="215.698" y="234.809" fill="#EDF4FF" font-size="13" textLength="222.796" font-family="Segoe UI">later separately performed observation</text></g><!--link Observe to Result--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="22" data-link-type="dependency"><path d="M276.408,314.701 C293.188,327.961 309.493,340.843 326.253,354.073" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Observe-to-Result"/><polygon points="330.178,357.171,325.592,348.455,326.253,354.073,320.635,354.734,330.178,357.171" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Result to Hypothesis--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M391.698,357.181 C403.068,345.081 415.448,329.981 423.698,314.371 C439.938,283.641 439.218,273.241 443.698,238.781 C449.128,197.091 460.128,181.991 441.698,144.201 C433.328,127.041 422.491,115.627 407.591,104.477" style="stroke:#91AED1;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Result-to-Hypothesis"/><polygon points="403.588,101.481,408.397,110.076,407.591,104.477,413.19,103.671,403.588,101.481" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="447.618" y="234.809" fill="#EDF4FF" font-size="13" textLength="182.628" font-family="Segoe UI">refine if another explanation fits</text></g><g class="legend" data-source-line="29"><rect x="12" y="520.533" width="635.044" height="47.242" fill="none" style="stroke:#FFF;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="540.641" fill="#EDF4FF" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="559.262" fill="#EDF4FF" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLJBSXit4BplLqmvXnoYvKkKuqULgsXHBFjWsIMMauik87QMH8W5DdYGPaxvY7nXliGDx59QESg9Is0mqptTCp_JvzzlR-xAJxzzAMUJsSjoEYqdSt9yK7nyGpWcQHtJcAIptfSoXg3CTaJNwRHrxDa44PGrOz6sMidkkrQQFLb7VYSSLoHYs5cdmcdiMDe3knCfSn1E2HDGh17AUEeJR3IF2hzNfXLEDBGHShzrDfhgscfa_6cod5xDhWOH5TSYwh2o9lGXDylLVBLwFkHMD4nhtbgchn-V3rchlvYcbuDBqAZi4SIf5jhpu6RXd3tsPLzF5pVBwU0IP8CmMytlVoGnNSnUpoVFXbfNiVk_ZCQ6_oQRBoudi_S_HWtphAQBvQl5auWAqhLq-Mg8GPXzEfpFYg22Phh-Gl_-_G_jJgqDE_RAauzjQrr8qZh-0vYXTX5iIy7InePWqKZb-lC7JlHYtR9KjP98uF4Pu8c6vKuOvHkOguMt58GdhclStfirJCMmNjDoyXlnjrOBayr5mi1GEGvPfF3yWeId3myWXtMNN2l396I8GXDSNR6Hd5Ce4zZ1mPrzxyqTQpuaFwQKz0immOqdV3GiV7Jy5arBheNXKJS8j-Kmzg9fKSV3CHd59uRHgo62ZoOJffPTeq9wseF9PSP9U2X5Mk7MtvkbyebmL7v7MpOneNTyj6vFjKDt4sfJ8Kkbq0ANsEJ2dpUUtO6VzBpJwg9NAcbcHB8hMQDFTDo9yDYH8sv07WY-chsnH_Cmbh7xd-bZZcs3VaborePIYkYJIaRgwD74ZEIEFUO85lzrFhbQ58-wK5c-EpUe-yadFN9wGngQOsLmScDWG4JFQkiQiBKvA2jLd1-anrsnegyv6hqR-00PNIU_gg5uEdLFZ5IZuqMQbRDrRNrEU1qTUXim0UK7S3rYEs7VHJJVGyABD669TwqoEdJ1ZLjdguWsfroQ3Skz7nLBAsDpNf5O7ZBub7D5Em46ua75WH9UsXOR42hdEIuApTlqfyDOh6rqaiiDt0Ch6Q5FeFgszoDj68aLb4uEFyyjT-WJvgwFQMvw