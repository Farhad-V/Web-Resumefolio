font-family="Segoe UI">Gmail provider; actual access</text><text x="1008.78" y="109.72" fill="#EDF4FF" font-size="13" textLength="87.541" font-family="Segoe UI">not established</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="26"><path d="M402.84,160.761 L402.84,222.634 A0,0 0 0 0 402.84,222.634 L780.775,222.634 A0,0 0 0 0 780.775,222.634 L780.775,170.761 L770.775,160.761 L595.81,160.761 L591.81,123.321 L587.81,160.761 L402.84,160.761 A0,0 0 0 0 402.84,160.761" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M770.775,160.761 L770.775,170.761 L780.775,170.761 L770.775,160.761" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="408.84" y="179.789" fill="#EDF4FF" font-size="13" textLength="164.626" font-family="Segoe UI">OAuth has not been created.</text><text x="408.84" y="197.08" fill="#EDF4FF" font-size="13" textLength="297.515" font-family="Segoe UI">Read, draft, send and reply are separate capabilities.</text><text x="408.84" y="214.371" fill="#EDF4FF" font-size="13" textLength="356.935" font-family="Segoe UI">Unknown send: reconcile same attempt before eligible resend.</text></g><!--link User to Product--><!--link User to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="21" data-link-type="dependency"><path d="M198.24,102.711 C205.88,103.111 213.49,103.441 220.84,103.691 C306.24,106.601 397.764,104.527 470.804,101.667" style="stroke:#91AED1;stroke-width:1;" fill="none" id="User-to-Product-1"/><polygon points="475.8,101.471,466.65,97.826,470.804,101.667,466.963,105.82,475.8,101.471" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.203" y="82.719" fill="#EDF4FF" font-size="13" textLength="130.355" font-family="Segoe UI">Selected account/goal;</text><text x="232.34" y="100.01" fill="#EDF4FF" font-size="13" textLength="136.081" font-family="Segoe UI">explicit final send intent</text></g><!--link Product to User--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk8" data-source-line="24" data-link-type="dependency"><path d="M476.03,121.951 C451.75,128.011 426.36,134.741 402.84,141.691 C392.46,144.761 390.51,147.891 379.84,149.691 C310.16,161.471 289.87,164.811 220.84,149.691 C196.84,144.441 176.353,136.056 155.653,125.596" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Product-to-User"/><polygon points="151.19,123.341,157.419,130.97,155.653,125.596,161.027,123.83,151.19,123.341" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="221.84" y="128.719" fill="#EDF4FF" font-size="13" textLength="157.327" font-family="Segoe UI">Truthful bounded result; no</text><text x="234.678" y="146.01" fill="#EDF4FF" font-size="13" textLength="131.65" font-family="Segoe UI">delivery/read inference</text></g><!--link Product to Gmail--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="22" data-link-type="dependency"><path d="M707.61,91.391 C783.69,89.161 885.71,87.341 975.78,89.691 C983.15,89.891 985.784,89.949 993.454,90.259" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Product-to-Gmail"/><polygon points="998.45,90.461,989.619,86.101,993.454,90.259,989.296,94.094,998.45,90.461" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="826.848" y="67.619" fill="#EDF4FF" font-size="13" textLength="126.249" font-family="Segoe UI">Conditional permitted</text><text x="804.78" y="84.91" fill="#EDF4FF" font-size="13" textLength="170.384" font-family="Segoe UI">read/draft/send/reply request</text></g><!--link Gmail to Product--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk7" data-source-line="23" data-link-type="dependency"><path d="M1045.61,123.461 C1025.13,134.591 1000.05,146.081 975.78,151.691 C901.3,168.911 878.62,167.261 803.78,151.691 C792.86,149.421 791.34,145.251 780.78,141.691 C757.38,133.811 736.767,127.89 712.357,121.7" style="stroke:#91AED1;stroke-width:1;" fill="none" id="Gmail-to-Product"/><polygon points="707.51,120.471,715.251,126.561,712.357,121.7,717.217,118.806,707.51,120.471" fill="#91AED1" style="stroke:#91AED1;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="835.202" y="113.719" fill="#EDF4FF" font-size="13" textLength="110.011" font-family="Segoe UI">Content / identity /</text><text x="822.78" y="131.01" fill="#EDF4FF" font-size="13" textLength="134.856" font-family="Segoe UI">acceptance / rejection /</text><text x="858.079" y="148.301" fill="#EDF4FF" font-size="13" textLength="64.257" font-family="Segoe UI">uncertainty</text></g><g class="legend" data-source-line="30"><rect x="263.725" y="243.634" width="663.584" height="65.863" fill="none" style="stroke:#FFF;stroke-width:1;" rx="7.5" ry="7.5"/><text x="268.725" y="263.742" fill="#EDF4FF" font-size="14" textLength="569.659" font-family="Segoe UI">Logical boundary/exchange meaning; not software components or chosen protocol/schema.</text><text x="268.725" y="282.363" fill="#EDF4FF" font-size="14" textLength="577.548" font-family="Segoe UI">Full direction, identity, authority, failure, compatibility and evidence limits are in document 12.</text><text x="268.725" y="300.984" fill="#EDF4FF" font-size="14" textLength="653.584" font-family="Segoe UI">Proposed details remain proposed. No real provider, Git, execution, delivery or recovery action performed.</text></g><?plantuml-src TLHDSzis4BtpL-oaXrxqHLdk9F9CPnJRocIcTJnst1wg7Y1YIQ460HO09Qkd_eZ-mloIl2LLMKxT6qZiFhnz-tQ_fq-_tbpV3N_-vNOudKn_6ERvS3AZm5l3kpajszG69bKc3eIO4Tq6lpMQmu2KtYfNiARx9XYNndtEW7oWrgNGneGxVkAYJSOxGFxPci0rkuHpKiRXMaNIN788h4TPV3IkKK7Lj5R5OnLyw_Ibjy3xRdALdq_FJoAGfLgRbjwbGyZrrNAsNBuUSgDgfdkkFDF3nzT3xirVJFdPoMNSAErtnbLKAXlvv6OHWjyTddsNBwwlyfFBm4LIhhBy_jiYyiNqtMpoQgWFaFJ_49rF_mMRBSucq_VVHftYBFF5rTl5YmZDaHiwUtlAGRb7-JaxpooNYPAdOAfD8cs47ZgNPSaaoxHOVhw-4nFGbx__eOzByOcSFjJAM6eElY3VS52I