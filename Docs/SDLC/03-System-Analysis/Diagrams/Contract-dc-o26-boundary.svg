 same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="479.851" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="19" data-link-type="dependency"><path d="M275.47,118.941 C266.12,124.921 257.3,131.751 249.76,139.491 C234.47,155.211 225.767,172.787 219.157,191.477" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="217.49,196.191,224.262,189.04,219.157,191.477,216.72,186.372,217.49,196.191" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="328.344" y="154.519" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O26</text><text x="250.76" y="171.81" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="22" data-link-type="association"><path d="M435.54,118.861 C444.9,125.041 453.94,131.941 461.76,139.491 C482.99,159.961 499.62,189.901 509.31,210.001" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="30"><rect x="64.484" y="509.114" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="69.484" y="529.222" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="69.484" y="547.843" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="69.484" y="566.464" fill="#