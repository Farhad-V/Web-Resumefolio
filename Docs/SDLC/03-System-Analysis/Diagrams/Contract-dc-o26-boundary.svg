<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:697px;height:593px;background:#FFFFFF;" width="697px" height="593px" viewBox="0 0 697 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="104.504" y="25.107" fill="#000" font-size="14" textLength="481.284" font-weight="700" font-family="Segoe UI">AFTER MVP — DC-O26 — Merge only current eligible evaluated revisions</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="16"><rect x="243.58" y="46.621" width="240.378" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="253.58" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="253.58" y="87.94" fill="#000" font-size="13" textLength="220.378" font-family="Segoe UI">Current evaluated revisions, applicable</text><text x="253.58" y="105.231" fill="#000" font-size="13" textLength="200.135" font-family="Segoe UI">authority/reviews/checks identified</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="17"><rect x="98.33" y="196.491" width="218.872" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="108.33" y="220.519" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="108.33" y="237.81" fill="#000" font-size="13" textLength="198.872" font-family="Segoe UI">Intended real integration/ref effect</text><text x="108.33" y="255.101" fill="#000" font-size="13" textLength="105.511" font-family="Segoe UI">actually confirmed</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-sourc