<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:364px;height:531px;background:#0D1525;" width="364px" height="531px" viewBox="0 0 364 531" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="364" height="531" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="14"><text x="31.931" y="25.107" fill="#EDF4FF" font-size="14" textLength="293.228" font-weight="700" font-family="Segoe UI">SA-RV02 — review and change-impact route</text></g><!--entity Change--><g class="entity" data-qualified-name="Change" id="ent0001" data-source-line="16"><rect x="38.7" y="46.621" width="279.689" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="48.7" y="70.649" fill="#EDF4FF" font-size="13" textLength="213.738" font-family="Segoe UI">Identify changed authoritative source</text><text x="48.7" y="87.94" fill="#EDF4FF" font-size="13" textLength="259.689" font-family="Segoe UI">Retain accepted decisions and prior snapshot</text></g><!--entity Impact--><g class="entity" data-qualified-name="Impact" id="ent0002" data-source-line="17"><rect x="16.64" y="144.201" width="323.818" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="26.64" y="168.229" fill="#EDF4FF" font-size="13" textLength="295.731" font-family="Segoe UI">Locate affected candidate/model/operation context</text><text x="26.64" y="185.52" fill="#EDF4FF" font-size="13" textLength="303.818" font-family="Segoe UI">Use matrices as associations, not automatic coverage</text></g><!--entity Review--><g class="entity" data-qualified-name="Review" id="ent0003" data-source-line="18"><rect x="14.89" y="259.781" width="327.315" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="24.89" y="283.809" fill="#EDF4FF" font-size="13" textLength="285.41" font-family="Segoe UI">Recheck local identities and structural consistency</text><text x="24.89" y="301.1" fill="#EDF4FF" font-size="13" textLength="307.315" font-family="Segoe UI">Then inspect exact semantic cases / unresolved policy</text></g><!--entity Record--><g class="entity" data-qualified-name="Record" id="ent0004" data-source-line="19"><rect x="7" y="357.361" width="343.089" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="381.389" fill="#EDF4FF" font-size="13" textLength="259.219" font-family="Segoe UI">Identify updated candidate and scoped gates</text><text x="17" y="398.68" fill="#EDF4FF" font-size="13" textLength="323.089" font-family="Segoe UI">Record actual reviewer/owner disposition when it occurs</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M14.76,454.951 L14.76,516.824 A0,0 0 0 0 14.76,516.824 L342.32,516.824 A0,0 0 0 0 342.32,516.824 L342.32,464.951 L332.32,454.951 L182.54,454.951 L178.54,412.251 L174.54,454.951 L14.76,454.951 A0,0 0 0 0 14.76,454.951" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M332.32,454.951 L332.32,464.951 L342.32,464.951 L332.32,454.951" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="20.76" y="473.979" fill="#EDF4FF" font-size="13" textLength="306.56" font-family="Segoe UI">No automatic RF/Q-D closure or baseline acceptance.</text><text x="20.76" y="491.27" fill="#EDF4FF" font-size="13" textLength="286.552" font-family="Segoe UI">Future code/product results need actual evidence.</text><text x="20.76" y="508.561" fill="#EDF4FF" font-size="13" textLength="296.893" font-family="Segoe UI">No requirement to repeat already accepted choices.</text></g><!--link Change to Impact--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="20" data-link-type="dependency