<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:816px;height:507px;background:#0D1525;" width="816px" height="507px" viewBox="0 0 816 507" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="816" height="507" fill="#0D1525" style="stroke:none;"/><g class="title" data-source-line="14"><text x="234.039" y="25.107" fill="#EDF4FF" font-size="14" textLength="341.729" font-weight="700" font-family="Segoe UI">CP — current evidence versus target and hypothesis</text></g><!--entity Intent--><g class="entity" data-qualified-name="Intent" id="ent0001" data-source-line="16"><rect x="7" y="162.201" width="369.178" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="186.229" fill="#EDF4FF" font-size="13" textLength="161.751" font-family="Segoe UI">Accepted planning direction</text><text x="17" y="203.52" fill="#EDF4FF" font-size="13" textLength="349.178" font-family="Segoe UI">Fragmentation / intended reuse / controlled sharing / history</text></g><!--entity Records--><g class="entity" data-qualified-name="Records" id="ent0002" data-source-line="17"><rect x="401.48" y="46.621" width="366.214" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="411.48" y="70.649" fill="#EDF4FF" font-size="13" textLength="217.388" font-family="Segoe UI">Actual documentary/technical records</text><text x="411.48" y="87.94" fill="#EDF4FF" font-size="13" textLength="346.214" font-family="Segoe UI">Elicitation extracts; dated host record; current source models</text></g><!--entity Unknown--><g class="entity" data-qualified-name="Unknown" id="ent0003" data-source-line="18"><rect x="413.7" y="162.201" width="341.788" height="54.582" fill="#4A302B" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="423.7" y="186.229" fill="#EDF4FF" font-size="13" textLength="185.199" font-family="Segoe UI">Unknown current daily workflow</text><text x="423.7" y="203.52" fill="#EDF4FF" font-size="13" textLength="321.788" font-family="Segoe UI">Actual task steps / tools / handoffs / effort not observed</text></g><!--entity Target--><g class="entity" data-qualified-name="Target" id="ent0004" data-source-line="19"><rect x="154.89" y="277.791" width="405.404" height="54.582" fill="#1A2940" style="stroke:#91AED1;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="164.89" y="301.819" fill="#EDF4FF" font-size="13" textLength="213.199" font-family="Segoe UI">Target rules and possible bottlenecks</text><text x="164.89" y="319.11" fill="#EDF4FF" font-size="13" textLength="385.404" font-family="Segoe UI">Keep intended response and testable hypothesis separately labeled</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="24"><path d="M135.42,375.371 L135.42,419.953 A0,0 0 0 0 135.42,419.953 L579.758,419.953 A0,0 0 0 0 579.758,419.953 L579.758,385.371 L569.758,375.371 L361.59,375.371 L357.59,332.761 L353.59,375.371 L135.42,375.371 A0,0 0 0 0 135.42,375.371" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><path d="M569.758,375.371 L569.758,385.371 L579.758,385.371 L569.758,375.371" style="stroke:#F1AD8A;stroke-width:0.5;" fill="#4A302B"/><text x="141.42" y="394.399" fill="#EDF4FF" font-size="13" textLength="423.338" font-family="Segoe UI">Accepted profile policy is target behavior, not a measured current routine.</text><text x="141.42" y="411.69" fill="#EDF4FF" font-size="13" textLength="374.194" font-family="Segoe UI">A historical server snapshot is not task research or capacity proof.</text></g><!--link Intent to Target--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk5" data-source-line="20" data-link-type="dependency"><path d="M209,217.011 C218.78,230.321 231.96,245.881 246.59,256.791 C257.17,264.