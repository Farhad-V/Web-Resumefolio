<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1542px;height:382px;background:#FFFFFF;" width="1542px" height="382px" viewBox="0 0 1542 382" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="545.332" y="23.132" fill="#000" font-size="14" textLength="444.924" font-weight="700" font-family="Arial">Proposed — Version-bound rendering inputs and separate outputs</text></g><!--entity D--><g class="entity" data-qualified-name="D" id="ent0001" data-source-line="7"><rect x="304.71" y="52.149" width="140.606" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.71" y="75.28" fill="#000" font-size="14" textLength="115.938" font-family="Arial">Exact draft version</text><text x="314.71" y="91.379" fill="#000" font-size="14" textLength="120.606" font-family="Arial">owner-only preview</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0002" data-source-line="8"><rect x="480.58" y="52.149" width="332.867" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="490.58" y="75.28" fill="#000" font-size="14" textLength="195.31" font-family="Arial">Committed publication manifest</text><text x="490.58" y="91.379" fill="#000" font-size="14" textLength="312.867" font-family="Arial">content / selection / language / artifact provenance</text></g><!--entity T--><g class="entity" data-qualified-name="T" id="ent0003" data-source-line="9"><rect x="848.43" y="44.099" width="279.178" height="68.296" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="858.43" y="67.23" fill="#000" font-size="14" textLength="204.682" font-family="Arial">Identified layout / template inputs</text><text x="858.43" y="83.329" fill="#000" font-size="14" textLength="217.861" font-family="Arial">section structure / style parameters</text><text x="858.43" y="99.428" fill="#000" font-size="14" textLength="259.178" font-family="Arial">versioning and safe content rules pending</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0004" data-source-line="10"><rect x="541.29" y="188.399" width="211.461" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="551.29" y="211.53" fill="#000" font-size="14" textLength="149.427" font-family="Arial">Evaluated safe renderer</text><text x="551.29" y="227.629" fill="#000" font-size="14" textLength="191.461" font-family="Arial">exact input and output contract</text></g><!--entity W--><g class="entity" data-qualified-name="W" id="ent0005" data-source-line="11"><rect x="7" y="324.639" width="262.033" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="347.77" fill="#000" font-size="14" textLength="242.033" font-family="Arial">Web preview / eligible publication page</text></g><!--entity F--><g class="entity" data-qualified-name="F" id="ent0006" data-source-line="12"><rect x="304.33" y="316.589" width="313.371" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.33" y="339.72" fill="#000" font-size="14" textLength="98.048" font-family="Arial">Generated PDF</text><text x="314.33" y="355.819" fill="#000" font-size="14" textLength="293.371" font-family="Arial">separate actual rendition work / Files protection</text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0007" data-source-line="13"><rect x="652.2" y="316.589" width="361.626" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="662.2" y="339.72" fill="#000" font-size="14" textLength="60.683" font-family="Arial">Print view</text><text x="662.2" y="355.819" fill="#000" font-size="14" textLength="341.626" font-family="Arial">only if actually selected by source/representation policy</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="21"><path d="M1048.44,322.739 L1048.44,362.636 A0,0 0 0 0 1048.44,362.636 L1527.588,362.636 A0,0 0 0 0 1527.588,362.636 L1527.588,332.739 L1517.588,322.739 L1193.24,322.739 L753.22,236.399 L1185.24,322.739 L1048.44,322.739 A0,0 0 0 0 1048.44,322.739" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1517.588,322.739 L1517.588,332.739 L1527.588,332.739 L1517.588,322.739" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1054.44" y="339.932" fill="#000" font-size="13" textLength="458.148" font-family="Arial">Uploaded PDF is a distinct representation; not silently regenerated or relabeled.</text><text x="1054.44" y="354.881" fill="#000" font-size="13" textLength="368.462" font-family="Arial">Theme/layout edits must not rewrite prior actual-material claims.</text></g><!--link D to R--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-source-line="14" data-link-type="dependency"><path d="M388.22,104.649 C398.64,122.259 414.79,144.909 435.02,158.399 C466.34,179.289 500.262,191.162 536.072,199.212" style="stroke:#181818;stroke-width:1;" fill="none" id="D-to-R"/><polygon points="540.95,200.309,533.046,194.432,536.072,199.212,531.292,202.237,540.95,200.309" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="436.02" y="155.592" fill="#000" font-size="13" textLength="202.325" font-family="Arial">explicit preview, never auto-publish</text></g><!--link P to R--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="15" data-link-type="dependency"><path d="M647.02,104.809 C647.02,128.699 647.02,159.169 647.02,183.019" style="stroke:#181818;stroke-width:1;" fill="none" id="P-to-R"/><polygon points="647.02,188.019,651.02,179.019,647.02,183.0