-family="Arial">Immutable publication revision</text></g><g class="entity" data-qualified-name="L" id="ent0004" data-source-line="10"><rect x="70.09" y="504.299" width="312.612" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="70.09" y1="546.496" x2="382.702" y2="546.496" style="stroke:#181818;stroke-width:0.5;"/><text x="80.09" y="522.43" fill="#000" font-size="14" textLength="144.724" font-family="Arial">Live selection / visibility</text><text x="80.09" y="538.529" fill="#000" font-size="14" textLength="292.612" font-family="Arial">separate owner-controlled pointer and eligibility</text></g><g class="entity" data-qualified-name="T" id="ent0005" data-source-line="11"><rect x="107.06" y="632.499" width="238.661" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="107.06" y1="674.696" x2="345.721" y2="674.696" style="stroke:#181818;stroke-width:0.5;"/><text x="117.06" y="650.63" fill="#000" font-size="14" textLength="94.944" font-family="Arial">Retired content</text><text x="117.06" y="666.729" fill="#000" font-size="14" textLength="218.661" font-family="Arial">only under reviewed lifecycle policy</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="12"><ellipse cx="226.39" cy="53.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="21"><path d="M6,745.689 L6,800.535 A0,0 0 0 0 6,800.535 L446.79,800.535 A0,0 0 0 0 446.79,800.535 L446.79,755.689 L436.79,745.689 L230.39,745.689 L226.39,685.129 L222.39,745.689 L6,745.689 A0,0 0 0 0 6,745.689" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M436.79,745.689 L436.79,755.689 L446.79,755.689 L436.79,745.689" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="762.882" fill="#000" font-size="13" textLength="248.574" font-family="Arial">Unpublish/w