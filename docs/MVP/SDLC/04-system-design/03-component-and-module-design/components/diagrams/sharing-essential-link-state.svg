0" font-size="14" textLength="54.476" font-family="Arial">Disabled</text></g><g class="entity" data-qualified-name="Expired" id="ent0009" data-source-line="11"><rect x="594.98" y="395.939" width="67.469" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="594.98" y1="422.037" x2="662.449" y2="422.037" style="stroke:#181818;stroke-width:0.5;"/><text x="604.98" y="414.07" fill="#000" font-size="14" textLength="47.469" font-family="Arial">Expired</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="14"><path d="M849.12,265.099 L849.12,288.519 L391.77,292.519 L849.12,296.519 L849.12,319.945 A0,0 0 0 0 849.12,319.945 L1242.308,319.945 A0,0 0 0 0 1242.308,319.945 L1242.308,275.099 L1232.308,265.099 L849.12,265.099 A0,0 0 0 0 849.12,265.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1232.308,265.099 L1232.308,275.099 L1242.308,275.099 L1232.308,265.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="855.12" y="282.292" fill="#000" font-size="13" textLength="365.612" font-family="Arial">Effective eligibility also requires current resource/content policy.</text><text x="855.12" y="297.241" fill="#000" font-size="13" textLength="369.96" font-family="Arial">Viewer context must match current link authorization generation.</text><text x="855.12" y="312.19" fill="#000" font-size="13" textLength="372.188" font-family="Arial">Download mode change is independent from link enable/disable.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="19"><path d="M6,506.939 L6,561.785 A0,0 0 0 0 6,561.785 L471.438,561.785 A0,0 0 0 0 471.438,561.785 L471.438,516.939 L461.438,506.939 L242.72,506.939 L238.72,446.399 L234.72,506.939 L6,506.939 A0,0 0 0 0 6,506.939" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M461.438,506.939 L461.438,516.939 L471.438,516.939 L461.438,506.939" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="524.132" fill="#000" font-size="13" textLength="444.438" font-family="Arial">Disable/rotation invalidation needs actual synchronized completion boundary.</text><text x="12" y="539.081" fill="#000" font-size="13" textLength="328.085" font-family="Arial">Previously emitted/downloaded bytes cannot be recalled.</text><text x="12" y="554.03" fill="#000" font-size="13" textLength="300.606" font-family="Arial">Restoring old data must not re-enable revoked links.</text></g><!--link *start* to Configured--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="7" data-link-type="dependency"><path d="M355.72,63.389 C355.72,79.969 355.72,110.129 355.72,133.949" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Configured"/><polygon points="355.72,138.949,359.72,129.949,355.72,133.949,351.72,129.949,355.72,138.949" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="356.72" y="106.292" fill="#000" font-size="13" textLength="171.99" font-family="Arial">actual authorized link creation</text></g><!--link Configured to Enabled--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="8" data-link-type="dependency"><path d="M355.72,189.469 C355.72,211.859 355.72,239.859 355.72,262.219" style="stroke:#181818;stroke-width:1;" fill="none" id="Configured-to-Enabled"/><polygon points="355.72,267.219,359.72,258.219,355.72,262.219,351.72,258.219,355.72,267.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="356.72" y="232.292" fill="#000" font-size="13" textLength="228.351" font-family="Arial">explicitly enabled under reviewed policy</text></g><!--link Enabled to Disabled--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M319.65,296.739 C259.63,302.939 143.36,318.739 118.72,349.