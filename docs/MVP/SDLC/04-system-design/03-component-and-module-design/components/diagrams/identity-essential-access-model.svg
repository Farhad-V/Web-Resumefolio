<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1404px;height:226px;background:#FFFFFF;" width="1404px" height="226px" viewBox="0 0 1404 226" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="492.837" y="23.132" fill="#000" font-size="14" textLength="411.537" font-weight="700" font-family="Arial">Proposed — Scoped roles, attributes and resource ownership</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0001" data-source-line="7"><rect x="7" y="44.099" width="305.599" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="67.23" fill="#000" font-size="14" textLength="95.717" font-family="Arial">Verified subject</text><text x="17" y="83.329" fill="#000" font-size="14" textLength="285.599" font-family="Arial">account / current session or scoped credential</text></g><!--entity G--><g class="entity" data-qualified-name="G" id="ent0002" data-source-line="8"><rect x="977.87" y="44.099" width="381.867" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="987.87" y="67.23" fill="#000" font-size="14" textLength="193.785" font-family="Arial">Scoped grant / role relationship</text><text x="987.87" y="83.329" fill="#000" font-size="14" textLength="361.867" font-family="Arial">actual resource namespace + operations + current version</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0003" data-source-line="9"><rect x="347.25" y="44.099" width="237.103" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="357.25" y="67.23" fill="#000" font-size="14" textLength="166.517" font-family="Arial">Current resource attributes</text><text x="357.25" y="83.329