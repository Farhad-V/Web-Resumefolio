<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1114px;height:610px;background:#FFFFFF;" width="1114px" height="610px" viewBox="0 0 1114 610" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="347.795" y="23.132" fill="#000" font-size="14" textLength="411.612" font-weight="700" font-family="Arial">Proposed — Session lifecycle and separate credential scopes</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="7"><ellipse cx="523.35" cy="53.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Establishing" id="ent0002" data-source-line="7"><rect x="475.61" y="139.099" width="95.489" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="475.61" y1="165.197" x2="571.099" y2="165.197" style="stroke:#181818;stroke-width:0.5;"/><text x="485.61" y="157.23" fill="#000" font-size="14" textLength="75.489" font-family="Arial">Establishing</text></g><g class="entity" data-qualified-name="Active" id="ent0004" data-source-line="8"><rect x="115.29" y="267.519" width="58.124" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="115.29" y1="293.617" x2="173.414" y2="293.617" style="stroke:#181818;stroke-width:0.5;"/><text x="125.29" y="285.65" fill="#000" font-size="14" textLength="38.124" font-family="Arial">Active</text></g><g class="entity" data-qualified-name="Refused" id="ent0006" data-source-line="9"><rect x="818.28" y="349.939" width="72.145" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="818.28" y1="376.037" x2="890.425" y2="376.037" style="stroke:#181818;stroke-width:0.5;"/><text x="828.28" y="368.07" fill="#000" font-size="14" textLength="52.145" font-family="Arial">Refused</text></g><g class="entity" data-qualified-name="Expired" id="ent0009" data-source-line="11"><rect x="485.62" y="429.939" width="67.469" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="485.62" y1="456.037" x2="553.089" y2="456.037" style="stroke:#181818;stroke-width:0.5;"/><text x="495.62" y="448.07" fill="#000" font-size="14" textLength="47.469" font-family="Arial">Expired</text></g><g class="entity" data-qualified-name="Revoked" id="ent0011" data-source-line="12"><rect x="170.73" y="429.939" width="75.255" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="170.73" y1="456.037" x2="245.985" y2="456.037" style="stroke:#181818;stroke-width:0.5;"/><text x="180.73" y="448.07" fill="#000" font-size="14" textLength="55.255" font-family="Arial">Revoked</text></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="13"><ellipse cx="519.35" cy="568.369" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="519.35" cy="568.369" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="17"><path d="M492.59,265.099 L492.59,288.519 L173.89,292.519 L492.59,296.519 L492.59,319.945 A0,0 0 0 0 492.59,319.945 L848.118,319.945 A0,0 0 0 0 848.118,319.945 L848.118,275.099 L838.118,265.099 L492.59,265.099 A0,0 0 0 0 492.59,265.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M838.118,265.099 L838.118,275.099 L848.118,275.099 L838.118,265.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="498.59" y="282.292" fill="#000" font-size="13" textLength="320.112" font-family="Arial">Rotation/renewal, if selected, creates or rebinds context</text><text x="498.59" y="297.241" fill="#000" font-size="13" textLength="325.165" font-family="Arial">under the actual invalidation policy, not immortal refresh.</text><text x="498.59" y="312.19" fill="#000" font-size="13" textLength="334.528" font-family="Arial">No numeric lifetime, JWT or OAuth refresh token adopted.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="22"><path d="M6,540.939 L6,595.785 A0,0 0 0 0 6,595.785 L410.709,595.785 A0,0 0 0 0 410.709,595.785 L410.709,550.939 L400.709,540.939 L212.35,540.939 L208.35,480.399 L204.35,540.939 L6,540.939 A0,0 0 0 0 6,540.939" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M400.709,540.939 L400.709,550.939 L410.709,550.939 L400.709,540.939" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="558.132" fill="#000" font-size="13" textLength="383.709" font-family="Arial">Report completion only at actual server-side invalidation boundary.</text><text x="12" y="573.081" fill="#000" font-size="13" textLength="324.429" font-family="Arial">Old restored state must not reactivate revoked sessions.</text><text x="12" y="588.03" fill="#000" font-size="13" textLength="338.178" font-family="Arial">Provider and Git credentials have separate scope/lifecycle.</text></g><!--link *start* to Establishing--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="7" data-link-type="dependency"><path d="M523.35,63.389 C523.35,79.969 523.35,110.129 523.35,133.949" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Establishing"/><polygon points="523.35,138.949,527.35,129.949,523.35,133.949,519.35,129.949,523.35,138.949" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="524.35" y="106.292" fill="#000" font-size="13" textLength="195.457" font-family="Arial">required proofs + current eligibility</text></g><!--link Establishing to Active--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="8" data-link-type="dependency"><path d="M475.35,181.109 C395.68,207.689 243.213,258.547 178.243,280.217" style="stroke:#181818;stroke-width:1;" fill="none" id="Establishing-to-Active"/><polygon points="173.5,281.799,183.303,282.746,178.243,280.217,180.772,275.157,173.5,281.799" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="357.55" y="232.292" fill="#000" font-size="13" textLength="178.464" font-family="Arial">actual fresh session committed</text></g><!--link Establishing to Refused--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M571.45,172.019 C656.99,185.429 829.92,217.819 865.35,265.099 C883.58,289.419 876.527,321.183 867.317,345.093" style="stroke:#181818;stroke-width:1;" fill="none" id="Establishing-to-Refused"/><polygon points="865.52,349.759,872.488,342.798,867.317,345.093,865.022,339.922,865.52,349.759" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="822.88" y="232.292" fill="#000" font-size="13" textLength="275.323" font-family="Arial">missing / invalid / unavailable required evidence</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk8" data-source-line="10" data-link-type="dependency"><path d="M173.68,281.069 C191.52,278.419 208.42,282.229 208.42,292.519 C208.42,302.809 196.466,307.353 178.626,304.703" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="173.68,303.969,181.995,309.248,178.626,304.703,183.17,301.334,173.68,303.969" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.42" y="297.712" fill="#000" font-size="13" textLength="254.332" font-family="Arial">permitted activity under actual lifetime policy</text></g><!--link Active to Expired--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" id="lnk10" data-source-l