roke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="216.413" y="328.55" fill="#000" font-size="12" textLength="312.176" font-family="Arial">Review actual outcomes against identified criteria and goal</text><rect x="198.072" y="361.093" width="348.857" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="208.072" y="382.349" fill="#000" font-size="12" textLength="328.857" font-family="Arial">Record item acceptance and goal outcome by actual authority</text><rect x="191.064" y="414.892" width="362.873" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.064" y="436.147" fill="#000" font-size="12" textLength="342.873" font-family="Arial">Close period with exact goal/scope/plan and observed outcomes</text><polygon points="308.308,468.69,436.693,468.69,448.693,480.69,436.693,492.69,308.308,492.69,296.308,480.69,308.308,468.69" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="308.308" y="484.684" fill="#000" font-size="11" textLength="128.385" font-family="Arial">Incomplete work remains?</text><text x="279.19" y="478.359" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="448.693" y="478.359" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="40.352" y="502.69" width="317.469" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.352" y="523.946" fill="#000" font-size="12" textLength="297.469" font-family="Arial">Apply only reviewed explicit incomplete-work disposition</text><rect x="16" y="556.489" width="366.172" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="577.745" fill="#000" font-size="12" textLength="346.172" font-family="Arial">Select any future Sprint scope deliberately; no inferred carry-over</text><rect x="402.1