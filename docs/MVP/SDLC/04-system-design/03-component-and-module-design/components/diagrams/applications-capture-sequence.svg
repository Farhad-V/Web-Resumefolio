.474,236.043 L330.474,275.043 L804.474,275.043 L804.474,246.043 L794.474,236.043 L330.474,236.043" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M794.474,236.043 L794.474,246.043 L804.474,246.043 L794.474,236.043" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="377.839" y="253.237" fill="#000" font-size="13" textLength="370.735" font-family="Arial">Evaluate reservation/finalization and cleanup exclusion together.</text><text x="377.839" y="268.186" fill="#000" font-size="13" textLength="323.686" font-family="Arial">This diagram does not assume atomicity across owners.</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4" data-source-line="17"><polygon points="405.923,297.89,395.923,301.89,405.923,305.89,401.923,301.89" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="399.923" y1="301.89" x2="739.489" y2="301.89" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="411.923" y="297.135" fill="#000" font-size="13" textLength="310.058" font-family="Arial">actual usable/pending/unavailable reference evidence</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg5" data-source-line="18"><polygon points="885.061,326.838,895.061,330.838,885.061,334.838,889.061,330.838" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="394.923" y1="330.838" x2="891.061" y2="330.838" style="stroke:#181818;stroke-width:1;"/><text x="401.923" y="326.083" fill="#000" font-size="13" textLength="329.881" font-family="Arial">bounded event/manifest/completeness + command result</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg6" data-source-line="19"><polygon points="405.923,355.787,395.923,359.787,405.923,363.787,401.923,359.787" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="399.923" y1="359.787" x2="896.061" y2="359.787" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="411.923" y="355.032" fill="#000" font-size="13" textLength="163.293" font-family="Arial">attributable commit outcome</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg7" data-source-line="20"><polygon points="728.489,384.736,738.489,388.736,728.489,392.736,732.489,388.736" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="394.923" y1="388.736" x2="734.489" y2="388.736" style="stroke:#181818;stroke-width:1;"/><text x="401.923" y="383.981" fill="#000" font-size="13" textLength="321.566" font-family="Arial">finalize/reconcile protected reference by capture identity</text></g><path d="M330.474,401.736 L330.474,440.736 L804.474,440.736 L804.474,411.736 L794.474,401.736 L330.474,401.736" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M794.474,401.736 L794.474,411.736 L804.474,411.736 L794.474,401.736" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="390.499" y="418.93" fill="#000" font-size="13" textLength="345.414" font-family="Arial">Lost/partial acknowledgments require durable reconciliation.</text><text x="390.499" y="433.878" fill="#000" font-size="13" textLength="288.292" font-family="Arial">Do not claim complete usable history prematurely.</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg8" data-source-line="25"><polygon points="73.027,463.582,63.027,467.582,73.027,471.582,69.027,467.582" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="67.027" y1="467.582" x2="393.923" y2="467.582" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="79.027" y="462.827" fill="#000" font-size="13" textLength="308.896" font-family="Arial">permitted actual event + material-completeness result</text></g><path d="M326.046,480.582 L326.046,519.582 L965.046,519.