eview consumer expectations / denial / conflict / unknown paths</text><rect x="424.184" y="279.495" width="369.512" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="434.184" y="300.751" fill="#000" font-size="12" textLength="349.512" font-family="Arial">Review owner invariants / persistence / external effect boundaries</text><rect x="16" y="333.294" width="789.695" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="297.451" y="359.294" width="228.793" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="307.451" y="380.55" fill="#000" font-size="12" textLength="208.793" font-family="Arial">Reconcile contract and planned checks</text><polygon points="307.901,413.093,515.794,413.093,527.794,425.093,515.794,437.093,307.901,437.093,295.901,425.093,307.901,413.093" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="307.901" y="429.086" fill="#000" font-size="11" textLength="207.894" font-family="Arial">Mock or code generation actually justified?</text><text x="278.783" y="422.762" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="527.794" y="422.762" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="24.481" y="447.093" width="401.545" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="34.481" y="468.349" fill="#000" font-size="12" textLength="381.545" font-family="Arial">Generate only from identified authoritative source / compatible toolchain</text><rect x="109.861" y="500.892" width="230.785" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="119.861" y="522.147" fill="#000" font-size="12" textLength="210.785" font-family="Arial">Retain generator identity and limitations</text><rect x="446.026" y="447.093" 