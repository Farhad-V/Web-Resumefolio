t-size="11" textLength="67.262" font-family="Arial">demonstrated</text><text x="421.639" y="236.963" fill="#000" font-size="11" textLength="97.233" font-family="Arial">breaking / unproven</text><rect x="16" y="261.294" width="287.475" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="282.55" fill="#000" font-size="12" textLength="267.475" font-family="Arial">Verify old/new interaction and preservation checks</text><rect x="323.475" y="261.294" width="324.857" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="333.475" y="282.55" fill="#000" font-size="12" textLength="252.129" font-family="Arial">Define explicit version or coordinated transition;</text><text x="333.475" y="296.349" fill="#000" font-size="12" textLength="304.857" font-family="Arial">compatible readers/writers and pending-payload handling</text><rect x="344.173" y="328.892" width="283.461" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="354.173" y="350.147" fill="#000" font-size="12" textLength="263.461" font-family="Arial">Implement / verify coexistence and migration plan</text><polygon points="322.82,368.69,334.82,380.69,322.82,392.69,310.82,380.69,322.82,368.69" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="151.4" y="412.69" width="342.84" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.4" y="433.946" fill="#000" font-size="12" textLength="192.135" font-family="Arial">Evaluate actual candidate evidence;</text><text x="161.4" y="447.745" fill="#000" font-size="12" textLength="322.84" font-family="Arial">protected history and external attempt meaning remain intact</text><polygon points="242.719,480.288,402.922,480.288,414.922,492.288,402.922,504.288,242.719,504.288,230.719,492.288,242.719,480.288" fill="#F1F1F1" style="st