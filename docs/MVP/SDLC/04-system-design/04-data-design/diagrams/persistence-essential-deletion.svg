<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:845px;height:758px;background:#FFFFFF;" width="845px" height="758px" viewBox="0 0 845 758" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="178.413" y="33.132" fill="#000" font-size="14" textLength="486.254" font-weight="700" font-family="Arial">Proposed — Logical retirement, policy assessment and physical deletion</text></g><ellipse cx="423.717" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="275.65" y="92.099" width="296.135" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="285.65" y="113.354" fill="#000" font-size="12" textLength="276.135" font-family="Arial">Receive explicit authorized lifecycle/erasure request</text><rect x="229.947" y="145.897" width="387.541" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="239.947" y="167.153" fill="#000" font-size="12" textLength="367.541" font-family="Arial">Determine actual source policy, affected data classes and obligations</text><polygon points="335.677,199.696,511.758,199.696,523.758,211.696,511.758,223.696,335.677,223.696,323.677,211.696,335.677,199.696" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="335.677" y="215.69" fill="#000" font-size="11" textLength="176.081" font-family="Arial">Logical retirement / trash permitted?</text><text x="306.559" y="209.365" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="523.758" y="209.365" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="55.05" y="233.696" width="380.17" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.05" y="254.952" fill="#000" font-size="12" textLength="360.17" font-family="Arial">Record attributable lifecycle state; do not imply physical reclamation</text><rect x="455.22" y="233.696" width="294.16" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="465.22" y="254.952" fill="#000" font-size="12" textLength="274.16" font-family="Arial">Report actual denied / unresolved-policy disposition</text><ellipse cx="602.3" cy="298.495" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="602.3" cy="298.495" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="249.977" y="329.495" width="347.48" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="259.977" y="350.751" fill="#000" font-size="12" textLength="327.48" font-family="Arial">Assess all active and provisional consumer/history references</text><polygon points="283.073,383.294,564.362,383.294,576.362,395.294,564.362,407.294,283.073,407.294,271.073,395.294,283.073,383.294" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="283.073" y="399.287" fill="#000" font-size="11" textLength="281.29" font-family="Arial">Safe physical deletion permitted under actual obligations?</text><text x="253.955" y="392.963" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="576.362" y="392.963" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="38.702" y="417.294" width="355.49" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.702" y="438.55" fill="#000" font-size="12" textLength="335.49" font-family="Arial">Acquire exclusive claim that excludes new reference admission</text><rect x="69.054" y="471.093" width="294.787" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="79.054" y="492.349" fill="#000" font-size="12" textLength="274.787" font-family="Arial">Recheck current eligibility / version / reference state</text><rect x="16" y="524.892" width="400.895" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="546.147" fill="#000" font-size="12" textLength="380.895" font-family="Arial">Observe actual backend deletion and record partial/unknown accurately</text><rect x="69.716" y="578.69" width="293.463" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="79.716" y="599.946" fill="#000" font-size="12" textLength="273.463" font-family="Arial">Credit only confirmed applicable reclaimed capacity</text><rect x="436.895" y="417.294" width="388.186" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="446.895" y="438.55" fill="#000" font-size="12" textLength="368.186" font-family="Arial">Retain necessary protection; record actual limitation / next disposition</text><polygon points="423.717,618.489,435.717,630.489,423.717,642.489,411.717,630.489,423.717,618.489" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="215.609" y="662.489" width="416.217" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="225.609" y="683.745" fill="#000" font-size="12" textLength="396.217" font-family="Arial">Handle replicas/caches/backups under actual reviewed lifecycle procedure</text><ellipse cx="423.717" cy="727.288" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="423.717" cy="727.288" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="423.717" y1="72.099" x2="423.717" y2="92.099" style="stroke:#181818;stroke-width:1;"/><polygon points="419.717,82.099,423.717,92.099,427.717,82.099,423.717,86.0