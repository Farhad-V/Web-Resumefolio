<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1005px;height:724px;background:#FFFFFF;" width="1005px" height="724px" viewBox="0 0 1005 724" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="310.553" y="23.132" fill="#000" font-size="14" textLength="377.351" font-weight="700" font-family="Arial">Analysis invariant to physical enforcement and evidence</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="7"><rect x="333.79" y="44.099" width="317.268" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="343.79" y="67.23" fill="#000" font-size="14" textLength="203.875" font-family="Arial">Authoritative analysis / dictionary</text><text x="343.79" y="83.329" fill="#000" font-size="14" textLength="297.268" font-family="Arial">Meaning, ownership, lifecycle and source status</text></g><!--entity L--><g class="entity" data-qualified-name="L" id="ent0002" data-source-line="8"><rect x="350.9" y="172.289" width="283.033" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="360.9" y="195.42" fill="#000" font-size="14" textLength="139.282" font-family="Arial">Logical record families</text><text x="360.9" y="211.519" fill="#000" font-size="14" textLength="263.033" font-family="Arial">Identity, scope, revisions and relationships</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0003" data-source-line="9"><rect x="7" y="300.489" width="318.84" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="323.62" fill="#000" font-size="14" textLength="182.861" font-family="Arial">Row / relationship constraints</text><text x="17" y="339.719" fill="#000" font-size="14" textLength="298.84" font-family="Arial">PK, FK, unique, requiredness, evaluated checks</text></g><!--entity T--><g class="entity" data-qualified-name="T" id="ent0004" data-source-line="10"><rect x="360.66" y="300.489" width="263.523" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="370.66" y="323.62" fill="#000" font-size="14" textLength="166.537" font-family="Arial">Guarded local transactions</text><text x="370.66" y="339.719" fill="#000" font-size="14" textLength="243.523" font-family="Arial">Versions, locks, cross-record invariants</text></g><!--entity E--><g class="entity" data-qualified-name="E" id="ent0005" data-source-line="11"><rect x="659.39" y="300.489" width="332.067" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="669.39" y="323.62" fill="#000" font-size="14" textLength="190.675" font-family="Arial">Storage / external coordination</text><text x="669.39" y="339.719" fill="#000" font-size="14" textLength="312.067" font-family="Arial">Protected references, durable intent, reconciliation</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0006" data-source-line="12"><rect x="322.11" y="413.689" width="340.626" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="332.11" y="436.82" fill="#000" font-size="14" textLength="190.654" font-family="Arial">Physical mapping specification</text><text x="332.11" y="452.919" fill="#000" font-size="14" textLength="320.626" font-family="Arial">Exact engine/types/collation/indexes/DDL still gated</text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0007" data-source-line="13"><rect x="306.17" y="541.889" width="372.502" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="316.17" y="565.02" fill="#000" font-size="14" textLength="129.186" font-family="Arial">