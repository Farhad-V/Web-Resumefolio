<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:922px;height:623px;background:#FFFFFF;" width="922px" height="623px" viewBox="0 0 922 623" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="226.458" y="23.132" fill="#000" font-size="14" textLength="462.089" font-weight="700" font-family="Arial">Proposed / illustrative — Conceptual to logical to physical refinement</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0001" data-source-line="7"><rect x="403.42" y="44.099" width="273.688" height="84.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="413.42" y="67.23" fill="#000" font-size="14" textLength="70.827" font-family="Arial">Conceptual</text><text x="413.42" y="83.329" fill="#000" font-size="14" textLength="221.061" font-family="Arial">Meaning and independent identities</text><text x="413.42" y="99.428" fill="#000" font-size="14" textLength="169.641" font-family="Arial">No physical types / indexes</text><text x="413.42" y="115.526" fill="#000" font-size="14" textLength="253.688" font-family="Arial">Source, draft, publication, actual material</text></g><!--entity L--><g class="entity" data-qualified-name="L" id="ent0002" data-source-line="8"><rect x="127.84" y="204.499" width="346.84" height="84.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="137.84" y="227.63" fill="#000" font-size="14" textLength="44.365" font-family="Arial">Logical</text><text x="137.84" y="243.729" fill="#000" font-size="14" textLength="183.654" font-family="Arial">Owned records and attributes</text><text x="137.84" y="259.828" fill="#000" font-size="14" textLength="285.605" font-family="Arial">Identity / relationships / candidate cardinalities</text><text x="137.84" y="275.926" fill="#000" font-size="14" textLength="326.84" font-family="Arial">Publication belongs to resume; live selection is exact</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0003" data-source-line="9"><rect x="7" y="364.889" width="330.522" height="84.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="388.02" fill="#000" font-size="14" textLength="116.737" font-family="Arial">Physical candidate</text><text x="17" y="404.119" fill="#000" font-size="14" textLength="310.522" font-family="Arial">Selected-engine columns and key representations</text><text x="17" y="420.218" fill="#000" font-size="14" textLength="295.716" font-family="Arial">PK / scoped FK / uniqueness / checks / indexes</text><text x="17" y="436.316" fill="#000" font-size="14" textLength="259.909" font-family="Arial">Actual transaction and query mechanisms</text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0004" data-source-line="10"><rect x="149.83" y="525.289" width="318.854" height="84.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="159.83" y="548.42" fill="#000" font-size="14" textLength="69.255" font-family="Arial">Verification</text><text x="159.83" y="564.519" fill="#000" font-size="14" textLength="244.74" font-family="Arial">Exact source criteria + actual candidate</text><text x="159.83" y="580.618" fill="#000" font-size="14" textLength="274.654" font-family="Arial">Round-trip / concurrency / privacy / recovery</text><text x="159.83" y="596.716" fill="#000" font-size="14" textLength="298.854" font-family="Arial">Real DB and storage evidence where applicable</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="16"><path d="M509.52,226.749 L509.52,266.646 L907.006,266.646 L907.006,236.749 L897.006,226.749 L509.52,226.749" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M897.006,226.749 L897.006,236.749 L907.006,236.749 L897.006,226.749" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="515.52" y="243.942" fill="#000" font-size="13" textLength="307.836" font-family="Arial">ORM class, logical entity and table need not map 1:1.</text><text x="515.52" y="258.891" fill="#000" font-size="13" textLength="376.486" font-family="Arial">A valid FK does not provide current authorization or usable bytes.</text></g><!--link C to L--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="11" data-link-type="dependency"><path d="M402.98,117.619 C379,127.629 355.84,140.899 337.26,158.499 C324.42,170.659 317.612,183.342 312.172,199.422" style="stroke:#181818;stroke-width:1;" fill="none" id="C-to-L"/><polygon points="310.57,204.159,317.243,196.915,312.172,199.422,309.665,194.351,310.57,204.159" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="338.26" y="171.692" fill="#000" font-size="13" textLength="310.724" font-family="Arial">add justified structure, not guessed source constraints</text></g><!--link L to P--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="12" data-link-type="dependency"><path d="M189.04,289.229 C178.07,297.469 168.39,307.269 161.26,318.889 C152.96,332.419 152.186,344.457 155.426,359.787" style="stroke:#181818;stroke-width:1;" fill="none" id="L-to-P"/><polygon points="156.46,364.679,158.513,355.046,155.426,359.787,150.685,356.7,156.46,364.679" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="162.26" y="332.082" fill="#000" font-size="13" textLength="250.053" font-family="Arial">choose and evaluate actual implementation</text></g><!--link P to V--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="13" data-link-type="dependency"><path d="M173.85,449.499 C176.15,465.009 180.86,482.049 190.26,495.289 C198.28,5