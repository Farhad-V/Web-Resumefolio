<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:713px;height:584px;background:#FFFFFF;" width="713px" height="584px" viewBox="0 0 713 584" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="152.559" y="33.132" fill="#000" font-size="14" textLength="406.854" font-weight="700" font-family="Arial">Proposed — Versioned invalidation and concurrent-fill safety</text></g><ellipse cx="341.942" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="163.192" y="92.099" width="357.5" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="173.192" y="113.354" fill="#000" font-size="12" textLength="337.5" font-family="Arial">Authoritative mutation commits new relevant version/generation</text><rect x="180.533" y="145.897" width="322.818" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="190.533" y="167.153" fill="#000" font-size="12" textLength="302.818" font-family="Arial">Publish actual post-commit invalidation if a cache is used</text><polygon points="286.905,199.696,396.98,199.696,408.98,211.696,396.98,223.696,286.905,223.696,274.905,211.696,286.905,199.696" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="286.905" y="215.69" fill="#000" font-size="11" textLength="110.075" font-family="Arial">Invalidation observed?</text><text x="257.787" y="209.365" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="408.98" y="209.365" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="34.294" y="233.696" width="275.457" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="44.294" y="254.952" fill="#000" font-size="12" textLength="255.457" font-family="Arial">Retire affected old entries / admit exact new key</text><rect x="329.751" y="233.696" width="364.221" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="339.751" y="254.952" fill="#000" font-size="12" textLength="344.221" font-family="Arial">Retain repair need; correctness cannot depend on delivery alone</text><polygon points="341.942,273.495,353.942,285.495,341.942,297.495,329.942,285.495,341.942,273.495" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="156.167" y="317.495" width="371.551" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="166.167" y="338.751" fill="#000" font-size="12" textLength="351.551" font-family="Arial">Read obtains current authorized scope/version under actual guard</text><polygon points="200.092,371.294,483.793,371.294,495.793,383.294,483.793,395.294,200.092,395.294,188.092,383.294,200.092,371.294" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.092" y="387.287" fill="#000" font-size="11" textLength="283.701" font-family="Arial">Cache payload matches exact current admissible identity?</text><text x="170.974" y="380.963" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="495.793" y="380.963" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="16" y="405.294" width="324.184" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="426.55" fill="#000" font-size="12" textLength="304.184" font-family="Arial">Validate actual usability and protected delivery conditions</text><rect x="364.054" y="405.294" width="283.479" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="374.054" y="426.55" fill="#000" font-size="12" textLength="263.479" font-family="Arial">Reject stale fill; rebuild only authorized exact data</text><polygon points="341.942,445.093,353.942,457.093,341.942,469.093,329.942,457.093,341.942,445.093" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="186.861" y="489.093" width="310.162" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.861" y="510.349" fill="#000" font-size="12" textLength="290.162" font-family="Arial">Apply actual admission ordering before returning bytes</text><ellipse cx="341.942" cy="553.892" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="341.942" cy="553.892" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="341.942" y1="72.099" x2="341.942" y2="92.099" style="stroke:#181818;stroke-width:1;"/><polygon points="337.942,82.099,341.942,92.099,345.942,82.099,341.942,86.099" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="341.942" y1="125.897" x2="341.942" y2="145.897" style="stroke:#181818;stroke-width:1;"/><polygon points="337.942,135.897,341.942,145.897,345.942,135.897,341.942,139.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="274.905" y1="211.696" x2="172.023" y2="211.696" style="stroke:#181818;stroke-width:1;"/><line x1="172.023" y1="211.696" x2="172.023" y2="233.696" style="stroke:#181818;stroke-width:1;"/><polygon points="168.023,223.696,172.023,233.696,176.023,223.696,172.023,227.696" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="408.98" y1="211.696" x2="511.862" y2="211.696" style="stroke:#181818;stroke-width:1;"/><line x1="511.862" y1="211.696" x2="511.862" y2="233.696" style="stroke:#181818;stroke-width:1;"/><polygon poin