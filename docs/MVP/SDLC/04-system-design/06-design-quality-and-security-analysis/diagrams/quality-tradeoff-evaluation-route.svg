<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:732px;height:693px;background:#FFFFFF;" width="732px" height="693px" viewBox="0 0 732 693" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="173.813" y="33.132" fill="#000" font-size="14" textLength="382.724" font-weight="700" font-family="Arial">Proposed lightweight scenario-based trade-off evaluation</text></g><ellipse cx="370.199" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="207.782" y="92.099" width="324.834" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="217.782" y="113.354" fill="#000" font-size="12" textLength="304.834" font-family="Arial">Identify source status, owner goals and actual constraints</text><rect x="200.13" y="145.897" width="340.139" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="210.13" y="167.153" fill="#000" font-size="12" textLength="320.139" font-family="Arial">Define stimulus / environment / artifact / response / measure</text><rect x="226.796" y="199.696" width="286.807" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="236.796" y="220.952" fill="#000" font-size="12" textLength="266.807" font-family="Arial">Compare candidate mechanisms and alternatives;</text><text x="236.796" y="234.751" fill="#000" font-size="12" textLength="238.77" font-family="Arial">record assumptions and cross-attribute costs</text><polygon points="250.961,267.294,489.438,267.294,501.438,279.294,489.438,291.294,250.961,291.294,238.961,279.294,250.961,267.294" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="250.961" y="283