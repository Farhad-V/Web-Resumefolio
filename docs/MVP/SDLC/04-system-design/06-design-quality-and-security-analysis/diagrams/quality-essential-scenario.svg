247" font-family="Arial">permitted vs prohibited byte observations</text><text x="178.07" y="615.516" fill="#000" font-size="14" textLength="212.434" font-family="Arial">latency/errors recorded separately</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="19"><path d="M115.99,689.479 L115.99,744.325 A0,0 0 0 0 115.99,744.325 L495.391,744.325 A0,0 0 0 0 495.391,744.325 L495.391,699.479 L485.391,689.479 L309.69,689.479 L305.69,628.689 L301.69,689.479 L115.99,689.479 A0,0 0 0 0 115.99,689.479" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M485.391,689.479 L485.391,699.479 L495.391,699.479 L485.391,689.479" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="121.99" y="706.672" fill="#000" font-size="13" textLength="358.401" font-family="Arial">QA-01 example, not a test result or accepted numerical target.</text><text x="121.99" y="721.621" fill="#000" font-size="13" textLength="238.469" font-family="Arial">Already emitted bytes cannot be recalled.</text><text x="121.99" y="736.57" fill="#000" font-size="13" textLength="311.454" font-family="Arial">Fast responses cannot offset unauthorized disclosure.</text></g><!--link S to T--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="13" data-link-type="dependency"><path d="M156.69,96.779 C156.69,114.439 156.69,133.079 156.69,152.199" style="stroke:#181818;stroke-width:1;" fill="none" id="S-to-T"/><polygon points="156.69,157.199,160.69,148.199,156.69,152.199,152.69,148.199,156.69,157.199" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link T to A--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="14" data-link-type="dependency"><path d="M193.9,225.979 C219.76,249.279 249.986,276.502 273.646,297.822" style="stroke:#181818;stroke-width:1;" fill="none" id="T-to-A"/><polygon points="277.36,301.169,273.352,292.172,273.64