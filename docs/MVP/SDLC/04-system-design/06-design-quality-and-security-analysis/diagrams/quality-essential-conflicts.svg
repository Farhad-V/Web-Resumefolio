<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:992px;height:561px;background:#FFFFFF;" width="992px" height="561px" viewBox="0 0 992 561" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="253.291" y="23.132" fill="#000" font-size="14" textLength="479.172" font-weight="700" font-family="Arial">Proposed — Quality trade-off hypotheses and non-negotiable invariants</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="7"><rect x="119.87" y="44.099" width="318.833" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="129.87" y="67.23" fill="#000" font-size="14" textLength="298.833" font-family="Arial">Current authorization / synchronized invalidation</text></g><!--entity L--><g class="entity" data-qualified-name="L" id="ent0002" data-source-line="8"><rect x="29.61" y="156.199" width="215.351" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="39.61" y="179.33" fill="#000" font-size="14" textLength="195.351" font-family="Arial">Latency / dependency pressure</text></g><!--entity H--><g class="entity" data-qualified-name="H" id="ent0003" data-source-line="9"><rect x="279.95" y="156.199" width="308.682" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="289.95" y="179.33" fill="#000" font-size="14" textLength="288.682" font-family="Arial">Exact immutable history / protected references</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0004" data-source-line="10"><rect x="7" y="277.669" width="242.578" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="300.8" fill="#000" font-size="14" textLength="222.578" font-family="Arial">Storage / cleanup / recovery burden</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0005" data-source-line="11"><rect x="314.32" y="277.669" width="177.938" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="324.32" y="300.8" fill="#000" font-size="14" textLength="157.938" font-family="Arial">More worker concurrency</text></g><!--entity W--><g class="entity" data-qualified-name="W" id="ent0006" data-source-line="12"><rect x="120.49" y="399.139" width="263.599" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="130.49" y="422.27" fill="#000" font-size="14" textLength="243.599" font-family="Arial">Queue delay / web resource contention</text></g><!--entity I--><g class="entity" data-qualified-name="I" id="ent0007" data-source-line="13"><rect x="419.57" y="399.139" width="281.447" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="429.57" y="422.27" fill="#000" font-size="14" textLength="261.447" font-family="Arial">AFTER MVP: untrusted-code containment</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0008" data-source-line="14"><rect x="447.18" y="511.239" width="226.227" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="457.18" y="534.37" fill="#000" font-size="14" textLength="206.227" font-family="Arial">Capacity / setup / operating effort</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="23"><path d="M526.82,268.299 L526.82,323.145 A0,0 0 0 0 526.82,323.145 L977.753,323.145 A0,0 0 0 0 977.753,323.145 L977.753,278.299 L967.753,268.299 L684.87,268.299 L480.87,192.749 L676.87,268.299 L526.82,268.299 A0,0 0 0 0 526.82,268.299" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M967.753,268.299 L967.753,278.299 L977.753,278.299 L967.753,268.299" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="532.82" y="285.492" fill="#000" font-size="13" textLength="346.842" font-family="Arial">These are hypotheses, not measured correlations or scores.</text><text x="532.82" y="300.441" fill="#000" font-size="13" textLength="429.933" font-family="Arial">Security/history invariants are constraints, not tradeable benchmark points.</text><text x="532.82" y="315.39" fill="#000" font-size="13" textLength="347.547" font-family="Arial">No numerical worker, retention or latency setting is selected.</text></g><!--link A to L--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="15" data-link-type="dependency"><path d="M179.27,80.559 C164.13,87.429 150.26,96.969 140.29,110.199 C130.53,123.149 130.268,137.26 132.448,151.03" style="stroke:#181818;stroke-width:1;" fill="none" id="A-to-L"/><polygon points="133.23,155.969,135.773,146.454,132.448,151.03,127.872,147.705,133.23,155.969" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="141.29" y="123.392" fill="#000" font-size="13" textLength="260.851" font-family="Arial">correctness benefit; possible cost to measure</text></g><!--link H to S--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="16" data-link-type="dependency"><path d="M293.84,192.759 C216.16,203.129 134.1,215.529 128.29,222.299 C115.43,237.279 117.104,256.276 121.274,272.486" style="stroke:#181818;stroke-width:1;" fill="none" id="H-to-S"/><polygon points="122.52,277.329,124.152,267.616,121.274,272.486,116.404,269.609,122.52,277.329" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="129.29" y="235.492" fill="#000" font-size="13" textLength="281.804" font-family="Arial">integrity benefit; retention/lifecycle cost to assess</text></g><!--link C to W--><g class="link" data-entity-1="ent0005" 