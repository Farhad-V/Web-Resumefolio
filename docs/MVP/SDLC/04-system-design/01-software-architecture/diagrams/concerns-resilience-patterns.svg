<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:720px;height:757px;background:#FFFFFF;" width="720px" height="757px" viewBox="0 0 720 757" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="133.799" y="23.132" fill="#000" font-size="14" textLength="445.785" font-weight="700" font-family="Arial">Candidate resilience composition — not a generic retry-all wrapper</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0001" data-source-line="7"><rect x="203.012" y="44.099" width="298.571" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="213.012" y="67.23" fill="#000" font-size="14" textLength="278.571" font-family="Arial">Operation-specific eligibility / repetition policy</text></g><!--entity B--><g class="entity" data-qualified-name="B" id="ent0002" data-source-line="8"><rect x="209.212" y="141.199" width="286.164" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="219.212" y="164.33" fill="#000" font-size="14" textLength="179.785" font-family="Arial">Bulkhead / admission budget</text><text x="219.212" y="180.429" fill="#000" font-size="14" textLength="266.164" font-family="Arial">Bounded work class and shared headroom</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0003" data-source-line="9"><rect x="223.992" y="254.399" width="256.612" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="233.992" y="277.53" fill="#000" font-size="14" textLength="153.275" font-family="Arial">Circuit breaker if justified</text><text x="233.992" y="293.629" fill="#000" font-size="14" textLength="236.612" font-family="Arial">Scoped dependency health/admission</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0004" data-source-line="10"><rect x="213.882" y="382.599" width="276.833" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="223.882" y="405.73" fill="#000" font-size="14" textLength="256.833" font-family="Arial">Adapter with evaluated deadline / timeout</text><text x="223.882" y="421.829" fill="#000" font-size="14" textLength="235.771" font-family="Arial">Timeout does not confirm remote stop</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0005" data-source-line="11"><rect x="252.422" y="495.789" width="199.751" height="36.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="262.422" y="518.92" fill="#000" font-size="14" textLength="179.751" font-family="Arial">Actual outcome classification</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0006" data-source-line="12"><rect x="53.122" y="607.889" width="278.351" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="63.122" y="631.02" fill="#000" font-size="14" textLength="248.254" font-family="Arial">Safe read / proven no-effect local failure</text><text x="63.122" y="647.119" fill="#000" font-size="14" textLength="258.351" font-family="Arial">Bounded retry only when contract permits</text></g><!--entity U--><g class="entity" data-qualified-name="U" id="ent0007" data-source-line="13"><rect x="366.332" y="607.889" width="293.93" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="376.332" y="631.02" fill="#000" font-size="14" textLength="181.337" font-family="Arial">Possible consequential effect</text><text x="376.332" y="647.119" fill="#000" font-size="14" textLength="273.93" font-family="Arial">Same-attempt reconciliation, no blind repeat</text></g><!--link P to B--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="14" data-link-type="dependency"><path d="M352.302,80.649 C352.302,97.199 352.302,117.239 352.302,135.969" style="stroke:#181818;stroke-width:1;" fill="none" id="P-to-B"/><polygon points="352.302,140.969,356.302,131.969,352.302,135.969,348.302,131.969,352.302,140.969" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to C--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="15" data-link-type="dependency"><path d="M352.302,193.809 C352.302,211.889 352.302,231.049 352.302,249.109" style="stroke:#181818;stroke-width:1;" fill="none" id="B-to-C"/><polygon points="352.302,254.109,356.302,245.109,352.302,249.109,348.302,245.109,352.302,254.109" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link C to A--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="16" data-link-type="dependency"><path d="M352.302,307.039 C352.302,328.929 352.302,355.309 352.302,377.199" style="stroke:#181818;stroke-width:1;" fill="none" id="C-to-A"/><polygon points="352.302,382.199,356.302,373.199,352.302,377.199,348.302,373.199,352.302,382.199" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="353.302" y="349.792" fill="#000" font-size="13" textLength="185.726" font-family="Arial">closed / eligible controlled probe</text></g><!--link A to O--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="17" data-link-type="dependency"><path d="M352.302,435.189 C352.302,453.929 352.302,473.889 352.302,490.389" style="stroke:#181818;stroke-width:1;" fill="none" id="A-to-O"/><polygon points="352.302,495.389,356.302,486.389,352.302,490.389,348.302,486.389,352.302,495.389" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link O to R--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-source-line="18" data-link-type="dependency"><path d="M328.692,532.279 C301.832,552.109 261.734,581.719 230.974,604.429" style="stroke:#181818;stroke-width:1;" fill="none" id="O-to-R"/><polygon points="226.952,607.399,236.568,605.271,230.974,604.429,231.816,598.835,226.952,607.399" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="287.632" y="575.082" fill="#000" font-size="13" textLength="118.504" font-family="Arial">known safe eligibility</text></g><!--link O to U--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk13" data-source-line="19" data-link-type="dependency"><path d="M376.052,532.279 C403.082,552.109 443.44,581.731 474.4,604.441" style="stroke:#181818;stroke-width:1;" fill="none" id="O-to-U"/><polygon points="478.432,607.399,473.54,598.85,474.4,604.441,468.809,605.301,478.432,607.399" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="438.622" y="575.082" fill="#000" font-size="13" textLength="133.688" font-family="Arial">partial / unknown effect</text></g><g class="legend" data-source-line="20"><rect x="12" y="680.086" width="689.383" height="58.296" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="698.218" fill="#000" font-size="14" textLength="567.355" font-family="Arial">Values, backend, isolation budget, breaker scope and probe mechanism require evaluation.</text><text x="17" y="714.316" fill="#000" font-size="14" textLength="679.383" font-family="Arial">Bulkheads reduce resource coupling, not security isolation. A timeout/breaker cannot prove no external effect.</text><text x="17" y="730.415" fill="#000" font-size="14" textLength="529.929" font-family="Arial">Backoff, jitter and attempt limits apply only after actual repetition safety is established.</text></g><?plantuml-src LLH1aXCv4BptAog