<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:947px;height:572px;background:#FFFFFF;" width="947px" height="572px" viewBox="0 0 947 572" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="258.933" y="33.132" fill="#000" font-size="14" textLength="427.896" font-weight="700" font-family="Arial">Proposed exception handling preserves actual effect knowledge</text></g><ellipse cx="398.926" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="244.51" y="92.099" width="308.832" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="254.51" y="113.354" fill="#000" font-size="12" textLength="288.832" font-family="Arial">Resolve actual operation/attempt and current authority</text><polygon points="317.604,145.897,480.247,145.897,492.247,157.897,480.247,169.897,317.604,169.897,305.604,157.897,317.604,145.897" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="317.604" y="161.891" fill="#000" font-size="11" textLength="162.642" font-family="Arial">Input / authority / version refusal?</text><text x="288.487" y="155.566" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="492.247" y="155.566" fill="#000" font-size="11" textLength="12.235" font-family="Arial">no</text><rect x="16" y="179.897" width="303.482" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="201.153" fill="#000" font-size="12" textLength="228.785" font-family="Arial">Return safe invalid / denied / conflict result;</text><text x="26" y="214.952" fill="#000" font-size="12" textLength="283.482" font-family="Arial">no fabricated mutation or private existence disclosure</text><polygon points="524.938,179.897,735.281,179.897,747.281,191.897,735.281,203.897,524.938,203.897,512.938,191.897,524.938,179.897" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="524.938" y="195.891" fill="#000" font-size="11" textLength="210.343" font-family="Arial">Failure before any possible external effect?</text><text x="495.821" y="189.566" fill="#000" font-size="11" textLength="17.118" font-family="Arial">yes</text><text x="747.281" y="189.566" fill="#000" font-size="11" textLength="70.318" font-family="Arial">possible effect</text><rect x="349.482" y="213.897" width="262.115" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="359.482" y="235.153" fill="#000" font-size="12" textLength="242.115" font-family="Arial">Resolve local transaction/command outcome;</text><text x="359.482" y="248.952" fill="#000" font-size="12" textLength="207.451" font-family="Arial">repeat only if bounded contract permits</text><rect x="631.598" y="213.897" width="296.164" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="641.598" y="235.153" fill="#000" font-size="12" textLength="260.139" font-family="Arial">Retain confirmed / partial / unknown observation;</text><text x="641.598" y="248.952" fill="#000" font-size="12" textLength="276.164" font-family="Arial">reconcile same attempt before consequential repeat</text><polygon points="630.11,267.495,642.11,279.495,630.11,291.495,618.11,279.495,630.11,267.495" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="398.926,297.495,410.926,309.495,398.926,321.495,386.926,309.495,398.926,297.495" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="263.848" y="341.495" width="270.154" height="47.598" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="273.848" y="362.751" fill="#000" font-size="12" textLength="236.801" font-family="Arial">Create restricted bounded diagnostic record;</text><text x="273.848" y="376.55" fill="#000" font-size="12" textLength="250.154" font-family="Arial">exclude credentials and private payload dumps</text><rect x="199.838" y="409.093" width="398.176" height="33.799" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="209.838" y="430.349" fill="#000" font-size="12" textLength="378.176" font-family="Arial">Project truthful user/consumer result with permitted operation reference</text><ellipse cx="398.926" cy="473.892" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="398.926" cy="473.892" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="398.926" y1="72.099" x2="398.926" y2="92.099" style="stroke:#181818;stroke-width:1;"/><polygon points="394.926,82.099,398.926,92.099,402.926,82.099,398.926,86.099" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="512.938" y1="191.897" x2="480.54" y2="191.897" style="stroke:#181818;stroke-width:1;"/><line x1="480.54" y1="191.897" x2="480.54" y2="213.897" style="stroke:#181818;stroke-width:1;"/><polygon points="476.54,203.897,480.54,213.897,484.54,203.897,480.54,207.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="747.281" y1="191.897" x2="779.68" y2="191.897" style="stroke:#181818;stroke-width:1;"/><line x1="779.68" y1="191.897" x2="779.68" y2="213.897" style="stroke:#181818;stroke-width:1;"/><polygon points="775.68,203.897,779.68,213.897,783.68,203.897,779.68,207.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="480.54" y1="261.495" x2="480.54" y2="279.495" style="stroke:#181818;stroke-width:1;"/><line x1="480.54" y1="279.495" x2="618.11" y2=