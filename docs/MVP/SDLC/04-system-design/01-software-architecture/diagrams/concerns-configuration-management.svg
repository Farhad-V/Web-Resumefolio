Arial">No invented defaults or enabled features</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0003" data-source-line="9"><rect x="720.4" y="45.599" width="297.047" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="730.4" y="68.73" fill="#000" font-size="14" textLength="176.62" font-family="Arial">Restricted secret/key source</text><text x="730.4" y="84.829" fill="#000" font-size="14" textLength="277.047" font-family="Arial">Mechanism and recovery procedure pending</text></g><!--entity C--><g class="entity" data-qualified-name="C" id="ent0004" data-source-line="10"><rect x="380.28" y="175.299" width="317.281" height="52.197" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="390.28" y="198.43" fill="#000" font-size="14" textLength="259.15" font-family="Arial">Validate / compose effective configuration</text><text x="390.28" y="214.529" fill="#000" font-size="14" textLength="297.281" font-family="Arial">Environment + release identity + required scope</text></g><!--entity W--><g class="entity" data-qualified-name="W" id="ent0005" data-source-line="11"><rect x="377.24" y="288.489" width="119.358" height="46.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="476.598" y="293.489" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="474.598" y="295.489" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="474.598" y="299.489" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="392.24" y="321.62" fill="#000" font-size="14" textLength="79.358" font-family="Arial">Web runtime</text></g><!--entity J--><g class="entity" data-qualified-name="J" id="ent0006" data-source-line="12"><rect x="531.11" y="288.489" width="223.634" height="46.099" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="734.744"