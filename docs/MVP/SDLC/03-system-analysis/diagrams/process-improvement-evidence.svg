<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:841px;height:468px;background:#FFFFFF;" width="841px" height="468px" viewBox="0 0 841 468" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="230.17" y="25.107" fill="#000" font-size="14" textLength="373.673" font-weight="700" font-family="Segoe UI">CP — intended improvement versus demonstrated result</text></g><!--entity Baseline--><g class="entity" data-qualified-name="Baseline" id="ent0001" data-source-line="15"><rect x="7" y="46.621" width="400.675" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.649" fill="#000" font-size="13" textLength="172.713" font-family="Segoe UI">Explicit matched baseline case</text><text x="17" y="87.94" fill="#000" font-size="13" textLength="380.675" font-family="Segoe UI">Actual goal/data/context/method and observed outcome required</text></g><!--entity Candidate--><g class="entity" data-qualified-name="Candidate" id="ent0002" data-source-line="16"><rect x="445.66" y="46.621" width="381.353" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="455.66" y="70.649" fill="#000" font-size="13" textLength="180.007" font-family="Segoe UI">Actual candidate workflow case</text><text x="455.66" y="87.94" fill="#000" font-size="13" textLength="361.353" font-family="Segoe UI">Same defined comparison meaning; material differences visible</text></g><!--entity Compare--><g class="entity" data-qualified-name="Compare" id="ent0003" data-source-line="17"><rect x="275.77" y="143.201" width="291.127" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="285.77" y="167.229" fill="#000" font-size="13" textLength="271.127" font-family="Segoe UI">Compare actual outcomes / effort / correctness</text><text x="285.77" y="184.52" fill="#000" font-size="13" textLength="244.048" font-family="Segoe UI">Record uncertainty and unintended effects</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" id="ent0004" data-source-line="18"><rect x="242.21" y="239.791" width="358.248" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="252.21" y="263.819" fill="#000" font-size="13" textLength="315.085" font-family="Segoe UI">Only bounded evidence-supported improvement claim</text><text x="252.21" y="281.11" fill="#000" font-size="13" textLength="338.248" font-family="Segoe UI">No baseline or candidate run means no demonstrated gain</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="23"><path d="M207.66,336.371 L207.66,380.953 A0,0 0 0 0 207.66,380.953 L635.018,380.953 A0,0 0 0 0 635.018,380.953 L635.018,346.371 L625.018,336.371 L425.34,336.371 L421.34,294.471 L417.34,336.371 L207.66,336.371 A0,0 0 0 0 207.66,336.371" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M625.018,336.371 L625.018,346.371 L635.018,346.371 L625.018,336.371" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="213.66" y="355.399" fill="#000" font-size="13" textLength="406.358" font-family="Segoe UI">A cleaner diagram or unified screen does not prove efficiency/usability.</text><text x="213.66" y="372.69" fill="#000" font-size="13" textLength="379.736" font-family="Segoe UI">Preserve accepted scope, independent tailoring and actual history.</text></g><!--link Baseline to Compare--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M267.8,101.641 C296.97,114.531 327.297,127.929 356.447,140.819" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Baseline-to-Compare"/><polygon points="361.02,142.841,354.407