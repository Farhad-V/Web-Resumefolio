 font-size="13" textLength="87.541" font-family="Segoe UI">not established</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M402.84,160.761 L402.84,222.634 A0,0 0 0 0 402.84,222.634 L780.775,222.634 A0,0 0 0 0 780.775,222.634 L780.775,170.761 L770.775,160.761 L595.81,160.761 L591.81,123.321 L587.81,160.761 L402.84,160.761 A0,0 0 0 0 402.84,160.761" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M770.775,160.761 L770.775,170.761 L780.775,170.761 L770.775,160.761" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="408.84" y="179.789" fill="#000" font-size="13" textLength="164.626" font-family="Segoe UI">OAuth has not been created.</text><text x="408.84" y="197.08" fill="#000" font-size="13" textLength="297.515" font-family="Segoe UI">Read, draft, send and reply are separate capabilities.</text><text x="408.84" y="214.371" fill="#000" font-size="13" textLength="356.935" font-family="Segoe UI">Unknown send: reconcile same attempt before eligible resend.</text></g><!--link User to Product--><!--link User to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="20" data-link-type="dependency"><path d="M198.24,102.711 C205.88,103.111 213.49,103.441 220.84,103.691 C306.24,106.601 397.764,104.527 470.804,101.667" style="stroke:#526B7B;stroke-width:1;" fill="none" id="User-to-Product-1"/><polygon points="475.8,101.471,466.65,97.826,470.804,101.667,466.963,105.82,475.8,101.471" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.203" y="82.719" fill="#000" font-size="13" textLength="130.355" font-family="Segoe UI">Selected account/goal;</text><text x="232.34" y="100.01" fill="#000" font-size="13" textLength="136.081" font-family="Segoe UI">explicit final send intent</text></g><!--link Product to User--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk8" data-source-li