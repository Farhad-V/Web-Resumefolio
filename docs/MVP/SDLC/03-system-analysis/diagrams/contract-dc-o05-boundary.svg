<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:698px;height:593px;background:#FFFFFF;" width="698px" height="593px" viewBox="0 0 698 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="204.621" y="25.107" fill="#000" font-size="14" textLength="282.051" font-weight="700" font-family="Segoe UI">DC-O05 — Disable a specific protected link</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="16"><rect x="255.59" y="46.621" width="216.346" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="265.59" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="265.59" y="87.94" fill="#000" font-size="13" textLength="196.346" font-family="Segoe UI">Intended link identified; download</text><text x="265.59" y="105.231" fill="#000" font-size="13" textLength="153.404" font-family="Segoe UI">configuration independent</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="17"><rect x="97.29" y="196.491" width="220.941" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="107.29" y="220.519" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="107.29" y="237.81" fill="#000" font-size="13" textLength="200.941" font-family="Segoe UI">Exact link effectively disabled; fresh</text><text x="107.29" y="255.101" fill="#000" font-size="13" textLength="79.428" font-family="Segoe UI">access denied</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="18"><rect x="76.19" y="311.361" width="263.153" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="86.19" y="335.389" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="86.19" y="352.68" fill="#000" font-size="13" textLength="243.153" font-family="Segoe UI">PDF settings unchanged; already delivered</text><text x="86.19" y="369.971" fill="#000" font-size="13" textLength="110.506" font-family="Segoe UI">bytes outside recall</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="22"><path d="M356.24,210.141 L356.24,254.723 L683.292,254.723 L683.292,220.141 L673.292,210.141 L356.24,210.141" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M673.292,210.141 L673.292,220.141 L683.292,220.141 L673.292,210.141" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="362.24" y="229.169" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="362.24" y="246.46" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="26"><path d="M6,426.241 L6,488.114 A0,0 0 0 0 6,488.114 L409.529,488.114 A0,0 0 0 0 409.529,488.114 L409.529,436.241 L399.529,426.241 L211.76,426.241 L207.76,383.621 L203.76,426.241 L6,426.241 A0,0 0 0 0 6,426.241" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.241 L399.529,436.241 L409.529,436.241 L399.529,426.241" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.269" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.56" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="479.851" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="19" data-link-type="dependency"><path d="M312.65,118.761 C304.08,125.341 295.47,132.391 287.76,139.491 C268.94,156.841 253.22,174.472 238.52,192.312" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="235.34,196.171,244.15,191.769,238.52,192.312,237.976,186.682,235.34,196.171" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="366.344" y="154.519" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O05</text><text x="288.76" y="171.81" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="22" data-link-type="association"><path d="M471.94,118.891 C480.78,124.761 488.93,131.581 495.76,139.491 C512.81,159.211 517.95,189.611 519.4,209.991" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="30"><rect x="64.984" y="509.114" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="69.984" y="529.222" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="69.984" y="547.843" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="69.984" y="566.464" fill="#000" font-size="14" textLength="551.325" f