301.809" fill="#000" font-size="13" textLength="230.242" font-family="Segoe UI">Identified conditional handoff candidate</text><text x="146.571" y="319.1" fill="#000" font-size="13" textLength="363.911" font-family="Segoe UI">04 function gap and exact semantic/dependency limits retained</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M98.361,375.371 L98.361,437.244 A0,0 0 0 0 98.361,437.244 L558.683,437.244 A0,0 0 0 0 558.683,437.244 L558.683,385.371 L548.683,375.371 L332.521,375.371 L328.521,332.671 L324.521,375.371 L98.361,375.371 A0,0 0 0 0 98.361,375.371" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M548.683,375.371 L548.683,385.371 L558.683,385.371 L548.683,375.371" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="104.361" y="394.399" fill="#000" font-size="13" textLength="414.991" font-family="Segoe UI">These artifacts exist; no minute-by-minute task timeline is reconstructed.</text><text x="104.361" y="411.69" fill="#000" font-size="13" textLength="439.321" font-family="Segoe UI">A prescribed working method or local PBI date is not actual Sprint execution.</text><text x="104.361" y="428.981" fill="#000" font-size="13" textLength="382.891" font-family="Segoe UI">No elapsed delay or performance gain follows from artifact counts.</text></g><!--link Source to Model--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M328.521,101.541 C328.521,119.771 328.521,138.841 328.521,157.031" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Source-to-Model"/><polygon points="328.521,162.031,332.521,153.031,328.521,157.031,324.521,153.031,328.521,162.031" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="329.521" y="137.229" fill="#000" font-size="13" textLength="146.313" font-family="Segoe UI">documentary provenance</text></g><!--link Model to Handoff--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M328.521,217.121 C328.521,235.351 328.521,254.421 328.521,272.611" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Model-to-Handoff"/><polygon points="328.521,277.611,332.521,268.611,328.521,272.611,324.521,268.611,328.521,277.611" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="329.521" y="252.809" fill="#000" font-size="13" textLength="187.262" font-family="Segoe UI">inspectable package relationship</text></g><g class="legend" data-source-line="26"><rect x="12" y="458.244" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="478.352" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="496.973" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLJ9Sjiu4BtpAxhYGowX76_9nAbAbML9PLKbZYjo9fTSGB19OKG2702Kh3dDHymNpfVCQr1IoPdan0MzlANHB-dpj_lfb_pJxm_v-UlpD_dPMVxwaZol3M-kwSw4wBpHgg5JKaraRrKqQnxHH4KkoHM1_Hg_d2NdaVO7Q_m_xMtW9hqUPv49r7cM51niJ5owFbB1shN6rgH8zzwpZGGq55td6bTlHrbO6Tifhregb5xLtlMslCMPfytIH3uwBxbIVHDdpiPxrJ8jk7PCN-S_3rcOlvZEBeuEmrALRYDOAjM4uyetthlDqFJawlpD-EtuwD23gR9rm-CVy9rC9xFBsSz3dI_P_wgYTV7_nMQpsSLazcFKSPtnktTNLs-VHPIGkwEBtuunABkIdvVdMJInORgRBnu_VvdVtdo4or_l5zEFqzl7wOJ-_ViVkdr8ZzBfleKrOgYFfb8wWakJd0zBquKCVi4pAboC3Z8ROOh3xC2ONZnuqog_fQ1TnsZb-SyUSL8tuBCqAKCYyC7Q12d-tKwVC8LYId2zrqogn-1u4xUaBE1epPtWAaGgFBNp_89Ke4KAVmR0TNsJ1dVZ_4fAjX2e2QaGuaHB55YoNg7la4-DWLn0r3Yv1gO4MXCD3uXL3KNbzQ0ARWv2z03XavG_HZ1FwPL9E6rf4k66bW3WgeeqdgO4mkyMjx3gRLA4QjKbYFma7GAt2aNqQSaTMscs1SZMG4JFKHdBPMf-jojwCfdDpgOtsOvFddyOSD7rmLRHlFDkpLO1UZOSI-2-nZKP6phX