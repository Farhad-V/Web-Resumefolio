315,200.451 L835.315,190.451" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="428.35" y="209.479" fill="#000" font-size="13" textLength="401.965" font-family="Segoe UI">PDF mode, published view, link eligibility and artifact availability differ.</text><text x="428.35" y="226.77" fill="#000" font-size="13" textLength="394.748" font-family="Segoe UI">Fresh disabled-link access is denied after confirmed effective change.</text><text x="428.35" y="244.061" fill="#000" font-size="13" textLength="364.933" font-family="Segoe UI">Already delivered bytes are outside recall; no unrelated fallback.</text></g><!--link Viewer to Product--><!--link Viewer to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="19" data-link-type="dependency"><path d="M191.76,132.371 C199.4,132.781 207.01,133.131 214.35,133.381 C323.29,137.201 443.244,133.996 528.044,130.526" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Viewer-to-Product-1"/><polygon points="533.04,130.321,523.884,126.692,528.044,130.526,524.211,134.686,533.04,130.321" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="238.35" y="95.409" fill="#000" font-size="13" textLength="137.973" font-family="Segoe UI">Exact link/password and</text><text x="240.245" y="112.7" fill="#000" font-size="13" textLength="134.183" font-family="Segoe UI">selected representation</text><text x="285.811" y="129.991" fill="#000" font-size="13" textLength="43.05" font-family="Segoe UI">request</text></g><!--link Product to Viewer--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="20" data-link-type="dependency"><path d="M533.02,134.091 C496.34,140.571 455.66,151.831 422.35,171.381 C409.05,179.191 413.42,191.051 399.35,197.381 C324.39,231.161 293.34,220.211 214.35,197.381 C184.19,188.671 158.3,172.378 136.68,155.938" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Product-to-Vi