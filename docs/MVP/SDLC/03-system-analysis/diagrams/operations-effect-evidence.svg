<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:819px;height:426px;background:#FFFFFF;" width="819px" height="426px" viewBox="0 0 819 426" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="269.35" y="25.107" fill="#000" font-size="14" textLength="273.841" font-weight="700" font-family="Segoe UI">SQ — operation effect versus observation</text></g><!--entity Intent--><g class="entity" data-qualified-name="Intent" id="ent0001" data-source-line="15"><rect x="260.67" y="46.621" width="261.211" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="270.67" y="70.649" fill="#000" font-size="13" textLength="215.192" font-family="Segoe UI">Intended operation / attempt identity</text><text x="270.67" y="87.94" fill="#000" font-size="13" textLength="241.211" font-family="Segoe UI">Current exact subject / revision / authority</text></g><!--entity Evidence--><g class="entity" data-qualified-name="Evidence" id="ent0002" data-source-line="16"><rect x="242.68" y="162.201" width="297.202" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="252.68" y="186.229" fill="#000" font-size="13" textLength="125.969" font-family="Segoe UI">Actual effect evidence</text><text x="252.68" y="203.52" fill="#000" font-size="13" textLength="277.202" font-family="Segoe UI">Confirmed / failed / partial / pending / unknown</text></g><!--entity Next--><g class="entity" data-qualified-name="Next" id="ent0003" data-source-line="17"><rect x="7" y="281.431" width="350.561" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="305.459" fill="#000" font-size="13" textLength="123.005" font-family="Segoe UI">Permitted next action</text><text x="17" y="322.75" fill="#000" font-size="13" textLength="330.561" font-family="Segoe UI">Observe / reconcile same context; separately eligible retry</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M396.01,277.791 L396.01,339.664 L804.541,339.664 L804.541,287.791 L794.541,277.791 L396.01,277.791" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M794.541,277.791 L794.541,287.791 L804.541,287.791 L794.541,277.791" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="402.01" y="296.819" fill="#000" font-size="13" textLength="369.707" font-family="Segoe UI">Failure or timeout does not universally prove old state / rollback.</text><text x="402.01" y="314.11" fill="#000" font-size="13" textLength="363.175" font-family="Segoe UI">Cancel request is not confirmed stop; completion may win race.</text><text x="402.01" y="331.401" fill="#000" font-size="13" textLength="387.531" font-family="Segoe UI">Evidence access itself needs a bounded grant and secret protection.</text></g><!--link Intent to Evidence--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M391.28,101.541 C391.28,119.771 391.28,138.841 391.28,157.031" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Intent-to-Evidence"/><polygon points="391.28,162.031,395.28,153.031,391.28,157.031,387.28,153.031,391.28,162.031" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="392.28" y="137.229" fill="#000" font-size="13" textLength="230.801" font-family="Segoe UI">request or missing reply is not the effect</text></g><!--link Evidence to Next--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M343.59,217.241 C309.5,236.371 268.171,259.545 234.121,278.645" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Evidence-to-Next"/><polygon points="229.76,281.091,239.566,280.177,234.121,278.645,235.652,273.199,229.76,281.091" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="306.5" y="252.819" fill="#000" font-size="13" textLength="189.998" font-family="Segoe UI">no blind resend / restart / deploy</text></g><!--link Evidence to GMN6--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M463.08,217.181 C477.36,223.341 492.03,230.311 505.28,237.791 C525.61,249.261 546.67,264.391 563.79,277.641" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Evidence-GMN6"/></g><g class="legend" data-source-line="26"><rect x="139.369" y="360.664" width="533.804" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="144.369" y="380.772" fill="#000" font-size="14" textLength="523.804" font-family="Segoe UI">Logical analysis / evidence boundaries, not installed controls or selected architecture.</text><text x="144.369" y="399.393" fill="#000" font-size="14" textLength="492.762" font-family="Segoe UI">No security, load, provider, backup, restore or live-change operation performed.</text></g><?plantuml-src TLJBSXCn4BplLqp1WOiTanVXKKKL2N4LLH02573X8cjdRH6jPf5cuvWJ7y4NyYMqj8vPNZVjQjJJFTCpz-ZrnulpjzDN7owd1_SF7aptzwVtZoZojUFrOy9liXAPPcIZf3IrlQeBopqwot-xo8c36dKIPgRhlBF3kN6U4qcaj3AHQpAzhYGwtSmYMxdck24Nharq9YYIjSQ5H5k0XUUzAbsvq9beMbeOUxMCqeVwJ3mGrokdFBglkJ6zrxa4lJ0jqpjU2jFx5_yEUUU-CkqVZYx1i9OrD55ZV1eZFujHraFIkyS73qvFJaUNqA4cB3sV_i7lxldp-T7ytw4IQux_GmoYVuFDv_F3v_C_eyOufuyU7H-V_1PHeoiT7JuSSp3XAlyyEgZKgKUPtj2FRzz9EewbPSHD0vw4tgGUhLiaZjVbfbBfI8KMeYeefijwyl-TBhhp8YY76et-XJSZeyfjf-HgU0Iz_nJE-XXn9hunI9NwnUUSSbRibhQFRfroXqoYWglZJC-iziRViiKxW5i6j8J6nHOKPcWax9SFqAuEqJY1NkxnZFfm5MGT2lpvzlaumIN7re5vJO5lb4pH-YcyBWNXGjPAiCX0AViD7uh09uJoejJAVaFitTB1nuZLE2YvG4mroA7fzEakDJr6q9UUa-PnQLrAcMRa3Z0kvNQJhdYhjzgzoX0P4iy3MkDTgAaC