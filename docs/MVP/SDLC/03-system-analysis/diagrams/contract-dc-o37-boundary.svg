<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:713px;height:593px;background:#FFFFFF;" width="713px" height="593px" viewBox="0 0 713 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="132.954" y="25.107" fill="#000" font-size="14" textLength="440.385" font-weight="700" font-family="Segoe UI">DC-O37 — Perform and assess an authorized isolated recovery drill</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="16"><rect x="302.65" y="46.621" width="234.221" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="312.65" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="312.65" y="87.94" fill="#000" font-size="13" textLength="214.221" font-family="Segoe UI">Actual protected recovery source and</text><text x="312.65" y="105.231" fill="#000" font-size="13" textLength="212.964" font-family="Segoe UI">authorized isolated scenario required</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="17"><rect x="82.05" y="196.491" width="251.429" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.05" y="220.519" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="92.05" y="237.81" fill="#000" font-size="13" textLength="231.429" font-family="Segoe UI">Usable scoped recovery only after actual</text><text x="92.05" y="255.101" fill="#000" font-size="13" textLength="203.176" font-family="Segoe UI">defined checks/measurements pass</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003"