<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:666px;height:586px;background:#FFFFFF;" width="666px" height="586px" viewBox="0 0 666 586" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="206.937" y="25.107" fill="#000" font-size="14" textLength="245.171" font-weight="700" font-family="Segoe UI">CP — hypothesis support or rejection</text></g><!--entity Hypothesis--><g class="entity" data-qualified-name="Hypothesis" id="ent0001" data-source-line="15"><rect x="213.378" y="46.621" width="288.652" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="223.378" y="70.649" fill="#000" font-size="13" textLength="268.652" font-family="Segoe UI">Specific suspected mechanism / possible effect</text><text x="223.378" y="87.94" fill="#000" font-size="13" textLength="268.404" font-family="Segoe UI">State competing explanation and affected case</text></g><!--entity Method--><g class="entity" data-qualified-name="Method" id="ent0002" data-source-line="16"><rect x="26.798" y="144.201" width="395.807" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="36.798" y="168.229" fill="#000" font-size="13" textLength="236.825" font-family="Segoe UI">Define actual evidence and interpretation</text><text x="36.798" y="185.52" fill="#000" font-size="13" textLength="375.807" font-family="Segoe UI">Relevant case + policy + measure; no invented target/sample size</text></g><!--entity Observe--><g class="entity" data-qualified-name="Observe" id="ent0003" data-source-line="17"><rect x="81.148" y="259.781" width="323.107" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="91.148" y="283.809" fill="#000" font-size="13" textLength="250.942" font-family="Segoe UI">Inspect permitted actual case / record limits</text><text x="91.148" y="301.1" fill="#000" font-size="13" textLength="303.107" font-family="Segoe UI">Distinguish genuine rework from intended difference</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" id="ent0004" data-source-line="18"><rect x="167.788" y="357.371" width="391.827" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="177.788" y="381.399" fill="#000" font-size="13" textLength="309.582" font-family="Segoe UI">Support, reject or narrow only what evidence warrants</text><text x="177.788" y="398.69" fill="#000" font-size="13" textLength="371.827" font-family="Segoe UI">Unknown remains unknown; no automatic root-cause conclusion</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="24"><path d="M142.938,454.951 L142.938,499.533 A0,0 0 0 0 142.938,499.533 L584.457,499.533 A0,0 0 0 0 584.457,499.533 L584.457,464.951 L574.457,454.951 L367.698,454.951 L363.698,412.341 L359.698,454.951 L142.938,454.951 A0,0 0 0 0 142.938,454.951" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M574.457,454.951 L574.457,464.951 L584.457,464.951 L574.457,454.951" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="148.938" y="473.979" fill="#000" font-size="13" textLength="420.52" font-family="Segoe UI">Current CP-H rows are untested, not confirmed user/product bottlenecks.</text><text x="148.938" y="491.27" fill="#000" font-size="13" textLength="337.022" font-family="Segoe UI">Documentation facts CP-F have a different evidence scope.</text></g><!--link Hypothesis to Method--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M320.658,101.541 C302.208,114.791 284.028,127.853 265.608,141.093" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Hypothesis-to-Method"/><polygon points="261.548,144.011,271.19,142.006,265.608,141.093,266.521,135.51,261.548,144.011" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Method to Observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="20" data-link-type="dependency"><path d="M215.648,199.241 C212.798,211.441 211.198,225.991 214.698,238.781 C216.638,245.871 217.481,248.622 221.151,255.092" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Method-to-Observe"/><polygon points="223.618,259.441,222.657,249.639,221.151,255.092,215.698,253.586,223.618,259.441" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="215.698" y="234.809" fill="#000" font-size="13" textLength="222.796" font-family="Segoe UI">later separately performed observation</text></g><!--link Observe to Result--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="21" data-link-type="dependency"><path d="M276.408,314.701 C293.188,327.961 309.493,340.843 326.253,354.073" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Observe-to-Result"/><polygon points="330.178,357.171,325.592,348.455,326.253,354.073,320.635,354.734,330.178,357.171" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Result to Hypothesis--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M391.698,357.181 C403.068,345.081 415.448,329.981 423.698,314.371 C439.938,283.641 439.218,273.241 443.698,238.781 C449.128,197.091 460.128,181.991 441.698,144.201 C433.328,127.041 422.491,115.627 407.591,104.477" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Result-to-Hypothesis"/><polygon points="403.588,101.481,408.397,110.076,407.591,104.477,413.19,103.671,403.588,101.481" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="447.618" y="234.809" fill="#000" font-size="13" textLength="182.628" font-family="Segoe UI">refine if another explanation fits</text></g><g class="legend" data-source-line="28"><rect x="12" y="520.533" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="540.641" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="559.262" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLJBSjiu4BppAwRYGmvhIl4hsIHLgOejiv93d9HLoLvyWS2XX0W4k0DGYlQq7x5Vk5-I1YZPT1udKS1WfgUxPvxInxzkhc_B3ry-bQVFJf-N9oVbitCItXZUlY8Sa_R2D2KjFeHIzp4QjvpGLJhjX0ExgABnRggwpXezV3V6SY0l55PAk2RLnvKN4tTJOUqtB3ioRgF4A1THh5N61TedM5YU565jNAT4jRHGUhqKtxlwobjatAvCvD5zpOtgRQoyYpUgPPhpqZDzVl_haBdvX-daR7G9XBNVeYTgb0tZp6z5_7OeUdHn-lponUNe4dr4vPQMBt_0TtGzgywhNuTwgLb-bz7v-7EogghEPjMFKUCybozVNboyU1HHGvMEpluSOr1kdGxFJujeecMw-aJ___iVhNQTZoiE9b3ekyvBJAe9VmLc25b4tr7qjF0nUX1fP7z-tnCzcNUiJMCq4WHyHiZTibufPq8BttImZO6cn4s3spitXryOhcexJbOY_jPPvR9lI3bu9SSXYrQ1dv0AzEuUvBZkZ1lZc9IElR84mzRiDESKnaKMc7DmvfsxPSkRPBMKalu09XXjXu-MLUY5NuEqP4Xu6NMZaYN7QL1jXpe1ZiaeFZ0yN8yHl7UvOUfOMXFJqpsON6QQX8TIP0rkmvsRcP0QxarOqP9Tdz0BRxsigH6mcr2x6bbg0meaTPCBVrm4bWq_udpGwdYlLDBCgMHNyixkC2CgFZ2onGsQ1uBFRktyrjrFN3_yp-rZH7qBlZI9zx7KgWz99QTj7q1YHdBB0ND4HxEgEhb-MppeGcNvva3Gy9DFziZf5LbeZct0oOsH0H6SDLvQTEjpK5QgE3n8ZuTYnRxcPF9cv0Dab45-qq3nT2gFZDI0yIBDoi6wlZaalEe5t4PCGFaElMwnUB3AUf0V8E5nch3KTsCoEh0WqqvytOFcbCkoOxqEasBcTTyUjX-MXuuXvQnefT21kbTnf4JGliDoWyfvZel2yZBz6J0MSz-Bvd81zy1AJjaTMdszzoCj68aDb4uEFymj3-WJve77D3Vx1gCAQr3-Tvzg0_2D7mOZhVPZMa1MnrZfEIp2esvv3AzkqbhFxM9Nxss8TzdfgL40C2qYDjpc8c3jGSpSsz3KTm00?></g></svg>