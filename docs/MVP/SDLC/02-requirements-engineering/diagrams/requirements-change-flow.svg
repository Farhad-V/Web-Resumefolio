ct / commitment / baseline decision required?</text><text x="379.048" y="269.428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="795.233" y="269.428" fill="#000" font-size="14" textLength="242.813" font-family="Arial">within existing authorized editing scope</text><rect x="185.875" y="294.395" width="319.626" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="195.875" y="317.526" fill="#17324D" font-size="14" textLength="299.626" font-family="Arial">Present concrete options and reviewed proposal</text><polygon points="194.32,350.493,497.056,350.493,509.056,362.493,497.056,374.493,194.32,374.493,182.32,362.493,194.32,350.493" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="194.32" y="367.576" fill="#17324D" font-size="14" textLength="302.736" font-family="Arial">Actual owner disposition authorizes this change?</text><text x="160.534" y="359.526" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="509.056" y="359.526" fill="#000" font-size="14" textLength="175.116" font-family="Arial">pending / rejected / deferred</text><rect x="16" y="384.493" width="312.64" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="407.625" fill="#17324D" font-size="14" textLength="292.64" font-family="Arial">Apply only the authorized scope and conditions</text><rect x="359.626" y="384.493" width="318.86" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="369.626" y="407.625" fill="#17324D" font-size="14" textLength="298.86" font-family="Arial">Retain actual outcome, rationale and obligations</text><rect x="357.302" y="440.592" width="323.509" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="367.302" y="463.724" fill="#17324D" font-size="14" textLength="303.509" font-family="Arial">Do not imply acceptance or bypass retained gate</text><ellipse cx="519.056" cy="507.69" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="519.056" cy="507.69" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="710.811" y="294.395" width="279.137" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="720.811" y="317.526" fill="#17324D" font-size="14" textLength="259.137" font-family="Arial">Proceed within existing request / authority</text><polygon points="598.033,528.69,610.033,540.69,598.033,552.69,586.033,540.69,598.033,528.69" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="371.707" y="572.69" width="452.653" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="381.707" y="595.822" fill="#17324D" font-size="14" textLength="432.653" font-family="Arial">Update affected primary records, definitions, scenarios and trace links</text><rect x="396.983" y="628.789" width="402.102" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="406.983" y="651.921" fill="#17324D" font-size="14" textLength="382.102" font-family="Arial">Identify changed revision and perform actual relevant recheck</text><rect x="384.131" y="684.888" width="427.805" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="394.131" y="708.02" fill="#17324D" font-size="14" textLength="407.805" font-family="Arial">Record evidence / open findings and preserve superseded history</text><ellipse cx="598.033" cy="751.986" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="598.033" cy="751.986" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="598.033" y1="72.099" x2="598.033" y2="92.099" style="stroke:#64748B;stroke-width:1;"/><polyg