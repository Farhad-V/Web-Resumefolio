428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="804.102" y="269.428" fill="#000" font-size="14" textLength="42.027" font-family="Arial">not yet</text><rect x="226.654" y="294.395" width="321.943" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="236.654" y="317.526" fill="#17324D" font-size="14" textLength="301.943" font-family="Arial">Assess observations against the agreed criterion</text><polygon points="251.434,350.493,523.818,350.493,535.818,362.493,523.818,374.493,251.434,374.493,239.434,362.493,251.434,350.493" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="251.434" y="367.576" fill="#17324D" font-size="14" textLength="272.385" font-family="Arial">Criterion supported within evaluated scope?</text><text x="217.647" y="359.526" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="535.818" y="359.526" fill="#000" font-size="14" textLength="134.62" font-family="Arial">not met / inconclusive</text><rect x="16" y="384.493" width="353.067" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="407.625" fill="#17324D" font-size="14" textLength="333.067" font-family="Arial">Record supported conclusion with evidence and limits</text><rect x="389.067" y="384.493" width="387.302" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="399.067" y="407.625" fill="#17324D" font-size="14" textLength="367.302" font-family="Arial">Record unmet need, uncertainty and affected commitments</text><rect x="398.785" y="440.592" width="367.867" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="408.785" y="463.724" fill="#17324D" font-size="14" textLength="347.867" font-family="Arial">Analyze options and route material choices to the owner</text><poly