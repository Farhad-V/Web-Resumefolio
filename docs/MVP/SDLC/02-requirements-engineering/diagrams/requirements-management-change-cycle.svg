ied; record owner, next action and gate</text><ellipse cx="567.197" cy="507.69" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="567.197" cy="507.69" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="796.327" y="294.395" width="392.791" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="806.327" y="317.526" fill="#17324D" font-size="14" textLength="372.791" font-family="Arial">Proceed within accepted meaning and existing authorization</text><polygon points="683.669,528.69,695.669,540.69,683.669,552.69,671.669,540.69,683.669,528.69" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="481.46" y="572.69" width="404.419" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="491.46" y="595.822" fill="#17324D" font-size="14" textLength="384.419" font-family="Arial">Update authoritative text, criteria, models, definitions and links</text><rect x="508.684" y="628.789" width="349.971" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="518.684" y="651.921" fill="#17324D" font-size="14" textLength="329.971" font-family="Arial">Re-review affected content and evidence applicability</text><polygon points="562.273,684.888,805.065,684.888,817.065,696.888,805.065,708.888,562.273,708.888,550.273,696.888,562.273,684.888" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="562.273" y="701.97" fill="#17324D" font-size="14" textLength="242.792" font-family="Arial">Relevant checks and review complete?</text><text x="528.487" y="693.921" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="817.065" y="693.921" fill="#000" font-size="14" textLength="42.027" font-family="Arial">not yet</text><rect x="310.864" y="718.888" width="351.502" height="36.09