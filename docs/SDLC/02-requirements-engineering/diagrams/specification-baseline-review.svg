<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:711px;height:730px;background:#FFFFFF;" width="711px" height="730px" viewBox="0 0 711 730" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="207.987" y="33.132" fill="#000" font-size="14" textLength="293.33" font-weight="700" font-family="Arial">Resumefolio | Specification review roadmap</text></g><ellipse cx="367.471" cy="62.099" rx="10" ry="10" fill="#17324D" style="stroke:#222;stroke-width:1;"/><rect x="164.475" y="92.099" width="405.991" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.475" y="115.23" fill="#17324D" font-size="14" textLength="385.991" font-family="Arial">Use accepted scope, constraints and actual elicitation sources</text><rect x="162.165" y="148.197" width="410.612" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="172.165" y="171.329" fill="#17324D" font-size="14" textLength="390.612" font-family="Arial">Review proposed user and YAML / CI-CD specification records</text><rect x="144.634" y="204.296" width="445.674" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="154.634" y="227.428" fill="#17324D" font-size="14" textLength="425.674" font-family="Arial">Resolve affected behavior, permission, lifecycle and target questions</text><rect x="137.624" y="260.395" width="459.694" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.624" y="283.526" fill="#17324D" font-size="14" textLength="439.694" font-family="Arial">Investigate decisive provider / resource / execution dependencies early</text><rect x="152.037" y="316.493" width="430.867" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="162.037" y="339.625" fill="#17324D" font-size="14" textLength="410.867" font-family="Arial">Reconcile SRS, domains, dictionary, scenarios and final identifiers</text><rect x="150.865" y="372.592" width="433.212" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="160.865" y="395.724" fill="#17324D" font-size="14" textLength="413.212" font-family="Arial">Record actual traceability, review findings and unresolved blockers</text><polygon points="204.041,428.69,530.901,428.69,542.901,440.69,530.901,452.69,204.041,452.69,192.041,440.69,204.041,428.69" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="204.041" y="445.773" fill="#17324D" font-size="14" textLength="326.86" font-family="Arial">Baseline criteria satisfied for an identified candidate?</text><text x="170.254" y="437.724" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="542.901" y="437.724" fill="#000" font-size="14" textLength="100.406" font-family="Arial">pending / unmet</text><rect x="16" y="462.69" width="332.081" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="485.822" fill="#17324D" font-size="14" textLength="312.081" font-family="Arial">Seek and record actual owner baseline disposition</text><rect x="419.529" y="462.69" width="266.743" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="429.529" y="485.822" fill="#17324D" font-size="14" textLength="246.743" font-family="Arial">Record gap, owner and dependent gate</text><rect x="414.498" y="518.789" width="276.806" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="424.498" y="541.921" fill="#17324D" font-size="14" textLength="256.806" font-family="Arial">Revise affect