ptance outcome</text><rect x="452.881" y="496.69" width="254.247" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="462.881" y="519.822" fill="#17324D" font-size="14" textLength="234.247" font-family="Arial">Keep incomplete work distinguishable</text><rect x="379.743" y="552.789" width="400.522" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="389.743" y="575.921" fill="#17324D" font-size="14" textLength="380.522" font-family="Arial">Record explicit disposition / reselection under reviewed policy</text><polygon points="383.938,594.888,395.938,606.888,383.938,618.888,371.938,606.888,383.938,594.888" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="221.404" y="638.888" width="325.067" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="231.404" y="662.02" fill="#17324D" font-size="14" textLength="305.067" font-family="Arial">Record Sprint / goal outcome under defined rules</text><rect x="846.455" y="182.197" width="275.247" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="856.455" y="205.329" fill="#17324D" font-size="14" textLength="255.247" font-family="Arial">Do not claim valid planning or completion</text><rect x="810.266" y="238.296" width="347.626" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="820.266" y="261.428" fill="#17324D" font-size="14" textLength="327.626" font-family="Arial">Record permitted feedback or unresolved policy gate</text><polygon points="684.008,680.986,696.008,692.986,684.008,704.986,672.008,692.986,684.008,680.986" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="684.008" cy="735.986" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx