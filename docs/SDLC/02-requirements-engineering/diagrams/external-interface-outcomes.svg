<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1111px;height:738px;background:#FFFFFF;" width="1111px" height="738px" viewBox="0 0 1111 738" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="413.26" y="33.132" fill="#000" font-size="14" textLength="283.22" font-weight="700" font-family="Arial">Resumefolio | External interface outcomes</text></g><ellipse cx="623.69" cy="62.099" rx="10" ry="10" fill="#17324D" style="stroke:#222;stroke-width:1;"/><rect x="447.525" y="92.099" width="352.329" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="457.525" y="115.23" fill="#17324D" font-size="14" textLength="332.329" font-family="Arial">Identify interface, intended operation, actor and target</text><rect x="434.704" y="148.197" width="377.971" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="444.704" y="171.329" fill="#17324D" font-size="14" textLength="357.971" font-family="Arial">Apply the relevant reviewed contract and authority checks</text><polygon points="470.76,204.296,776.62,204.296,788.62,216.296,776.62,228.296,470.76,228.296,458.76,216.296,470.76,204.296" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="470.76" y="221.378" fill="#17324D" font-size="14" textLength="305.86" font-family="Arial">Required authority and input conditions satisfied?</text><text x="436.973" y="213.329" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="788.62" y="213.329" fill="#000" font-size="14" textLength="15.572" font-family="Arial">no</text><rect x="159.522" y="238.296" width="373.309" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="169.522" y="261.428" fill="#17324D" font-size="14" textLength="353.309" font-family="Arial">Perform bounded operation under interface-specific rules</text><polygon points="276.525,294.395,415.828,294.395,427.828,306.395,415.828,318.395,276.525,318.395,264.525,306.395,276.525,294.395" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="276.525" y="311.477" fill="#17324D" font-size="14" textLength="139.303" font-family="Arial">Outcome established?</text><text x="242.739" y="303.428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="427.828" y="303.428" fill="#000" font-size="14" textLength="117.537" font-family="Arial">unknown / pending</text><rect x="16" y="328.395" width="318.02" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="351.526" fill="#17324D" font-size="14" textLength="298.02" font-family="Arial">Record actual success, rejection or partial result</text><rect x="354.02" y="328.395" width="326.646" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="364.02" y="351.526" fill="#17324D" font-size="14" textLength="306.646" font-family="Arial">Retain uncertainty and defined reconciliation path</text><polygon points="346.176,370.493,358.176,382.493,346.176,394.493,334.176,382.493,346.176,370.493" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="178.977" y="414.493" width="334.398" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.977" y="437.625" fill="#17324D" font-size="14" textLength="314.398" font-family="Arial">Apply only effects supported by established results</text><rect x="158.75" y="470.592" width="374.854" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="168.75" y="493.724" fill="#17324D" font-size="14" textLength="354.854" font-family="Arial">Handle retry / cancellation under operation-specific policy</text><rect x="710.666" y="238.296" width="381.074" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="720.666" y="261.428" fill="#17324D" font-size="14" textLength="361.074" font-family="Arial">Deny or report invalid request without protected disclosure</text><polygon points="623.69,512.69,635.69,524.69,623.69,536.69,611.69,524.69,623.69,512.69" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="463.494" y="556.69" width="320.392" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="473.494" y="579.822" fill="#17324D" font-size="14" textLength="300.392" font-family="Arial">Show truthful permitted outcome and next action</text><ellipse cx="623.69" cy="623.789" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="623.69" cy="623.789" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="623.69" y1="72.099" x2="623.69" y2="92.099" style="stroke:#64748B;stroke-width:1;"/><polygon points="619.69,82.099,623.69,92.099,627.69,82.099,623.69,86.099" fill="#64748B" style="stroke:#64748B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.69" y1="128.197" x2="623.69" y2="148.197" style="stroke:#64748B;stroke-width:1;"/><polygon points="619.69,138.197,623.69,148.197,627.69,138.197,623.69,142.197" fill="#64748B" style="stroke:#64748B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.525" y1="306.395" x2="175.01" y2="306.395" style="stroke:#64748B;stroke-width:1;"/><line x1="175.01" y1="306.395" x2="175.01" y2="328.395" style="stroke:#64748B;stroke-width:1;"/><polygon points="171.01,318.395,175.01,328.395,179.01,318.395,175.01,322.395" fill="#64748B" style="stroke:#64748B;stroke-width: