,262.296,568.342,250.296,580.342,238.296" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="580.342" y="255.378" fill="#17324D" font-size="14" textLength="194.544" font-family="Arial">Admission conditions satisfied?</text><text x="546.556" y="247.329" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="786.886" y="247.329" fill="#000" font-size="14" textLength="15.572" font-family="Arial">no</text><rect x="232.713" y="272.296" width="297.813" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="242.713" y="295.428" fill="#17324D" font-size="14" textLength="277.813" font-family="Arial">Perform required processing and association</text><polygon points="228.696,328.395,534.542,328.395,546.542,340.395,534.542,352.395,228.696,352.395,216.696,340.395,228.696,328.395" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="228.696" y="345.477" fill="#17324D" font-size="14" textLength="305.847" font-family="Arial">Completion conditions and applicable limits hold?</text><text x="194.909" y="337.428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="546.542" y="337.428" fill="#000" font-size="14" textLength="119.841" font-family="Arial">failure / interruption</text><rect x="16" y="362.395" width="332.081" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="385.526" fill="#17324D" font-size="14" textLength="312.081" font-family="Arial">Expose usable success and consistent accounting</text><rect x="419.453" y="362.395" width="323.488" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="429.453" y="385.526" fill="#17324D" font-size="14" textLength="303.488" font-family="Arial">Do not expose partial work as successful content</text><rect x="368.081" y="418.493" width="426.232" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="378.081" y="441.625" fill="#17324D" font-size="14" textLength="406.232" font-family="Arial">Preserve retained references; apply agreed failure / cleanup rules</text><polygon points="381.619,460.592,393.619,472.592,381.619,484.592,369.619,472.592,381.619,460.592" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="824.313" y="272.296" width="298.592" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="834.313" y="295.428" fill="#17324D" font-size="14" textLength="278.592" font-family="Arial">Reject or report the defined admission failure</text><polygon points="677.614,490.592,689.614,502.592,677.614,514.592,665.614,502.592,677.614,490.592" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1152.905" y="182.197" width="354.646" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1162.905" y="205.329" fill="#17324D" font-size="14" textLength="334.646" font-family="Arial">Deny protected operation without unrelated disclosure</text><polygon points="1003.921,520.592,1015.921,532.592,1003.921,544.592,991.921,532.592,1003.921,520.592" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="804.016" y="564.592" width="399.812" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="814.016" y="587.724" fill="#17324D" font-size="14" textLength="379.812" font-family="Arial">Report the actual bounded outcome to the authorized context</text><ellipse cx="1003.921" cy="631.69" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1003.921" cy="631.69" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line 