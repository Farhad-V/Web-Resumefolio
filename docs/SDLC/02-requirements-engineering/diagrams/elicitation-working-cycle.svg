<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:703px;height:1057px;background:#FFFFFF;" width="703px" height="1057px" viewBox="0 0 703 1057" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="220.968" y="33.132" fill="#000" font-size="14" textLength="259.089" font-weight="700" font-family="Arial">Resumefolio | Elicitation working cycle</text></g><ellipse cx="363.921" cy="62.099" rx="10" ry="10" fill="#17324D" style="stroke:#222;stroke-width:1;"/><rect x="192.428" y="92.099" width="342.984" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="202.428" y="115.23" fill="#17324D" font-size="14" textLength="322.984" font-family="Arial">Select an actor goal and accepted scope references</text><rect x="192.432" y="148.197" width="342.978" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="202.432" y="171.329" fill="#17324D" font-size="14" textLength="322.978" font-family="Arial">Review existing decisions and identify genuine gaps</text><rect x="184.653" y="204.296" width="358.536" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="194.653" y="227.428" fill="#17324D" font-size="14" textLength="338.536" font-family="Arial">Choose technique, material / participants and rationale</text><rect x="193.997" y="304.395" width="339.847" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="203.997" y="327.526" fill="#17324D" font-size="14" textLength="319.847" font-family="Arial">Capture actual source statements and observations</text><rect x="174.173" y="360.493" width="379.495" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184.173" y="383.625" fill="#17324D" font-size="14" textLength="359.495" font-family="Arial">Explore success, alternatives, failure, access and lifecycle</text><rect x="177.646" y="416.592" width="372.55" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="187.646" y="439.724" fill="#17324D" font-size="14" textLength="352.55" font-family="Arial">Separate interpretations, assumptions and solution ideas</text><rect x="192.056" y="472.69" width="343.729" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="202.056" y="495.822" fill="#17324D" font-size="14" textLength="323.729" font-family="Arial">Summarize and obtain actual clarification / feedback</text><rect x="201.78" y="528.789" width="324.281" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="211.78" y="551.921" fill="#17324D" font-size="14" textLength="304.281" font-family="Arial">Record unresolved questions and evidence limits</text><polygon points="363.921,260.395,375.921,272.395,363.921,284.395,351.921,272.395,363.921,260.395" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="217.218,584.888,510.623,584.888,522.623,596.888,510.623,608.888,217.218,608.888,205.218,596.888,217.218,584.888" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="367.921" y="622.02" fill="#000" font-size="14" textLength="15.572" font-family="Arial">no</text><text x="217.218" y="601.97" fill="#17324D" font-size="14" textLength="293.405" font-family="Arial">Further clarification available and needed now?</text><text x="522.623" y="593.921" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><polygon points="254.976,643.52,472.865,643.52,484.865,655.52,472.865,667.52,254.976,667.52,242.976,655.52,254.976,643.52" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="254.976" y="660.602" fill="#17324D" font-size="14" textLength="217.889" font-family="Arial">Material questions still unresolved?</text><text x="221.19" y="652.553" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="484.865" y="652.553" fill="#000" font-size="14" textLength="87.179" font-family="Arial">no known gap</text><rect x="16" y="677.52" width="352.329" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="700.651" fill="#17324D" font-size="14" textLength="332.329" font-family="Arial">Assign owner, next action and dependent review gate</text><rect x="54.165" y="733.618" width="275.999" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="64.165" y="756.75" fill="#17324D" font-size="14" textLength="255.999" font-family="Arial">Mark unreviewed interpretations explicitly</text><rect x="388.329" y="677.52" width="294.695" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="398.329" y="700.651" fill="#17324D" font-size="14" textLength="274.695" font-family="Arial">Record actual review outcome and its scope</text><polygon points="363.921,775.717,375.921,787.717,363.921,799.717,351.921,787.717,363.921,775.717" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="188.142" y="819.717" width="351.557" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="198.142" y="842.849" fill="#17324D" font-size="14" textLength="331.557" font-family="Arial">Hand reviewed needs and open questions to analysis</text><rect x="205.29" y="875.815" width="317.261" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="215.29" y="898.947" fill="#17324