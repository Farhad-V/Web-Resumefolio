<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:874px;height:888px;background:#FFFFFF;" width="874px" height="888px" viewBox="0 0 874 888" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="292.691" y="33.132" fill="#000" font-size="14" textLength="287.082" font-weight="700" font-family="Arial">Resumefolio | Adaptive elicitation roadmap</text></g><ellipse cx="443.889" cy="62.099" rx="10" ry="10" fill="#17324D" style="stroke:#222;stroke-width:1;"/><rect x="247.907" y="92.099" width="391.964" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="257.907" y="115.23" fill="#17324D" font-size="14" textLength="371.964" font-family="Arial">Review accepted scope, actors, sources and actual extracts</text><rect x="265.766" y="192.197" width="356.246" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="275.766" y="215.329" fill="#17324D" font-size="14" textLength="336.246" font-family="Arial">Select one coherent goal and genuine information gap</text><rect x="256.818" y="248.296" width="374.143" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="266.818" y="271.428" fill="#17324D" font-size="14" textLength="354.143" font-family="Arial">Choose technique and prepare questions / evidence plan</text><polygon points="276.183,304.395,611.595,304.395,623.595,316.395,611.595,328.395,276.183,328.395,264.183,316.395,276.183,304.395" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="276.183" y="321.477" fill="#17324D" font-size="14" textLength="335.412" font-family="Arial">Required material, access and participation available?</text><text x="242.397" y="313.428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="623.595" y="313.428" fill="#000" font-size="14" textLength="42.027" font-family="Arial">not yet</text><rect x="136.241" y="338.395" width="200.564" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.241" y="361.526" fill="#17324D" font-size="14" textLength="180.564" font-family="Arial">Conduct the bounded activity</text><rect x="47.541" y="394.493" width="377.964" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.541" y="417.625" fill="#17324D" font-size="14" textLength="357.964" font-family="Arial">Record actual date, sources, raw evidence and limitations</text><rect x="16" y="450.592" width="441.046" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="473.724" fill="#17324D" font-size="14" textLength="421.046" font-family="Arial">Separate interpretation and record actual feedback / pending review</text><rect x="69.707" y="506.69" width="333.633" height="36.099" fill="#DCFCE7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="79.707" y="529.822" fill="#17324D" font-size="14" textLength="313.633" font-family="Arial">Hand reviewed needs and explicit gaps to analysis</text><rect x="477.046" y="338.395" width="348.419" height="36.099" fill="#FEF3C7" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="487.046" y="361.526" fill="#17324D" font-size="14" textLength="328.419" font-family="Arial">Keep activity planned; record blocker and next action</text><rect x="513.622" y="394.493" width="275.268" height="36.099" fill="#DBEAFE" style="stroke:#64748B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="523.622" y="417.625" fill="#17324D" font-size="14" textLength="255.268" font-family="Arial">Keep dependent commitment unresolved</text><polygon points="443.889,548.789,455.