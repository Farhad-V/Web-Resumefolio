<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:713px;height:594px;background:#FFFFFF;" width="713px" height="594px" viewBox="0 0 713 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="210.88" y="25.107" fill="#000" font-size="14" textLength="284.792" font-weight="700" font-family="Segoe UI">DC-O14 — Unlink a local provider mapping</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="291.5" y="46.621" width="256.539" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="301.5" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="301.5" y="87.94" fill="#000" font-size="13" textLength="236.539" font-family="Segoe UI">Local association identified; provider may</text><text x="301.5" y="105.231" fill="#000" font-size="13" textLength="94.32" font-family="Segoe UI">be disconnected</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="82.5" y="196.621" width="251.397" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.5" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="92.5" y="237.94" fill="#000" font-size="13" textLength="231.397" font-family="Segoe UI">Only intended local mapping removed if</text><text x="92.5" y="255.231" fill="#000" font-size="13" textLength="58.367" font-family="Segoe UI">confirmed</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="86" y="311.621" width="243.603" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="96" y="335.649" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="96" y="352.94" fill="#000" font-size="13" textLength="223.603" font-family="Segoe UI">Provider event is not deleted by unlink;</text><text x="96" y="370.231" fill="#000" font-size="13" textLength="156.749" font-family="Segoe UI">local authority still required</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M371.5,210.121 L371.5,254.703 L698.552,254.703 L698.552,220.121 L688.552,210.121 L371.5,210.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M688.552,210.121 L688.552,220.121 L698.552,220.121 L688.552,210.121" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="377.5" y="229.149" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="377.5" y="246.44" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,426.621 L6,488.494 A0,0 0 0 0 6,488.494 L409.529,488.494 A0,0 0 0 0 409.529,488.494 L409.529,436.621 L399.529,426.621 L212,426.621 L208,383.681 L204,426.621 L6,426.621 A0,0 0 0 0 6,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.621 L399.529,436.621 L409.529,436.621 L399.529,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.649" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.94" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="480.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M291.22,117.231 C278.92,123.491 267.24,130.881 257,139.621 C239.51,154.531 229.216,172.665 221.366,191.815" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="219.47,196.441,226.585,189.631,221.366,191.815,219.183,186.596,219.47,196.441" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="335.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O14</text><text x="258" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M451.63,118.731 C457.52,125.561 463.54,132.741 469,139.621 C487.57,163.031 507.35,191.071 520.37,210.001" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="72.614" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="77.614" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="77.614" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="77.614" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="Segoe UI">No transaction, implementation component, rollback or deployment authority is selected.</text></g><?plantuml-src TLJRRjj647tdLmpYbnQGv3gscuk10hgGWG1R2Ypx8OZwi2Q7qa3B7NPtQKTzwaVq2_ibdI5bXN4IG0_IpiwPSywSLTYHguqt5JoOVBVntBXYofOzF6qfOXAEzG9BqzYOiOiBKo6iSCC8z_CVNrdHtmXdvxrYs9g2dyXje3Gsz977tlDJD_JaylNlapUJNj5Z7etRM9oyu7UIphABxCTNsHVeVuReE7uFbcNP-InxUQkFCtdtxlBopJSt2WnOm_dRFWVZTdfuyJg9N4DaUE0OMRmXfKViaYHIj0YpwN1vTW7__VClt3jBRWS6BEV6GktvaMGmLAQknR3aA0nUJT9iUPl2AQJNym_poVnwVlTfxQxRFXC2vsHq24Y_YrGI5bTzlFtQFQ1m2Jax9wXOl98sc6397ljpfij5Dh-zIMUmkfzEqzKAbejhcRHqTW_a8he2YmFV0qtnl-97EQLoxGI_95yTyCTbHD-7psx7DwhYu-toBftUoPYRTBoOBpwitSTdjlWe4e22haAYPL7OmiCUcjQjgxNhfficRjbJt4E8PAsm-AiHhxl1cTUedioox2mT9vrC60x_w1Z1-yCMrgv6Nr7K2LYMmXDC7XjZHUnHITBr33zlgH1t_vGqEq5gHoGQb-TLS_biwBJnNaNW5wEGHwR65L0sLbUDWb-GxYo0-6Zte-HkAwBbetdOa6gKEz4hX4VRxdVGce9VC6_QTRT17IMobJQuB-bq7EVbipW1bxX6CdO0jJJfzYJZZTiv4JM0Wblyt1ggEgj6oNr0208pPF6g2ndgeboEfwsAdEmXVB-eg-TlVnqbdVzI3CAVH69KRKU4JWP9bfI5EgKu1zEUsEzwaYnkz7idAidKFNbqJGm3TV6qvX2_MZc0KYSFnA8SwuExqbspfLoJOc8Z9n86Sg8sRogTUFRRA1ddsY0va5TJabNoSakYtT8tX-eLSDnA60gCXcotB6aG4j9fdB7x86SUItAeqADamI0Mk63oJZXLjMrBdMKvLpKx-Ja0pzRgdx5kH8onl6_9VKsF80Tv3lfwMtywP_u7?></g></svg>