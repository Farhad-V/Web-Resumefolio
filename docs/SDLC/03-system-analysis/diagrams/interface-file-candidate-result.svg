99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M886.169,203.551 L886.169,213.551 L896.169,213.551 L886.169,203.551" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="483" y="222.579" fill="#000" font-size="13" textLength="274.739" font-family="Segoe UI">Admitted candidate is not confirmed usable file.</text><text x="483" y="239.87" fill="#000" font-size="13" textLength="398.169" font-family="Segoe UI">Replacement/cleanup respects actual history and required references.</text><text x="483" y="257.161" fill="#000" font-size="13" textLength="360.858" font-family="Segoe UI">Effective policy / actual capacity are not inferred from free disk.</text></g><!--link Actor to Product--><!--link Actor to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M187.22,136.501 C194.92,136.921 202.6,137.291 210,137.551 C343.05,142.301 492.144,138.095 587.984,134.185" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Actor-to-Product-1"/><polygon points="592.98,133.981,583.824,130.351,587.984,134.185,584.151,138.345,592.98,133.981" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="270.274" y="99.579" fill="#000" font-size="13" textLength="123.754" font-family="Segoe UI">Intended candidate +</text><text x="211" y="116.87" fill="#000" font-size="13" textLength="242.303" font-family="Segoe UI">owner/language/provenance/replacement</text><text x="310.874" y="134.161" fill="#000" font-size="13" textLength="42.555" font-family="Segoe UI">context</text></g><!--link Product to Actor--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M592.8,145.531 C555.58,154.081 513.04,166.651 477,184.551 C465.37,190.321 466.27,198.321 454,202.551 C351.48,237.901 313.95,233.441 210,202.551 C179.96,193.631 154.384,176.91 133.204,160.18" style="stroke:#526B7B;s