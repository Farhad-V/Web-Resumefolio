<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:713px;height:594px;background:#FFFFFF;" width="713px" height="594px" viewBox="0 0 713 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="133.084" y="25.107" fill="#000" font-size="14" textLength="440.385" font-weight="700" font-family="Segoe UI">DC-O37 — Perform and assess an authorized isolated recovery drill</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="303" y="46.621" width="234.221" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="313" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="313" y="87.94" fill="#000" font-size="13" textLength="214.221" font-family="Segoe UI">Actual protected recovery source and</text><text x="313" y="105.231" fill="#000" font-size="13" textLength="212.964" font-family="Segoe UI">authorized isolated scenario required</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="82.5" y="196.621" width="251.429" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.5" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="92.5" y="237.94" fill="#000" font-size="13" textLength="231.429" font-family="Segoe UI">Usable scoped recovery only after actual</text><text x="92.5" y="255.231" fill="#000" font-size="13" textLength="203.176" font-family="Segoe UI">defined checks/measurements pass</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="85" y="311.621" width="246.421" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="95" y="335.649" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="95" y="352.94" fill="#000" font-size="13" textLength="226.421" font-family="Segoe UI">No live overwrite, old-right resurrection</text><text x="95" y="370.231" fill="#000" font-size="13" textLength="148.7" font-family="Segoe UI">or provider replay implied</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M371.5,210.121 L371.5,254.703 L698.552,254.703 L698.552,220.121 L688.552,210.121 L371.5,210.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M688.552,210.121 L688.552,220.121 L698.552,220.121 L688.552,210.121" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="377.5" y="229.149" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="377.5" y="246.44" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,426.621 L6,488.494 A0,0 0 0 0 6,488.494 L409.529,488.494 A0,0 0 0 0 409.529,488.494 L409.529,436.621 L399.529,426.621 L212,426.621 L208,383.681 L204,426.621 L6,426.621 A0,0 0 0 0 6,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.621 L399.529,436.621 L409.529,436.621 L399.529,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.649" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.94" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="480.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M302.85,111.721 C286.33,119.011 270.43,128.161 257,139.621 C239.51,154.531 229.216,172.665 221.366,191.815" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="219.47,196.441,226.585,189.631,221.366,191.815,219.183,186.596,219.47,196.441" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="335.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O37</text><text x="258" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M451.63,118.731 C457.52,125.561 463.54,132.741 469,139.621 C487.57,163.031 507.35,191.071 520.37,210.001" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="72.614" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="77.614" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="77.614" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="77.614" y="566.844" fill="#000" font-size="14" textLeng