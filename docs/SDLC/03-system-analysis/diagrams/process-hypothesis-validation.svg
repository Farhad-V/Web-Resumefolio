<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:666px;height:588px;background:#FFFFFF;" width="666px" height="588px" viewBox="0 0 666 588" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="206.937" y="25.107" fill="#000" font-size="14" textLength="245.171" font-weight="700" font-family="Segoe UI">CP — hypothesis support or rejection</text></g><!--entity Hypothesis--><g class="entity" data-qualified-name="Hypothesis" id="ent0001" data-source-line="14"><rect x="212.708" y="46.621" width="288.652" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="222.708" y="70.649" fill="#000" font-size="13" textLength="268.652" font-family="Segoe UI">Specific suspected mechanism / possible effect</text><text x="222.708" y="87.94" fill="#000" font-size="13" textLength="268.404" font-family="Segoe UI">State competing explanation and affected case</text></g><!--entity Method--><g class="entity" data-qualified-name="Method" id="ent0002" data-source-line="15"><rect x="26.208" y="144.621" width="395.807" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="36.208" y="168.649" fill="#000" font-size="13" textLength="236.825" font-family="Segoe UI">Define actual evidence and interpretation</text><text x="36.208" y="185.94" fill="#000" font-size="13" textLength="375.807" font-family="Segoe UI">Relevant case + policy + measure; no invented target/sample size</text></g><!--entity Observe--><g class="entity" data-qualified-name="Observe" id="ent0003" data-source-line="16"><rect x="80.708" y="260.621" width="323.107" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="90.708" y="284.649" fill="#000" font-size="13" textLength="250.942" font-family="Segoe UI">Inspect permitted actual case / record limits</text><text x="90.708" y="301.94" fill="#000" font-size="13" textLength="303.107" font-family="Segoe UI">Distinguish genuine rework from intended difference</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" id="ent0004" data-source-line="17"><rect x="167.208" y="358.621" width="391.827" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="177.208" y="382.649" fill="#000" font-size="13" textLength="309.582" font-family="Segoe UI">Support, reject or narrow only what evidence warrants</text><text x="177.208" y="399.94" fill="#000" font-size="13" textLength="371.827" font-family="Segoe UI">Unknown remains unknown; no automatic root-cause conclusion</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="23"><path d="M142.208,456.621 L142.208,501.203 A0,0 0 0 0 142.208,501.203 L583.727,501.203 A0,0 0 0 0 583.727,501.203 L583.727,466.621 L573.727,456.621 L367.208,456.621 L363.208,413.931 L359.208,456.621 L142.208,456.621 A0,0 0 0 0 142.208,456.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M573.727,456.621 L573.727,466.621 L583.727,466.621 L573.727,456.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="148.208" y="475.649" fill="#000" font-size="13" textLength="420.52" font-family="Segoe UI">Current CP-H rows are untested, not confirmed user/product bottlenecks.</text><text x="148.208" y="492.94" fill="#000" font-size="13" textLength="337.022" font-family="Segoe UI">Documentation facts CP-F have a different evidence scope.</text></g><!--link Hypothesis to Method--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M320.158,101.861 C301.718,115.181 283.533,128.306 265.113,141.596" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Hypothesis-to-Method"/><polygon points="261.058,144.521,270.697,142.499,265.113,141.596,266.016,136.011,261.058,144.521" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Method to Observe--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M215.238,199.631 C212.338,211.931 210.678,226.671 214.208,239.621 C216.178,246.821 217.066,249.705 220.796,256.265" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Method-to-Observe"/><polygon points="223.268,260.611,222.296,250.81,220.796,256.265,215.342,254.765,223.268,260.611" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="215.208" y="235.649" fill="#000" font-size="13" textLength="222.796" font-family="Segoe UI">later separately performed observation</text></g><!--link Observe to Result--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="20" data-link-type="dependency"><path d="M275.918,315.861 C292.698,329.181 309.01,342.124 325.77,355.414" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Observe-to-Result"/><polygon points="329.688,358.521,325.121,349.795,325.77,355.414,320.15,356.063,329.688,358.521" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Result to Hypothesis--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M390.638,358.431 C401.808,346.281 413.988,331.151 422.208,315.621 C438.598,284.651 438.498,274.351 443.208,239.621 C448.888,197.771 459.688,182.591 441.208,144.621 C432.838,127.431 421.996,115.994 407.096,104.804" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Result-to-Hypothesis"/><polygon points="403.098,101.801,407.892,110.404,407.096,104.804,412.696,104.007,403.098,101.801" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="448.208" y="235.649" fill="#000" font-size="13" textLength="182.628" font-family="Segoe UI">refine if another explanation fits</text></g><g class="legend" data-source-line="27"><rect x="12" y="522.203" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="542.311" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="560.932" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLFDKjim4BxxANRWM98CVwMK6MQ0u853VuOCDouRUPseiLUkLavAJts8Fc6Vf2lP0KFfAOwq-lRxsPMLvGOzrZ17irfurt9nvIhdOREqWJ9vkY-enBOAkUFm6Mk26IqSmVtjsoKp-vDW_t1mAKiitCRo0agiP8XyuRtRT4rtZm_UNvvS3YuzcO2ygEZo5R_Twsb-bBzTwdn1_d-8xCA_O7cU7qxprrL3dClJq-FZanSL1GarSFXXo05v5G-F3h9WGqLmzHN-_FeDoyV6XIM95P2sQPmFeA2UlYbdwpWBhe7WOEv2S6gazVtvaoROcJLaR6cD0eX-1YgW9hD4jbB311edOkTQI6Mfjmyy2nW8ZAiR2j5s-j5Ko1XX0Ra0J7MAOb1e1r3WvedaiE-KIii4Q4AB5T3Q5iI64eJbGBxn51Bg0zzHHMlaa23XdNAgh7dKZvfGMazdQfe-MXF7lW7zWi94i6wqZ-Z491QVA2nTCMHmoqamDEHh6-BJdangCud1Qr9GMRsL1vvQYO9RAqjO4BUHlQUDyoielReRMNEXA8LL2tnKanf_cGlvDRtmlCjghqygPiOOnnKSLu-w8nYU7TdeZOfN1lUyOhTXVLMZPO6s-v_aOwi9gry6l7DXPB2Lc1ARgXKrCJ6v8z4zWjrfdkzVNsJFkS1eTBurgFj99prp-0YLPkv19r2dCP1ILCzAvsjLwr9HIYhRFeYFksPPttCyFX_CWIBwBdvRQkBnrByOf58Tp-AkR4VNbLl0gzQhjq4tO7IZMZS2w4cj22GQuLxSiAYxj8cTkk0dZNT5gpP7h8gOp4h6sTIPjbQWlg56Bn4pXoMg0dnASP246DVGEDEKqnvdMKMB-AVZcCrSwmsDvZezEagCrQDAFUld4UQam5QJZXE-tLlgs4VEdOznRtg10MMbbdzlOsyb_DbrYx6sjDc3kSRA939APK5db1TxEglAlPSxKOkxCTHtQTAZK2LWQwrOKvsQg6lFOIPjdQY_?></g></svg>