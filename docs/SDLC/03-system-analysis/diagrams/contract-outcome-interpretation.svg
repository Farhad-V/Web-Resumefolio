<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:976px;height:587px;background:#FFFFFF;" width="976px" height="587px" viewBox="0 0 976 587" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="315.759" y="25.107" fill="#000" font-size="14" textLength="338.119" font-weight="700" font-family="Segoe UI">Contract outcomes — evidence required for a claim</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0001" data-source-line="15"><rect x="60" y="46.621" width="361.428" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="70" y="71.729" fill="#000" font-size="14" textLength="262.356" font-family="Segoe UI">Identify exact operation / subject / context</text><text x="70" y="90.35" fill="#000" font-size="14" textLength="341.428" font-family="Segoe UI">Evaluate current authority and applicable preconditions</text></g><!--entity deny--><g class="entity" data-qualified-name="deny" id="ent0002" data-source-line="16"><rect x="7" y="166.621" width="294.955" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="191.729" fill="#000" font-size="14" textLength="97.31" font-family="Segoe UI">Denied / invalid</text><text x="17" y="210.35" fill="#000" font-size="14" textLength="237.022" font-family="Segoe UI">No permitted consequential operation</text><text x="17" y="228.971" fill="#000" font-size="14" textLength="274.955" font-family="Segoe UI">Do not expose unrelated private information</text></g><!--entity eligible--><g class="entity" data-qualified-name="eligible" id="ent0003" data-source-line="17"><rect x="337" y="176.121" width="224.853" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="347" y="201.229" fill="#000" font-size="14" textLength="94.637" font-family="Segoe UI">Eligible request</text><text x="347" y="219.85" fill="#000" font-size="14" textLength="204.853" font-family="Segoe UI">Eligibility alone is not completion</text></g><!--entity evidence--><g class="entity" data-qualified-name="evidence" id="ent0004" data-source-line="18"><rect x="308" y="305.621" width="282.534" height="57.242" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="318" y="330.729" fill="#000" font-size="14" textLength="172.874" font-family="Segoe UI">Actual attributable evidence</text><text x="318" y="349.35" fill="#000" font-size="14" textLength="262.534" font-family="Segoe UI">Assess only the relevant effect and context</text></g><!--entity success--><g class="entity" data-qualified-name="success" id="ent0005" data-source-line="19"><rect x="40.5" y="425.621" width="229.604" height="75.863" fill="#DFF1EA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="50.5" y="450.729" fill="#000" font-size="14" textLength="170.905" font-family="Segoe UI">Confirmed required success</text><text x="50.5" y="469.35" fill="#000" font-size="14" textLength="209.604" font-family="Segoe UI">Claim the matching postcondition</text><text x="50.5" y="487.971" fill="#000" font-size="14" textLength="181.699" font-family="Segoe UI">Apply frame to this operation</text></g><!--entity other--><g class="entity" data-qualified-name="other" id="ent0006" data-source-line="20"><rect x="306" y="425.621" width="286.841" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="316" y="450.729" fill="#000" font-size="14" textLength="266.841" font-family="Segoe UI">Definite failure / bounded partial / pending</text><text x="316" y="469.35" fill="#000" font-size="14" textLength="231.383" font-family="Segoe UI">Report the specific known disposition</text><text x="316" y="487.971" fill="#000" font-size="14" textLength="242.088" font-family="Segoe UI">Do not claim the success postcondition</text></g><!--entity unknown--><g class="entity" data-qualified-name="unknown" id="ent0007" data-source-line="21"><rect x="628" y="425.621" width="334.638" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="638" y="450.729" fill="#000" font-size="14" textLength="199.876" font-family="Segoe UI">Unknown or contradictory effect</text><text x="638" y="469.35" fill="#000" font-size="14" textLength="212.071" font-family="Segoe UI">DC-O38: reconcile same operation</text><text x="638" y="487.971" fill="#000" font-size="14" textLength="314.638" font-family="Segoe UI">No blind consequential repeat or assumed rollback</text></g><!--link request to deny--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M221.84,103.791 C209.49,122.101 195.936,142.186 182.446,162.186" style="stroke:#486777;stroke-width:1;" fill="none" id="request-to-deny"/><polygon points="179.65,166.331,187.999,161.106,182.446,162.186,181.367,156.633,179.65,166.331" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.5" y="140.57" fill="#000" font-size="12" textLength="130.781" font-family="Segoe UI">prerequisite not satisfied</text></g><!--link request to eligible--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M302.88,103.731 C317.16,110.701 332.08,118.521 345.5,126.621 C369.93,141.361 391.782,157.34 411.562,172.82" style="stroke:#486777;stroke-width:1;" fill="none" id="request-to-eligible"/><polygon points="415.5,175.901,410.878,167.204,411.562,172.82,405.947,173.504,415.5,175.901" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.5" y="140.57" fill="#000" font-size="12" textLength="171.896" font-family="Segoe UI">applicable prerequisites satisfied</text></g><!--link eligible to evidence--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="24" data-link-type="dependency"><path d="M449.5,233.291 C449.5,254.671 449.5,279.141 449.5,300.511" style="stroke:#486777;stroke-width:1;" fill="none" id="eligible-to-evidence"/><polygon points="449.5,305.511,453.5,296.511,449.5,300.511,445.5,296.511,449.5,305.511" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="450.5" y="279.57" fill="#000" font-size="12" textLength="88.09" font-family="Segoe UI">inspect outcome</text></g><!--link evidence to success--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="25" data-link-type="dependency"><path d="M359.74,362.621 C339.68,369.521 318.67,377.341 299.5,385.621 C272.57,397.261 248.253,409.664 223.633,423.184" style="stroke:#486777;stroke-width:1;" fill="none" id="evidence-to-success"/><polygon points="219.25,425.591,229.064,424.765,223.633,423.184,225.213,417.753,219.25,425.591" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.5" y="399.57" fill="#000" font-size="12" textLength="140.602" font-family="Segoe UI">required effect established</text></g><!--link evidence to other--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk12" data-source-line="26" data-link-type="dependency"><path d="M449.5,362.791 C449.5,381.101 449.5,400.331 449.5,420.331" style="stroke:#486777;stroke-width:1;" fill="none" id="evidence-to-other"/><polygon points="449.5,425.331,453.5,416.331,449.5,420.331,445.5,416.331,449.5,425.331" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="450.5" y="399.57" fill="#000" font-size="12" textLength="218.068" font-family="Segoe UI">bounded evidence of another disposition</text></g><!--link evidence to unknown--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk13" data-source-line="27" data-link-type="dependency"><path d="M591.23,358.201 C620.37,365.241 650.4,374.231 677.5,385.621 C701.85,395.861 722.554,408.318 743.094,422.588" style="stroke:#486777;stroke-width:1;" fill="none" id="evidence-to-unknown"/><polygon points="747.2,425.441,742.091,417.021,743.094,422.588,737.526,423.591,747.2,425.441" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="709.5" y="399.57" fill="#000" font-size="12" textLength="232.477" font-family="Segoe UI">required evidence unavailable / inconsistent</text></g><g class="legend" data-source-line="28"><rect x="166.497" y="521.484" width="636.644" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="171.497" y="541.592" fill="#000" font-size="14" textLength="497.205" font-family="Segoe UI">Interpretation guide, not a new execution algorithm, stored enum or retry policy.</text><text x="171.497" y="560.213" fill="#000" font-size="14" textLength="626.644" font-family="Segoe UI">Read-only operations and admission/cancellation requests have their own bounded success meaning.</text></g><?plantuml-src TLJBSjD04BphAwR8DI45IKZmWIgJs5MvX2eeRhwCLoDfo6fNxCF6dFW8lf0lONRrY1p2pTOykgUdP_qZcmuTjh15zLWx6qrvQxLri6yuKE6dU4aLHXtMreG7R0c-K6q9ljw_dFA5VnAykPm5VOEbtREfeKBjvvsNpjbz3tfoUVFk-lhwUV2fuzjPo94AQ6fD7vzHFrcjrbVhvOkfrfNa_WTcRFYtsNgzlhXRFi-Qz_buzVxctTLHHacUEhYOVtHe7jF7owiYSD04jpALGnN0ng1iInx-_FeDjEEIZ2BX_3soen8gmK1G6hajWkqWMDZQ4Am8pcamjgQO1eHNzr8Uk3e0_SZDEtAOSk0SVDn-aqJvfGIRVeIDMUrGHmm4AZedXO0nDDPnE02Q4h3hD2lSIkDECAmfEVNohm1zPaW-pC7loB1GFWSsqfZBZNcm80nQ3a6-ImEVYeGWwYTg6tDdawn2kREU81f76bD1vtYNsB4H5TgSdA5bniEqcXd-IdFDYUt0JGRCNrZdYRGrqijdB96yqpHrfA5otcsfGXIU68BZRGnPXd4_6xFqdhm7Q_G1GfCWDUrG9AIgIYed_GQTUuIXSeuW7gZOjJBfj6uVbPA-6tERDfuxo-2gIQSZweHf2S90jdE0ogLx55U4HaQRHCsOGpCukLkltwoMnwkgsCYDopsoZevaQTja-wGwkhoWSrcTW9bwOp