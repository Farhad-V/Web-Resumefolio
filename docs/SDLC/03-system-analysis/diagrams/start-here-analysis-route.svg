<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:632px;height:853px;background:#FFFFFF;" width="632px" height="853px" viewBox="0 0 632 853" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="26"><text x="175.967" y="41.107" fill="#000" font-size="14" textLength="278.906" font-weight="700" font-family="Segoe UI">System Analysis — iterative working route</text></g><ellipse cx="161.276" cy="76.621" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="21.056" y="106.621" width="280.441" height="66.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="37.056" y="136.649" fill="#000" font-size="13" textLength="248.441" font-family="Segoe UI">Read accepted scope, current requirements</text><text x="37.056" y="153.94" fill="#000" font-size="13" textLength="109.808" font-family="Segoe UI">and decision status</text><rect x="61.925" y="193.203" width="198.702" height="66.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="77.925" y="223.231" fill="#000" font-size="13" textLength="139.718" font-family="Segoe UI">Maintain system context</text><text x="77.925" y="240.522" fill="#000" font-size="13" textLength="166.702" font-family="Segoe UI">(roles, exchanges, exclusions)</text><rect x="16" y="323.785" width="290.553" height="49.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="32" y="353.813" fill="#000" font-size="13" textLength="258.553" font-family="Segoe UI">Refine domain concepts and conceptual data</text><rect x="55.508" y="393.076" width="211.537" height="66.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="71.508" y="423.104" fill="#000" font-size="13" textLength="179.537" font-family="Segoe UI