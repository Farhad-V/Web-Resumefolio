<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:364px;height:533px;background:#FFFFFF;" width="364px" height="533px" viewBox="0 0 364 533" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="31.931" y="25.107" fill="#000" font-size="14" textLength="293.228" font-weight="700" font-family="Segoe UI">SA-RV02 — review and change-impact route</text></g><!--entity Change--><g class="entity" data-qualified-name="Change" id="ent0001" data-source-line="14"><rect x="38.5" y="46.621" width="279.689" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="48.5" y="70.649" fill="#000" font-size="13" textLength="213.738" font-family="Segoe UI">Identify changed authoritative source</text><text x="48.5" y="87.94" fill="#000" font-size="13" textLength="259.689" font-family="Segoe UI">Retain accepted decisions and prior snapshot</text></g><!--entity Impact--><g class="entity" data-qualified-name="Impact" id="ent0002" data-source-line="15"><rect x="16.5" y="144.621" width="323.818" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="26.5" y="168.649" fill="#000" font-size="13" textLength="295.731" font-family="Segoe UI">Locate affected candidate/model/operation context</text><text x="26.5" y="185.94" fill="#000" font-size="13" textLength="303.818" font-family="Segoe UI">Use matrices as associations, not automatic coverage</text></g><!--entity Review--><g class="entity" data-qualified-name="Review" id="ent0003" data-source-line="16"><rect x="15" y="260.621" width="327.315" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="25" y="284.649" fill="#000" font-size="13" textLength="285.41" font-family="Segoe UI">Recheck local identities and structural consistency</text><text x="25" y="301.94" fill="#000" font-size="13" textLength="307.315" font-family="Segoe UI">Then inspect exact semantic cases / unresolved policy</text></g><!--entity Record--><g class="entity" data-qualified-name="Record" id="ent0004" data-source-line="17"><rect x="7" y="358.621" width="343.089" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="382.649" fill="#000" font-size="13" textLength="259.219" font-family="Segoe UI">Identify updated candidate and scoped gates</text><text x="17" y="399.94" fill="#000" font-size="13" textLength="323.089" font-family="Segoe UI">Record actual reviewer/owner disposition when it occurs</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="23"><path d="M14.5,456.621 L14.5,518.494 A0,0 0 0 0 14.5,518.494 L342.06,518.494 A0,0 0 0 0 342.06,518.494 L342.06,466.621 L332.06,456.621 L182.5,456.621 L178.5,413.781 L174.5,456.621 L14.5,456.621 A0,0 0 0 0 14.5,456.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M332.06,456.621 L332.06,466.621 L342.06,466.621 L332.06,456.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="20.5" y="475.649" fill="#000" font-size="13" textLength="306.56" font-family="Segoe UI">No automatic RF/Q-D closure or baseline acceptance.</text><text x="20.5" y="492.94" fill="#000" font-size="13" textLength="286.552" font-family="Segoe UI">Future code/product results need actual evidence.</text><text x="20.5" y="510.231" fill="#000" font-size="13" textLength="296.893" font-family="Segoe UI">No requirement to repeat already accepted choices.</text></g><!--link Change to Impact--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M178.5,101.861 C178.5,115.181 178.5,126.231 178.5,139.521" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Change-to-Impact"/><polygon points="178.5,144.521,182.5,135.521,178.5,139.521,174.5,135.521,178.5,144.521" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Impact to Review--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M173.89,199.671 C172.9,206.481 172,213.801 171.5,220.621 C170.53,233.821 171.12,243.5 172.84,255.67" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Impact-to-Review"/><polygon points="173.54,260.621,176.241,251.15,172.84,255.67,168.32,252.269,173.54,260.621" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Review to Impact--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M178.5,260.561 C178.5,242.301 178.5,223.141 178.5,204.851" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Review-to-Impact"/><polygon points="178.5,199.851,174.5,208.851,178.5,204.851,182.5,208.851,178.5,199.851" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="179.5" y="235.649" fill="#000" font-size="13" textLength="146.523" font-family="Segoe UI">affected gap / refinement</text></g><!--link Review to Record--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="20" data-link-type="dependency"><path d="M178.5,315.861 C178.5,329.181 178.5,340.231 178.5,353.521" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Review-to-Record"/><polygon points="178.5,358.521,182.5,349.521,178.5,353.521,174.5,349.521,178.5,358.521" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src TLD1Rjj03Bph5KHohUqsYHkaXm9nKW41YW1rcfvosQmeQM5fkLrITjnJ7z4NzYNbIhQZfkb9C9SSpWp7l78-c6XQU3HsLKNgV7553KNOr4umuyDxWQNf6id9owrf4Uwm8eJxczTRxjm