<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:841px;height:469px;background:#FFFFFF;" width="841px" height="469px" viewBox="0 0 841 469" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="230.34" y="25.107" fill="#000" font-size="14" textLength="373.673" font-weight="700" font-family="Segoe UI">CP — intended improvement versus demonstrated result</text></g><!--entity Baseline--><g class="entity" data-qualified-name="Baseline" id="ent0001" data-source-line="14"><rect x="7" y="46.621" width="400.675" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="70.649" fill="#000" font-size="13" textLength="172.713" font-family="Segoe UI">Explicit matched baseline case</text><text x="17" y="87.94" fill="#000" font-size="13" textLength="380.675" font-family="Segoe UI">Actual goal/data/context/method and observed outcome required</text></g><!--entity Candidate--><g class="entity" data-qualified-name="Candidate" id="ent0002" data-source-line="15"><rect x="446" y="46.621" width="381.353" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="456" y="70.649" fill="#000" font-size="13" textLength="180.007" font-family="Segoe UI">Actual candidate workflow case</text><text x="456" y="87.94" fill="#000" font-size="13" textLength="361.353" font-family="Segoe UI">Same defined comparison meaning; material differences visible</text></g><!--entity Compare--><g class="entity" data-qualified-name="Compare" id="ent0003" data-source-line="16"><rect x="276" y="143.621" width="291.127" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="286" y="167.649" fill="#000" font-size="13" textLength="271.127" font-family="Segoe UI">Compare actual outcomes / effort / correctness</text><text x="286" y="184.94" fill="#000" font-size="13" textLength="244.048" font-family="Segoe UI">Record uncertainty and unintended effects</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" id="ent0004" data-source-line="17"><rect x="242.5" y="240.621" width="358.248" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="252.5" y="264.649" fill="#000" font-size="13" textLength="315.085" font-family="Segoe UI">Only bounded evidence-supported improvement claim</text><text x="252.5" y="281.94" fill="#000" font-size="13" textLength="338.248" font-family="Segoe UI">No baseline or candidate run means no demonstrated gain</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="22"><path d="M208,337.621 L208,382.203 A0,0 0 0 0 208,382.203 L635.358,382.203 A0,0 0 0 0 635.358,382.203 L635.358,347.621 L625.358,337.621 L425.5,337.621 L421.5,295.641 L417.5,337.621 L208,337.621 A0,0 0 0 0 208,337.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M625.358,337.621 L625.358,347.621 L635.358,347.621 L625.358,337.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="214" y="356.649" fill="#000" font-size="13" textLength="406.358" font-family="Segoe UI">A cleaner diagram or unified screen does not prove efficiency/usability.</text><text x="214" y="373.94" fill="#000" font-size="13" textLength="379.736" font-family="Segoe UI">Preserve accepted scope, independent tailoring and actual history.</text></g><!--link Baseline to Compare--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M267.4,101.711 C296.82,114.771 327.62,128.442 357.05,141.512" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Baseline-to-Compare"/><polygon points="361.62,143.541,355.018,136.232,357.05,141.512,351.771,143.544,361.62,143.541" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Candidate to Compare--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M576.32,101.711 C546.76,114.771 515.803,128.45 486.233,141.52" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Candidate-to-Compare"/><polygon points="481.66,143.541,491.509,143.561,486.233,141.52,488.275,136.244,481.66,143.541" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Compare to Result--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="20" data-link-type="dependency"><path d="M421.5,198.841 C421.5,211.901 421.5,222.571 421.5,235.601" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Compare-to-Result"/><polygon points="421.5,240.601,425.5,231.601,421.5,235.601,417.5,231.601,421.5,240.601" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="26"><rect x="99.655" y="403.203" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="104.655" y="423.311" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="104.655" y="441.932" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLFBRjim4BphAnR9DOwHLzCWG07RYO1UqY16RxbGuaeYJ75LScd7FVKZ-eNzaYubsr7Iz2QHkxEpCyEmCgvJNhLGg79LUufEByYIXqrZ6BDmkDTOgMWv9ySFgaLOOaq8txz-NB8qFn7EBaQNeL6QDiRLK2aRniWpxsap33s-ElyqlvwFBZsMh5njSVwEt_7zNNwPVrnANgF_7w8Z_XSip_EBk_nzrHXdVdDpTNNzfa9Zm0ukFeyvABTAXvVd6Hks28j7-FFhDnZ7w3HgC6tdQOqjEeOr-X23oDQI2-mLoxt7819