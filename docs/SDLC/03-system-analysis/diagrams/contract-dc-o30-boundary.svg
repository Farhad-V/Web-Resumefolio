<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:717px;height:594px;background:#FFFFFF;" width="717px" height="594px" viewBox="0 0 717 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="147.699" y="25.107" fill="#000" font-size="14" textLength="415.153" font-weight="700" font-family="Segoe UI">DC-O30 — Attempt a separately target-authorized deployment</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="319" y="46.621" width="210.03" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="329" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="329" y="87.94" fill="#000" font-size="13" textLength="190.03" font-family="Segoe UI">Exact target/artifact and separate</text><text x="329" y="105.231" fill="#000" font-size="13" textLength="183.079" font-family="Segoe UI">approval/conditions established</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="78.5" y="196.621" width="259.091" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="88.5" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="88.5" y="237.94" fill="#000" font-size="13" textLength="239.091" font-family="Segoe UI">Intended required target effect confirmed</text><text x="88.5" y="255.231" fill="#000" font-size="13" textLength="105.987" font-family="Segoe UI">by actual evidence</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="89" y="311.621" width="237.801" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="99" y="335.649" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="99" y="352.94" fill="#000" font-size="13" textLength="217.801" font-family="Segoe UI">Build/merge permission is insufficient;</text><text x="99" y="370.231" fill="#000" font-size="13" textLength="208.997" font-family="Segoe UI">unknown target needs reconciliation</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M375.5,210.121 L375.5,254.703 L702.552,254.703 L702.552,220.121 L692.552,210.121 L375.5,210.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M692.552,210.121 L692.552,220.121 L702.552,220.121 L692.552,210.121" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="381.5" y="229.149" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="381.5" y="246.44" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,426.621 L6,488.494 A0,0 0 0 0 6,488.494 L409.529,488.494 A0,0 0 0 0 409.529,488.494 L409.529,436.621 L399.529,426.621 L212,426.621 L208,383.681 L204,426.621 L6,426.621 A0,0 0 0 0 6,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.621 L399.529,436.621 L409.529,436.621 L399.529,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.649" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.94" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="480.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M318.87,106.371 C297.5,114.391 276.3,125.171 259,139.621 C241.2,154.491 230.491,172.66 222.221,191.82" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="220.24,196.411,227.479,189.733,222.221,191.82,220.134,186.563,220.24,196.411" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="337.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O30</text><text x="260" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M454.17,118.901 C459.84,125.711 465.66,132.841 471,139.621 C489.56,163.181 509.89,190.951 523.43,209.771" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="74.614" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="79.614" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="79.614" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="79.614" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="S