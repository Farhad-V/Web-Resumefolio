<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:697px;height:594px;background:#FFFFFF;" width="697px" height="594px" viewBox="0 0 697 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="154.054" y="25.107" fill="#000" font-size="14" textLength="382.443" font-weight="700" font-family="Segoe UI">DC-O26 — Merge only current eligible evaluated revisions</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="284" y="46.621" width="240.378" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="294" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="294" y="87.94" fill="#000" font-size="13" textLength="220.378" font-family="Segoe UI">Current evaluated revisions, applicable</text><text x="294" y="105.231" fill="#000" font-size="13" textLength="200.135" font-family="Segoe UI">authority/reviews/checks identified</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="98.5" y="196.621" width="218.872" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="108.5" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="108.5" y="237.94" fill="#000" font-size="13" textLength="198.872" font-family="Segoe UI">Intended real integration/ref effect</text><text x="108.5" y="255.231" fill="#000" font-size="13" textLength="105.511" font-family="Segoe UI">actually confirmed</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="85" y="311.621" width="246.148" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="95" y="335.649" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="95" y="352.94" fill="#000" font-size="13" textLength="226.148" font-family="Segoe UI">No unrelated refs or target deployment</text><text x="95" y="370.231" fill="#000" font-size="13" textLength="106.463" font-family="Segoe UI">authority inherited</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M355.5,210.121 L355.5,254.703 L682.552,254.703 L682.552,220.121 L672.552,210.121 L355.5,210.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M672.552,210.121 L672.552,220.121 L682.552,220.121 L672.552,210.121" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="361.5" y="229.149" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="361.5" y="246.44" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,426.621 L6,488.494 A0,0 0 0 0 6,488.494 L409.529,488.494 A0,0 0 0 0 409.529,488.494 L409.529,436.621 L399.529,426.621 L212,426.621 L208,383.681 L204,426.621 L6,426.621 A0,0 0 0 0 6,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.621 L399.529,436.621 L409.529,436.621 L399.529,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.649" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.94" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="480.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M284,115.521 C271.28,122.131 259.27,130.071 249,139.621 C232.74,154.741 224.057,172.743 217.887,191.843" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="216.35,196.601,222.923,189.266,217.887,191.843,215.31,186.807,216.35,196.601" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="327.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O26</text><text x="250" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M442.39,118.901 C448.88,125.531 455.34,132.601 461,139.621 C479.13,162.111 496.3,190.581 507.19,209.851" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="64.614" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="69.614" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="69.614" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="69.614" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="Segoe UI">