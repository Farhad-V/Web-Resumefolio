41" font-family="Segoe UI">not established</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="24"><path d="M403,162.031 L403,223.904 A0,0 0 0 0 403,223.904 L780.935,223.904 A0,0 0 0 0 780.935,223.904 L780.935,172.031 L770.935,162.031 L596,162.031 L592,123.591 L588,162.031 L403,162.031 A0,0 0 0 0 403,162.031" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M770.935,162.031 L770.935,172.031 L780.935,172.031 L770.935,162.031" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="409" y="181.059" fill="#000" font-size="13" textLength="164.626" font-family="Segoe UI">OAuth has not been created.</text><text x="409" y="198.35" fill="#000" font-size="13" textLength="297.515" font-family="Segoe UI">Read, draft, send and reply are separate capabilities.</text><text x="409" y="215.641" fill="#000" font-size="13" textLength="356.935" font-family="Segoe UI">Unknown send: reconcile same attempt before eligible resend.</text></g><!--link User to Product--><!--link User to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M198.07,103.031 C205.82,103.431 213.54,103.781 221,104.031 C308.65,107.011 403.024,104.742 476.704,101.782" style="stroke:#526B7B;stroke-width:1;" fill="none" id="User-to-Product-1"/><polygon points="481.7,101.581,472.547,97.946,476.704,101.782,472.868,105.939,481.7,101.581" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.363" y="83.059" fill="#000" font-size="13" textLength="130.355" font-family="Segoe UI">Selected account/goal;</text><text x="232.5" y="100.35" fill="#000" font-size="13" textLength="136.081" font-family="Segoe UI">explicit final send intent</text></g><!--link Product to User--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M481.9,122.311 C455.97