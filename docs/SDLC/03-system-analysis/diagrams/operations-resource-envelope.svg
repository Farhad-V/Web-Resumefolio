<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1048px;height:482px;background:#FFFFFF;" width="1048px" height="482px" viewBox="0 0 1048 482" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="364.787" y="25.107" fill="#000" font-size="14" textLength="312.143" font-weight="700" font-family="Segoe UI">SQ — mixed workload and observed host limits</text></g><!--entity Host--><g class="entity" data-qualified-name="Host" id="ent0001" data-source-line="14"><rect x="83.5" y="46.621" width="255.447" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.5" y="70.649" fill="#000" font-size="13" textLength="151.023" font-family="Segoe UI">Observed demo allocation</text><text x="93.5" y="87.94" fill="#000" font-size="13" textLength="184.057" font-family="Segoe UI">2 vCPU / 4 GB RAM / 40 GB disk</text><text x="93.5" y="105.231" fill="#000" font-size="13" textLength="235.447" font-family="Segoe UI">Historical observation, not capacity proof</text></g><!--entity Mix--><g class="entity" data-qualified-name="Mix" id="ent0002" data-source-line="15"><rect x="62" y="240.621" width="298.256" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="72" y="264.649" fill="#000" font-size="13" textLength="161.357" font-family="Segoe UI">Competing logical workload</text><text x="72" y="281.94" fill="#000" font-size="13" textLength="269.471" font-family="Segoe UI">Private/employer paths + files/media + real Git</text><text x="72" y="299.231" fill="#000" font-size="13" textLength="278.256" font-family="Segoe UI">Conditional processing / maintenance / recovery</text></g><!--entity Evidence--><g class="entity" data-qualified-name="Evidence" id="ent0003" data-source-line="16"><rect x="685" y="152.121" width="349.716" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="695" y="176.149" fill="#000" font-size="13" textLength="329.716" font-family="Segoe UI">Defined current workload + limits + actual later measures</text><text x="695" y="193.44" fill="#000" font-size="13" textLength="326.549" font-family="Segoe UI">Admission / degradation / errors / retained/temp growth</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M15,157.121 L15,201.703 A0,0 0 0 0 15,201.703 L407.014,201.703 A0,0 0 0 0 407.014,201.703 L407.014,167.121 L397.014,157.121 L215,157.121 L211,118.881 L207,157.121 L15,157.121 A0,0 0 0 0 15,157.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M397.014,157.121 L397.014,167.121 L407.014,167.121 L397.014,157.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="21" y="176.149" fill="#000" font-size="13" textLength="349.153" font-family="Segoe UI">Nginx / MySQL / PHP-FPM and Laravel demo were observed.</text><text x="21" y="193.44" fill="#000" font-size="13" textLength="371.014" font-family="Segoe UI">Idle free memory/disk does not prove combined usable capacity.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="24"><path d="M6,351.121 L6,395.703 A0,0 0 0 0 6,395.703 L416.321,395.703 A0,0 0 0 0 416.321,395.703 L416.321,361.121 L406.321,351.121 L215,351.121 L211,312.881 L207,351.121 L6,351.121 A0,0 0 0 0 6,351.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M406.321,351.121 L406.321,361.121 L416.321,361.121 L406.321,351.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="370.149" fill="#000" font-size="13" textLength="389.321" font-family="Segoe UI">Conditional jobs still need independent enabling/isolation evidence.</text><text x="12" y="387.44" fill="#000" font-size="13" textLength="333.322" font-family="Segoe UI">This model does not choose co-hosting or new purchases.</text></g><!--link Host to Evidence--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk4" data-source-line="17" data-link-type="dependency"><path d="M338.67,101.611 C437.45,116.421 570.775,136.41 679.955,152.78" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Host-to-Evidence"/><polygon points="684.9,153.521,676.593,148.231,679.955,152.78,675.406,156.142,684.9,153.521" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="438" y="113.649" fill="#000" font-size="13" textLength="225.767" font-family="Segoe UI">actual evaluated configuration required</text></g><!--link Mix to Evidence--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M360.03,254.431 C456.73,239.931 578.495,221.672 680.015,206.452" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Mix-to-Evidence"/><polygon points="684.96,205.711,675.466,203.09,680.015,206.452,676.653,211.001,684.96,205.711" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="477" y="207.649" fill="#000" font-size="13" textLength="147.532" font-family="Segoe UI">users are not concurrency</text></g><g class="legend" data-source-line="28"><rect x="253.956" y="416.703" width="533.804" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="258.956" y="436.811" fill="#000" font-size="14" textLength="523.804" font-family="Segoe UI">Logical analysis / evidence boundaries, not installed controls or selected architecture.</text><text x="258.956" y="455.432" fill="#000" font-size="14" textLength="492.762" font-family="Segoe UI">No security, load, provider, backup, restore or live-change operation performed.</text></g><?plantuml-src TLJBTjD03DtxAtHWIT907nHOS4xJ4ievRGaKTjbCFB8jCXuPpJXfMF4HV25VWiPEYYcmyZmqzrxfIWuhyeqHKyFIv