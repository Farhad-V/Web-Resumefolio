<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:703px;height:594px;background:#FFFFFF;" width="703px" height="594px" viewBox="0 0 703 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="141.004" y="25.107" fill="#000" font-size="14" textLength="414.545" font-weight="700" font-family="Segoe UI">DC-O03 — Publish separately confirmed intended presentation</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="240.5" y="46.621" width="253.022" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="250.5" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="250.5" y="87.94" fill="#000" font-size="13" textLength="233.022" font-family="Segoe UI">Saved intended draft; live may be absent</text><text x="250.5" y="105.231" fill="#000" font-size="13" textLength="64.518" font-family="Segoe UI">or different</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="93" y="196.621" width="229.631" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="103" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="103" y="237.94" fill="#000" font-size="13" textLength="209.631" font-family="Segoe UI">Separately confirmed presentation is</text><text x="103" y="255.231" fill="#000" font-size="13" textLength="48.318" font-family="Segoe UI">effective</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="92" y="311.621" width="232.05" height="71.873" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="102" y="335.649" fill="#000" font-size="13" textLength="183.765" font-family="Segoe UI">FRAME / PROTECTED MEANING</text><text x="102" y="352.94" fill="#000" font-size="13" textLength="196.32" font-family="Segoe UI">Actual submitted materials remain</text><text x="102" y="370.231" fill="#000" font-size="13" textLength="212.05" font-family="Segoe UI">independent; PDF readiness separate</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M361.5,210.121 L361.5,254.703 L688.552,254.703 L688.552,220.121 L678.552,210.121 L361.5,210.121" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M678.552,210.121 L678.552,220.121 L688.552,220.121 L678.552,210.121" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="367.5" y="229.149" fill="#000" font-size="13" textLength="298.168" font-family="Segoe UI">Current exact authority and full preconditions apply.</text><text x="367.5" y="246.44" fill="#000" font-size="13" textLength="306.052" font-family="Segoe UI">This is a logical contract relation, not execution order.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="25"><path d="M6,426.621 L6,488.494 A0,0 0 0 0 6,488.494 L409.529,488.494 A0,0 0 0 0 409.529,488.494 L409.529,436.621 L399.529,426.621 L212,426.621 L208,383.681 L204,426.621 L6,426.621 A0,0 0 0 0 6,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M399.529,426.621 L399.529,436.621 L409.529,436.621 L399.529,426.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="12" y="445.649" fill="#000" font-size="13" textLength="334.09" font-family="Segoe UI">If effect is partial, pending or unknown, do not claim After.</text><text x="12" y="462.94" fill="#000" font-size="13" textLength="312.559" font-family="Segoe UI">Use same-operation evidence/reconciliation (DC-O38).</text><text x="12" y="480.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M279.77,118.711 C270.07,124.791 260.87,131.741 253,139.621 C237.3,155.351 228.004,172.988 220.764,191.698" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="218.96,196.361,225.938,189.411,220.764,191.698,218.477,186.524,218.96,196.361" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="331.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O03</text><text x="254" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M437.86,118.641 C447.51,124.931 456.87,131.961 465,139.621 C486.64,160.031 504.19,189.731 514.59,209.811" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="67.614" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="72.614" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="72.614" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="72.614" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="Segoe UI">No transaction, implementation component, rollback or deployment authority is selected.</text></g><?plantuml-src TPJTRjf048Nl_HIZvAQLWFpGD4aZLUB7Zf0IY22vg4el5diC8zQxrkuQIg_w47t2FabdlOIuQNg7lJjdvdnpZ5sJAeKH1In4kbuQNQbieAKsi5sHmyWUpZFCHILTefKRYm9XXakDy3Hw-ygCVY2STHk7TYKolIMrX5n8srJk6QEteUdnnVd7_cM_SMWmTK8j9VPVpNSS3vCFoTjNjSdG_4zHQVUlM98atM7o-bPJftzzVN5n-TUD32sMqBrgpY3Ksh_yS1uvNOBJiD3EQMP3VZpIAeeSEOam7BGdfrtu_VCNF5GBINO5NCWY3kKEKgroCWLcGCgXolX7QRYTSg8MENY5etwSJAOnd41yDxeTzKTteySlSpKJcsPnPaJkRa3I1g4GErWWY8MNcoisbr6Ue-6d8n0M-fXhWyqMWyau6Ktluo7CdWQ3U3Q3oVZEDtbhuEQSG7QkaCNP-WPhzLxkq3J5asdlte__C9qyneD7Rd8VzyQZyUrSzL9N2GcsMXJa76iNtCmGvuUNNGXISqLih_GU5Tjx62Py839IQEq1PzqsCJwqnyCaEOjxKR08xVRdC0zyskzZhaeq-sPXRX3r44sBKQXfVrrHnes_SQuLAzKj8X-SvwNh_1dce3AUB-1tuIKhjzA6t0w4oY2lfFJKM3yZJys2A4kvwqIFAxAC40H8lQIKKV0TPxo4GLaJRlcaiYocLGsyZcmdOY9rX5-F4sOSvS_cM9mXEKRQ0e_HVvySY4gj5PjgGQPh_LGAAWAgJlHa4IpBj3Mp2cl63J6854zg5ob92k_VUQhTg_UTAF3dGylp4rjqtjj18TXeBDDVJVVGjjgi6vOaBltlO2fAF3t-_2fdMvxYIQcjUq7PWjntRZ6Y5CizNQukjQHq1vPpMl4R3WCfTfjMXUzuTjg9Ugalg0EjSv9-UBuLSiSL-zCRq6x5OSZG2P9XMLp0Gt2bK4BkBFcqvfn9Bzs9nXeOWR8Y3SQfA6Lz592bkYYruiSM62sb_rls6s4mKk_guLxIGpxaalU8MSqdaFa3?></g></svg>