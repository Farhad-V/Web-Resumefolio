<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:761px;height:581px;background:#FFFFFF;" width="761px" height="581px" viewBox="0 0 761 581" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="234.794" y="25.107" fill="#000" font-size="14" textLength="284.751" font-weight="700" font-family="Segoe UI">HD — delivery reconciliation before coding</text></g><!--entity Inputs--><g class="entity" data-qualified-name="Inputs" id="ent0001" data-source-line="14"><rect x="192" y="46.621" width="354.414" height="37.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="202" y="70.649" fill="#000" font-size="13" textLength="334.414" font-family="Segoe UI">Current requirements + analysis/design + remaining gates</text></g><!--entity Work--><g class="entity" data-qualified-name="Work" id="ent0002" data-source-line="15"><rect x="178" y="125.621" width="382.318" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="188" y="149.649" fill="#000" font-size="13" textLength="362.318" font-family="Segoe UI">Reviewable work outcomes + dependencies + full effort ranges</text><text x="188" y="166.94" fill="#000" font-size="13" textLength="332.668" font-family="Segoe UI">Include learning/docs/testing/recovery/operations/rework</text></g><!--entity Forecast--><g class="entity" data-qualified-name="Forecast" id="ent0003" data-source-line="16"><rect x="212.5" y="222.621" width="313.167" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="222.5" y="246.649" fill="#000" font-size="13" textLength="229.493" font-family="Segoe UI">Compare to 20 total project hours/week</text><text x="222.5" y="263.94" fill="#000" font-size="13" textLength="293.167" font-family="Segoe UI">Actual availability/progress and dependency delays</text><text x="222.5" y="281.231" fill="#000" font-size="13" textLength="195.292" font-family="Segoe UI">Requested date remains a request</text></g><!--entity Tracking--><g class="entity" data-qualified-name="Tracking" id="ent0004" data-source-line="17"><rect x="56" y="340.121" width="262.322" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66" y="364.149" fill="#000" font-size="13" textLength="234.762" font-family="Segoe UI">Inspect/reconcile actual live issues/board</text><text x="66" y="381.44" fill="#000" font-size="13" textLength="242.322" font-family="Segoe UI">Select first ready Sprint Goal / items / plan</text></g><!--entity Baseline--><g class="entity" data-qualified-name="Baseline" id="ent0005" data-source-line="18"><rect x="7" y="440.621" width="359.866" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="464.649" fill="#000" font-size="13" textLength="301.831" font-family="Segoe UI">Complete agreed initial SDLC documentation/design</text><text x="17" y="481.94" fill="#000" font-size="13" textLength="339.866" font-family="Segoe UI">Actual pre-implementation baseline decision before coding</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="24"><path d="M356,336.621 L356,398.494 A0,0 0 0 0 356,398.494 L746.338,398.494 A0,0 0 0 0 746.338,398.494 L746.338,346.621 L736.338,336.621 L503.83,336.621 L428.59,294.661 L495.83,336.621 L356,336.621 A0,0 0 0 0 356,336.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M736.338,336.621 L736.338,346.621 L746.338,346.621 L736.338,336.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="362" y="355.649" fill="#000" font-size="13" textLength="365.638" font-family="Segoe UI">No hours, throughput or accepted delivery date estimated here.</text><text x="362" y="372.94" fill="#000" font-size="13" textLength="339.339" font-family="Segoe UI">Do not fix all future Sprints or silently reduce agreed scope.</text><text x="362" y="390.231" fill="#000" font-size="13" textLength="369.338" font-family="Segoe UI">A coherent commit records change; it is not acceptance by itself.</text></g><!--link Inputs to Work--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M369,83.941 C369,95.941 369,106.991 369,120.501" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Inputs-to-Work"/><polygon points="369,125.501,373,116.501,369,120.501,365,116.501,369,125.501" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Work to Forecast--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="20" data-link-type="dependency"><path d="M369,180.771 C369,193.471 369,203.831 369,217.471" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Work-to-Forecast"/><polygon points="369,222.471,373,213.471,369,217.471,365,213.471,369,222.471" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Forecast to Tracking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M309.41,294.661 C284.32,309.411 259.911,323.758 236.601,337.458" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Forecast-to-Tracking"/><polygon points="232.29,339.991,242.076,338.879,236.601,337.458,238.022,331.982,232.29,339.991" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Tracking to Baseline--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="22" data-link-type="dependency"><path d="M187,395.281 C187,409.291 187,421.421 187,435.441" style="stroke:#526B7B;stroke-widt