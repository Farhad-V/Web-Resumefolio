<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:700px;height:594px;background:#FFFFFF;" width="700px" height="594px" viewBox="0 0 700 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="168.498" y="25.107" fill="#000" font-size="14" textLength="356.556" font-weight="700" font-family="Segoe UI">DC-O02 — Apply selected source changes to one draft</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="276" y="46.621" width="177.892" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="286" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="286" y="87.94" fill="#000" font-size="13" textLength="157.892" font-family="Segoe UI">Source differs; independent</text><text x="286" y="105.231" fill="#000" font-size="13" textLength="153.315" font-family="Segoe UI">draft/live/history identified</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="96" y="196.621" width="224.306" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="106" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="106" y="237.94" fill="#000" font-size="13" textLength="204.306" font-family="Segoe UI">Selected draft saved; live and actual</text><text x="106" y="255.231" fill="#000" font-size="13" textLength="98.89" font-family="Segoe UI">history preserved</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="93.5" y="311.621" width="228.889" height