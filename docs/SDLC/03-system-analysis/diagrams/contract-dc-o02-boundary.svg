00" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M315.05,118.701 C306.45,125.361 297.79,132.481 290,139.621 C270.92,157.121 254.795,174.819 239.675,192.639" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="236.44,196.451,245.313,192.176,239.675,192.639,239.213,187.001,236.44,196.451" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="368.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O02</text><text x="291" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M454.05,107.691 C470.5,115.591 486.19,125.981 498,139.621 C514.97,159.211 520.15,189.371 521.62,209.771" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="66.114" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="71.114" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="71.114" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="71.114" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="Segoe UI">No transaction, implementation 