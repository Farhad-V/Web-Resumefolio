<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:698px;height:594px;background:#FFFFFF;" width="698px" height="594px" viewBox="0 0 698 594" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="204.751" y="25.107" fill="#000" font-size="14" textLength="282.051" font-weight="700" font-family="Segoe UI">DC-O05 — Disable a specific protected link</text></g><!--entity Before--><g class="entity" data-qualified-name="Before" id="ent0001" data-source-line="15"><rect x="298" y="46.621" width="216.346" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="308" y="70.649" fill="#000" font-size="13" textLength="119.736" font-family="Segoe UI">BEFORE / ELIGIBILITY</text><text x="308" y="87.94" fill="#000" font-size="13" textLength="196.346" font-family="Segoe UI">Intended link identified; download</text><text x="308" y="105.231" fill="#000" font-size="13" textLength="153.404" font-family="Segoe UI">configuration independent</text></g><!--entity After--><g class="entity" data-qualified-name="After" id="ent0002" data-source-line="16"><rect x="97.5" y="196.621" width="220.941" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="107.5" y="220.649" fill="#000" font-size="13" textLength="164.798" font-family="Segoe UI">CONFIRMED SUCCESS ONLY</text><text x="107.5" y="237.94" fill="#000" font-size="13" textLength="200.941" font-family="Segoe UI">Exact link effectively disabled; fresh</text><text x="107.5" y="255.231" fill="#000" font-size="13" textLength="79.428" font-family="Segoe UI">access denied</text></g><!--entity Frame--><g class="entity" data-qualified-name="Frame" id="ent0003" data-source-line="17"><rect x="76.5" y="311.621" width="263.153" height