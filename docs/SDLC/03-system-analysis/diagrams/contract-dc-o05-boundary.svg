.231" fill="#000" font-size="13" textLength="382.529" font-family="Segoe UI">Frame constrains this operation, not independent concurrent work.</text></g><!--link Before to After--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M297.65,109.661 C280.34,117.271 263.66,127.061 250,139.621 C233.59,154.711 224.703,172.728 218.323,191.838" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Before-to-After"/><polygon points="216.74,196.581,223.384,189.311,218.323,191.838,215.796,186.778,216.74,196.581" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="328.584" y="154.649" fill="#000" font-size="13" textLength="46.179" font-family="Segoe UI">DC-O05</text><text x="251" y="171.94" fill="#000" font-size="13" textLength="201.348" font-family="Segoe UI">permitted effect actually confirmed</text></g><!--link After to Frame--><!--link Before to GMN6--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk8" data-source-line="21" data-link-type="association"><path d="M443.39,118.661 C449.87,125.371 456.34,132.531 462,139.621 C480.03,162.191 497.22,190.651 508.14,209.891" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Before-GMN6"/></g><g class="legend" data-source-line="29"><rect x="65.114" y="509.494" width="561.325" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="70.114" y="529.602" fill="#000" font-size="14" textLength="537.92" font-family="Segoe UI">Full inputs, pre/postconditions, frame, exceptions and policy status are in document 10.</text><text x="70.114" y="548.223" fill="#000" font-size="14" textLength="535.09" font-family="Segoe UI">Accepted profile core remains accepted; other detail is a proposed analysis refinement.</text><text x="70.114" y="566.844" fill="#000" font-size="14" textLength="551.325" font-family="Segoe UI">No transaction, 