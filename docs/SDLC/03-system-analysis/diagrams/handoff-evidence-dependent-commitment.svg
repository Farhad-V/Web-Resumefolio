th:0.5;" rx="2.5" ry="2.5"/><text x="250" y="283.649" fill="#000" font-size="13" textLength="294.423" font-family="Segoe UI">Affected design question + actual evidence needed</text><text x="250" y="300.94" fill="#000" font-size="13" textLength="306.363" font-family="Segoe UI">No source association or tool demo implies feasibility</text></g><!--entity Commit--><g class="entity" data-qualified-name="Commit" id="ent0004" data-source-line="17"><rect x="7" y="379.121" width="359.695" height="54.582" fill="#DFF1EA" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="403.149" fill="#000" font-size="13" textLength="185.542" font-family="Segoe UI">Scoped dependent commitment</text><text x="17" y="420.44" fill="#000" font-size="13" textLength="339.695" font-family="Segoe UI">Actual identified candidate / conditions / owner disposition</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="22"><path d="M405,375.621 L405,437.494 L833.183,437.494 L833.183,385.621 L823.183,375.621 L405,375.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M823.183,375.621 L823.183,385.621 L833.183,385.621 L823.183,375.621" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="411" y="394.649" fill="#000" font-size="13" textLength="407.183" font-family="Segoe UI">Independent modeling and unselected design proposals may continue.</text><text x="411" y="411.94" fill="#000" font-size="13" textLength="340.12" font-family="Segoe UI">Missing decisive evidence limits the dependent acceptance.</text><text x="411" y="429.231" fill="#000" font-size="13" textLength="258.972" font-family="Segoe UI">No overall feasibility finding is manufactured.</text></g><!--link Sources to Known--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M403,101.761 C403,114.701 403,125.431 403,139.351" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Sources