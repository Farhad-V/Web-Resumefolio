<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:666px;height:542px;background:#FFFFFF;" width="666px" height="542px" viewBox="0 0 666 542" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="177.983" y="25.107" fill="#000" font-size="14" textLength="303.078" font-weight="700" font-family="Segoe UI">CP — bounded current-process evidence need</text></g><!--entity Areas--><g class="entity" data-qualified-name="Areas" id="ent0001" data-source-line="14"><rect x="114.219" y="46.621" width="374.885" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="124.219" y="70.649" fill="#000" font-size="13" textLength="199.996" font-family="Segoe UI">Eight source-defined process areas</text><text x="124.219" y="87.94" fill="#000" font-size="13" textLength="354.885" font-family="Segoe UI">Preparation / presentation / actual applications / coordination</text><text x="124.219" y="105.231" fill="#000" font-size="13" textLength="318.011" font-family="Segoe UI">Work / Git-execution / files-admin / operating-recovery</text></g><!--entity Case--><g class="entity" data-qualified-name="Case" id="ent0002" data-source-line="15"><rect x="112.719" y="179.621" width="378.059" height="71.873" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="122.719" y="203.649" fill="#000" font-size="13" textLength="200.814" font-family="Segoe UI">For a relevant actual case, establish</text><text x="122.719" y="220.94" fill="#000" font-size="13" textLength="342.278" font-family="Segoe UI">Actor + trigger + actual inputs/steps/tools/handoffs/output</text><text x="122.719" y="238.231" fill="#000" font-size="13" textLength="358.059" font-family="Segoe UI">Authority/provenance + exceptions + observed time if needed</text></g><!--entity Limit--><g class="entity" data-qualified-name="Limit" id="ent0003" data-source-line="16"><rect x="83.219" y="312.621" width="437.231" height="54.582" fill="#FFF3DF" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.219" y="336.649" fill="#000" font-size="13" textLength="194.74" font-family="Segoe UI">Keep unresolved elements explicit</text><text x="93.219" y="353.94" fill="#000" font-size="13" textLength="417.231" font-family="Segoe UI">No target use case or reference-project name substitutes for observation</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M61.219,410.621 L61.219,455.203 A0,0 0 0 0 61.219,455.203 L542.202,455.203 A0,0 0 0 0 542.202,455.203 L542.202,420.621 L532.202,410.621 L305.719,410.621 L301.719,367.931 L297.719,410.621 L61.219,410.621 A0,0 0 0 0 61.219,410.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M532.202,410.621 L532.202,420.621 L542.202,420.621 L532.202,410.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="67.219" y="429.649" fill="#000" font-size="13" textLength="432.948" font-family="Segoe UI">This is an evidence plan, not a performed session or invented as-is diagram.</text><text x="67.219" y="446.94" fill="#000" font-size="13" textLength="459.983" font-family="Segoe UI">No broad study is added as a blanket new gate for independent analysis/design.</text></g><!--link Areas to Case--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="17" data-link-type="dependency"><path d="M301.719,118.731 C301.719,137.521 301.719,155.611 301.719,174.421" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Areas-to-Case"/><polygon points="301.719,179.421,305.719,170.421,301.719,174.421,297.719,170.421,301.719,179.421" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.719" y="154.649" fill="#000" font-size="13" textLength="292.106" font-family="Segoe UI">only if a dependent conclusion needs this evidence</text></g><!--link Case to Limit--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M301.719,251.721 C301.719,271.101 301.719,289.761 301.719,307.581" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Case-to-Limit"/><polygon points="301.719,312.581,305.719,303.581,301.719,307.581,297.719,303.581,301.719,312.581" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.719" y="287.649" fill="#000" font-size="13" textLength="216.119" font-family="Segoe UI">record source / date / method / limits</text></g><g class="legend" data-source-line="24"><rect x="12" y="476.203" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="496.311" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="514.932" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLFRZjis47tNLmoInrt5Q3QRD0aG8Bk9Wo11461Rz6LVA74aiQP8XJEorttgH_GB-oKzfDPUDqq10nR9kPnpveniN9XCCYCrfjtqASx1NaSV4-q6frp9yTroPsQlwnZqYncPRhYFJBz-_778ZVk3wQUBaqSPZ8qx5thgZ9VJoczJYhkbwUFBfy-lNboTF2PkrOJUyzLt-1w_VxT-jlvnQ4oMq_zL357_MsozNb-yMtyVTLhdwkNBoyiN_ugmB3pHnS-d64pOvCjdJojrwfcklzBVV_v5JUx5bjev9GvQJocsB4AyTPP3onIORQLn8eq8LesGqsL6BeRgo8mUlNVze2HnJYtN4Dm5L3rKCucDt8QlYJEQd4ehF09cqCFHj3eRJsQQl6lBfU2sZU3gGZdVXjzYsk3oWzEQxxYTxrCxvrbgOqUNJt7Yt2FqDU35BQVz8pA2QGB3AU8rr3COZkUj2NhetnhXSs9HqtWdmsrusoe2pqYJwtlEN_UHa7PMMOdo92kDqSjgCC76hfDLd1MFI9vrYCdfVWKfjXnCblIC-AxbQQ5uHh4HJbkefGxsTLsHd6q1VGqqfvW_CMOu1oWNVKu1-14QObvtMJQ7bbyYgKazAyt2XGu1V-AEKnvedl3lA4WXBulCZS0Fix