amily="Segoe UI">preserve independent text and other resumes</text><polygon points="182.813,476.822,347.582,476.822,359.582,500.113,347.582,523.404,182.813,523.404,170.813,500.113,182.813,476.822" fill="#DFF1EF" style="stroke:#458F88;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="188.813" y="496.851" fill="#000" font-size="13" textLength="152.769" font-family="Segoe UI">Owner separately confirms</text><text x="188.813" y="514.142" fill="#000" font-size="13" textLength="69.913" font-family="Segoe UI">publication?</text><text x="149.07" y="491.353" fill="#000" font-size="11" textLength="15.743" font-family="Segoe UI">yes</text><text x="365.582" y="491.353" fill="#000" font-size="11" textLength="12.67" font-family="Segoe UI">no</text><rect x="16" y="533.404" width="230.593" height="49.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="32" y="563.433" fill="#000" font-size="13" textLength="198.593" font-family="Segoe UI">Publish intended reviewed content</text><rect x="266.593" y="533.404" width="265.01" height="49.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="282.593" y="563.433" fill="#000" font-size="13" textLength="233.01" font-family="Segoe UI">Keep existing published view unchanged</text><polygon points="265.197,592.695,277.197,604.695,265.197,616.695,253.197,604.695,265.197,592.695" fill="#DFF1EF" style="stroke:#458F88;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="561.603" y="390.24" width="262.864" height="49.291" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="4" ry="4"/><text x="577.603" y="420.269" fill="#000" font-size="13" textLength="230.864" font-family="Segoe UI">Keep that draft and live view unchanged</text><polygon points="479.116,626.695,491.116,638.695,479.116,650.695,467.116,638.695,479.116,626.695" fill="#DFF1EF" style="stroke:#458F88;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="854.467" 