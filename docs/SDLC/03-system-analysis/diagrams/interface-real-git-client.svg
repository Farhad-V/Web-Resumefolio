<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:888px;height:338px;background:#FFFFFF;" width="888px" height="338px" viewBox="0 0 888 338" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="332.972" y="25.107" fill="#000" font-size="14" textLength="215.852" font-weight="700" font-family="Segoe UI">IF-06 — Real Git-client boundary</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" id="ent0001" data-source-line="15"><rect x="7" y="77.411" width="168.269" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="101.439" fill="#000" font-size="13" textLength="148.269" font-family="Segoe UI">Supported real Git client /</text><text x="17" y="118.73" fill="#000" font-size="13" textLength="133.396" font-family="Segoe UI">intended repository-ref</text></g><!--entity Product--><g class="entity" data-qualified-name="Product" id="ent0002" data-source-line="16"><rect x="579" y="77.411" width="177.32" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="589" y="101.439" fill="#000" font-size="13" textLength="157.32" font-family="Segoe UI">Resumefolio real repository</text><text x="589" y="118.73" fill="#000" font-size="13" textLength="95.069" font-family="Segoe UI">access boundary</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="21"><path d="M461,170.911 L461,232.784 A0,0 0 0 0 461,232.784 L873.796,232.784 A0,0 0 0 0 873.796,232.784 L873.796,180.911 L863.796,170.911 L671.5,170.911 L667.5,132.471 L663.5,170.911 L461,170.911 A0,0 0 0 0 461,170.911" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M863.796,170.911 L863.796,180.911 L873.796,180.911 L863.796,170.911" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="467" y="189.939" fill="#000" font-size="13" textLength="370.246" font-family="Segoe UI">Transport / credentials / client versions / Git engine not selected.</text><text x="467" y="207.23" fill="#000" font-size="13" textLength="391.796" font-family="Segoe UI">Admin root SSH and development GitHub are not product Git proof.</text><text x="467" y="224.521" fill="#000" font-size="13" textLength="386.452" font-family="Segoe UI">Browser PR/review/merge is IF-01; push grants no deploy authority.</text></g><!--link Client to Product--><!--link Client to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M175,111.771 C182.77,112.241 190.53,112.631 198,112.911 C330.71,117.911 479.685,113.494 573.835,109.484" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Client-to-Product-1"/><polygon points="578.83,109.271,569.668,105.658,573.835,109.484,570.008,113.65,578.83,109.271" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="229" y="91.939" fill="#000" font-size="13" textLength="178.807" font-family="Segoe UI">Authorized clone/fetch/pull OR</text><text x="275.725" y="109.23" fill="#000" font-size="13" textLength="85.357" font-family="Segoe UI">push/ref intent</text></g><!--link Product to Client--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M579,113.131 C540.8,119.611 496.69,131.191 461,151.911 C447.94,159.491 451.83,170.841 438,176.911 C340.32,219.771 299.96,208.261 198,176.911 C169.51,168.151 145.66,152.009 125.72,135.589" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Product-to-Client"/><polygon points="121.86,132.411,126.265,141.22,125.72,135.589,131.35,135.044,121.86,132.411" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="239.454" y="138.939" fill="#000" font-size="13" textLength="157.352" font-family="Segoe UI">Real content/history/ref OR</text><text x="199" y="156.23" fill="#000" font-size="13" textLength="238.259" font-family="Segoe UI">rejected/conflicting/incomplete/unknown</text><text x="302.257" y="173.521" fill="#000" font-size="13" textLength="31.745" font-family="Segoe UI">result</text></g><g class="legend" data-source-line="25"><rect x="109.106" y="253.784" width="663.584" height="65.863" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="114.106" y="273.892" fill="#000" font-size="14" textLength="569.659" font-family="Segoe UI">Logical boundary/exchange meaning; not software components or chosen protocol/schema.</text><text x="114.106" y="292.513" fill="#000" font-size="14" textLength="577.548" font-family="Segoe UI">Full direction, identity, authority, failure, compatibility and evidence limits are in document 12.</text><text x="114.106" y="311.134" fill="#000" font-size="14" textLength="653.584" font-family="Segoe UI">Proposed details remain proposed. No real provider, Git, execution, delivery or recovery action performed.</text></g><?plantuml-src TLDDKzim4BtxL-p0DOdBHw30J6S8r8MP3cMIzbHwKAIrhKRMUYIP44xz4Vs5_ILToI6aG6_oQlVflRVFVg5jAvneO2xaedBKMNL1XXmiQnqmyvjxXQNeJ2Z8XXlH8Com8eHlrs-tpFGZmjx1rgMlXQAbjXMKmlXjv7FdQDa_kZlUFveSJxOk7SeWR6LmyeBVxiVBuh1ukvMSGlS_H4lXDLXH50UNnSkkRPp9oSbuVFnFXqAFBHoyt-OWx28M3yUPmJ90872wgWCe7UbfibaMT308ryNmtH7y-VKRfYWCVD9XA8r66s0UUGctoZQ2O6VMjIsvW8fLzjsmxixlhBO1hKftBNaToAs63iiT41ukKjSsr1Hzrs19HbCFzZnrPuMKwFs6GeAuTQGw6R8U2eRVQwqKsXz9sF33g_ld4fp2UHTgSfm6nOJ9ObvYa7NUTiR0b-cTRJjVvqmMaeYGFKr6b3NWQU-GfDIHrzf7hcae8ZZyoU9GvTnG6iqcsohNLbBJ6WoOTtPXQMbZe-TqPd6pB304Qe3A3Vkll3eVFOOSf4CM63G7DNxrDExHUTvVh4JxqLRQOim9U3I9mIWxLussu8YBizaL2AlufxX7GsqJ8NZkgfk3SFrSkzOQuVXCvIYRyA_WqS7jbFNTQrpc3ReAGViKcBqpY8P1nMI3Pn26RmsjGFGsXzKeuoYaz780gtZkfMQVgTAIRNnQROuFikP883GeE4BLMQ-5oh2C1AD_lA_u3CTVrkJHHfQ199dSoneRCSgAkCTDjWUWaszXDNXcDE0VNflE