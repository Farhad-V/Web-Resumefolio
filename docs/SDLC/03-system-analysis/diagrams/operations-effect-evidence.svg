<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:819px;height:427px;background:#FFFFFF;" width="819px" height="427px" viewBox="0 0 819 427" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="269.345" y="25.107" fill="#000" font-size="14" textLength="273.841" font-weight="700" font-family="Segoe UI">SQ — operation effect versus observation</text></g><!--entity Intent--><g class="entity" data-qualified-name="Intent" id="ent0001" data-source-line="14"><rect x="261" y="46.621" width="261.211" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="271" y="70.649" fill="#000" font-size="13" textLength="215.192" font-family="Segoe UI">Intended operation / attempt identity</text><text x="271" y="87.94" fill="#000" font-size="13" textLength="241.211" font-family="Segoe UI">Current exact subject / revision / authority</text></g><!--entity Evidence--><g class="entity" data-qualified-name="Evidence" id="ent0002" data-source-line="15"><rect x="243" y="162.621" width="297.202" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="253" y="186.649" fill="#000" font-size="13" textLength="125.969" font-family="Segoe UI">Actual effect evidence</text><text x="253" y="203.94" fill="#000" font-size="13" textLength="277.202" font-family="Segoe UI">Confirmed / failed / partial / pending / unknown</text></g><!--entity Next--><g class="entity" data-qualified-name="Next" id="ent0003" data-source-line="16"><rect x="7" y="282.121" width="350.561" height="54.582" fill="#EDF4FB" style="stroke:#526B7B;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="306.149" fill="#000" font-size="13" textLength="123.005" font-family="Segoe UI">Permitted next action</text><text x="17" y="323.44" fill="#000" font-size="13" textLength="330.561" font-family="Segoe UI">Observe / reconcile same context; separately eligible retry</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M396,278.621 L396,340.494 L804.531,340.494 L804.531,288.621 L794.531,278.621 L396,278.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M794.531,278.621 L794.531,288.621 L804.531,288.621 L794.531,278.621" style="stroke:#B99557;stroke-width:1;" fill="#FFF3DF"/><text x="402" y="297.649" fill="#000" font-size="13" textLength="369.707" font-family="Segoe UI">Failure or timeout does not universally prove old state / rollback.</text><text x="402" y="314.94" fill="#000" font-size="13" textLength="363.175" font-family="Segoe UI">Cancel request is not confirmed stop; completion may win race.</text><text x="402" y="332.231" fill="#000" font-size="13" textLength="387.531" font-family="Segoe UI">Evidence access itself needs a bounded grant and secret protection.</text></g><!--link Intent to Evidence--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="17" data-link-type="dependency"><path d="M391.5,101.851 C391.5,120.141 391.5,139.301 391.5,157.561" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Intent-to-Evidence"/><polygon points="391.5,162.561,395.5,153.561,391.5,157.561,387.5,153.561,391.5,162.561" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="392.5" y="137.649" fill="#000" font-size="13" textLength="230.801" font-family="Segoe UI">request or missing reply is not the effect</text></g><!--link Evidence to Next--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M344.34,217.641 C310.14,236.861 268.448,260.301 234.208,279.551" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Evidence-to-Next"/><polygon points="229.85,282.001,239.655,281.077,234.208,279.551,235.735,274.104,229.85,282.001" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="307.5" y="253.649" fill="#000" font-size="13" textLength="189.998" font-family="Segoe UI">no blind resend / restart / deploy</text></g><!--link Evidence to GMN6--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="20" data-link-type="association"><path d="M463.66,217.701 C478.16,223.931 493.07,231.001 506.5,238.621 C526.68,250.061 547.52,265.201 564.44,278.461" style="stroke:#526B7B;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Evidence-GMN6"/></g><g class="legend" data-source-line="25"><rect x="139.364" y="361.494" width="533.804" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="144.364" y="381.602" fill="#000" font-size="14" textLength="523.804" font-family="Segoe UI">Logical analysis / evidence boundaries, not installed controls or selected architecture.</text><text x="144.364" y="400.223" fill="#000" font-size="14" textLength="492.762" font-family="Segoe UI">No security, load, provider, backup, restore or live-change operation performed.</text></g><?plantuml-src TLHTJzmm47pFhrZ1wy6fV9HIf4eSS19IHLkXll7YIpOvznnlQc-0wrD_H7zXVqd7pd6abBxPyNfsPdQSkBA-Cy6qj33bgWdI--f2d0HwM5hb8cxFAwvDxtGkNczCotJBZJ1zlNwzvDR-O7fpE3gCIrF9W_KDrSR5CV9v2F8mDDqzFdWxEvcD3WENQdpZUFQ2t-xLvVne_dgfX8h3_n2zwBzWy_dyy7B-icgCCpizFJu--QkYuiWT7RuRSp1-bJuU7HHgrS6cB_Jxvo-IZeDHAvwuhi6JxZd4Ff8i8eVxV5AeTAH22r4Lc6cJdlHzgujshhsohxWQuKt9g7BRATcAFPgkx_n57mBMn8y6hMA_-9PQJk7GlOsRIxqk9Q1wXqoaZAlZJkUbziOziSKzW9SCQF6r3IqeJ358w_82sjMY6YlGIpEUKkzNNXvyXh_QN1yt-CoXjM1UaUT79PErtlbFsH3EP4ln9JfGJ7d3Hb5uHh0NLYkxDR6pZLsW8h26GSaDQef13ktjVTYsflSe-jvpLC8qMnjZeXcu0uoDQToaIzxeBRQt4aI2n7MFqJZhAroAK9aPHeLoh2hWoBf8eNcQdzJFikSmgW-SEgjjMNgbIdZesdkRic0SY7H185rSHG3MR88ubrxcVd5XWEIs8ZQSo-qu8k9pXdtRESx1QCsQyDuGoPBtdnMPikGOoMfaLyDxhY8PaEvphXe46CE0lCWbN4sKTCZXVf5K9ub5uRX9cq5gy