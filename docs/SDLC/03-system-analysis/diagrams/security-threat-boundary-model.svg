ependency"><path d="M593.18,240.491 C624.63,249.421 655.99,262.501 682,281.621 C702.56,296.741 715.281,316.848 724.921,337.568" style="stroke:#486777;stroke-width:1;" fill="none" id="product-to-run"/><polygon points="727.03,342.101,726.86,332.254,724.921,337.568,719.607,335.628,727.03,342.101" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="713" y="303.57" fill="#000" font-size="12" textLength="234.428" font-family="Segoe UI">SQ-T04: excessive host/secret/target powers</text></g><!--link run to ops--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-source-line="26" data-link-type="dependency"><path d="M661.65,418.301 C617.35,439.051 566.868,462.71 522.608,483.45" style="stroke:#486777;stroke-width:1;" fill="none" id="run-to-ops"/><polygon points="518.08,485.571,527.927,485.374,522.608,483.45,524.532,478.13,518.08,485.571" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="601" y="459.57" fill="#000" font-size="12" textLength="185.736" font-family="Segoe UI">SQ-T09: sensitive output disclosure</text></g><!--link data to ops--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk12" data-source-line="27" data-link-type="dependency"><path d="M226.68,422.811 C268.99,442.701 314.675,464.173 355.635,483.433" style="stroke:#486777;stroke-width:1;" fill="none" id="data-to-ops"/><polygon points="360.16,485.561,353.718,478.112,355.635,483.433,350.313,485.351,360.16,485.561" fill="#486777" style="stroke:#486777;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="308" y="459.57" fill="#000" font-size="12" textLength="182.596" font-family="Segoe UI">SQ-T10: restored old rights/effects</text></g><g class="legend" data-source-line="34"><rect x="175.222" y="695.484" width="605.984" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="180.222" y="715.592" fill="#000