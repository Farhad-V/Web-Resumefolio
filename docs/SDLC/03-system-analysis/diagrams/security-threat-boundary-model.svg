<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:963px;height:761px;background:#FFFFFF;" width="963px" height="761px" viewBox="0 0 963 761" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="14"><text x="349.018" y="25.107" fill="#000" font-size="14" textLength="258.392" font-weight="700" font-family="Segoe UI">Trust boundaries and candidate threats</text></g><!--entity entry--><g class="entity" data-qualified-name="entry" id="ent0001" data-source-line="16"><rect x="308" y="46.621" width="260.242" height="57.242" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="318" y="71.729" fill="#000" font-size="14" textLength="141.367" font-family="Segoe UI">TB1 — Untrusted entry</text><text x="318" y="90.35" fill="#000" font-size="14" textLength="240.242" font-family="Segoe UI">Browser / Git client / uploaded content</text></g><!--entity product--><g class="entity" data-qualified-name="product" id="ent0002" data-source-line="17"><rect x="283" y="182.621" width="310.165" height="75.863" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="293" y="207.729" fill="#000" font-size="14" textLength="215.517" font-family="Segoe UI">TB2 — Product authority boundary</text><text x="293" y="226.35" fill="#000" font-size="14" textLength="290.165" font-family="Segoe UI">Exact identity / resource / action / current state</text><text x="293" y="244.971" fill="#000" font-size="14" textLength="287.718" font-family="Segoe UI">Content validation is separate from permission</text></g><!--entity data--><g class="entity" data-qualified-name="data" id="ent0003" data-source-line="18"><path d="M6,347.621 C6,337.621 137.905,337.621 137.905,337.621 C137.905,337.621 269.811,337.621 269.811,347.621 L269.811,412.484 C269.811,422.484 137.905,422.484 137.905,422.484 C137.905,422.484 6,422.484 6,412.484 L6,347.621" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M6,347.621 C6,357.621 137.905,357.621 137.905,357.621 C137.905,357.621 269.811,357.621 269.811,347.621" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="16" y="376.729" fill="#000" font-size="14" textLength="135.796" font-family="Segoe UI">Protected information</text><text x="16" y="395.35" fill="#000" font-size="14" textLength="187.312" font-family="Segoe UI">Private records / actual history</text><text x="16" y="413.971" fill="#000" font-size="14" textLength="243.811" font-family="Segoe UI">Repository context / scoped credentials</text></g><!--entity provider--><g class="entity" data-qualified-name="provider" id="ent0004" data-source-line="19"><rect x="305.5" y="342.121" width="264.699" height="75.863" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="315.5" y="367.229" fill="#000" font-size="14" textLength="159.141" font-family="Segoe UI">TB3 — Provider boundary</text><text x="315.5" y="385.85" fill="#000" font-size="14" textLength="244.699" font-family="Segoe UI">Selected Google account and operation</text><text x="315.5" y="404.471" fill="#000" font-size="14" textLength="213.117" font-family="Segoe UI">Reconcile uncertain remote effects</text></g><!--entity run--><g class="entity" data-qualified-name="run" id="ent0005" data-source-line="20"><rect x="605.5" y="342.121" width="271.057" height="75.863" fill="#FFF3DA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="615.5" y="367.229" fill="#000" font-size="14" textLength="212.974" font-family="Segoe UI">TB4 — Conditional code boundary</text><text x="615.5" y="385.85" fill="#000" font-size="14" textLength="205.283" font-family="Segoe UI">Untrusted code / YAML / outputs</text><text x="615.5" y="404.471" fill="#000" font-size="14" textLength="251.057" font-family="Segoe UI">Isolation and resource evidence required</text></g><!--entity ops--><g class="entity" data-qualified-name="ops" id="ent0006" data-source-line="21"><rect x="299.5" y="485.621" width="278.569" height="75.863" fill="#EEF5FA" style="stroke:#486777;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="309.5" y="510.729" fill="#000" font-size="14" textLength="229.264" font-family="Segoe UI">TB5 — Operator / recovery boundary</text><text x="309.5" y="529.35" fill="#000" font-size="14" textLength="236.708" font-family="Segoe UI">Restricted evidence / current authority</text><text x="309.5" y="547.971" fill="#000" font-size="14" textLength="258.569" font-family="Segoe UI">Restored access and external-state checks</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="29"><path d="M241.5,608.621 L241.5,674.484 A0,0 0 0 0 241.5,674.484 L636.412,674.484 A0,0 0 0 0 636.412,674.484 L636.412,618.621 L626.412,608.621 L443,608.621 L439,561.641 L435,608.621 L241.5,608.621 A0,0 0 0 0 241.5,608.621" style="stroke:#B59865;stroke-width:0.5;" fill="#FFF3DA"/><path d="M626.412,608.621 L626.412,618.621 L636.412,618.621 L626.412,608.621" style="stroke:#B59865;stroke-width:0.5;" fill="#FFF3DA"/><text x="247.5" y="628.729" fill="#000" font-size="14" textLength="348.079" font-family="Segoe UI">SQ-T11: a healthy page or missing alert is not assurance.</text><text x="247.5" y="647.35" fill="#000" font-size="14" textLength="373.912" font-family="Segoe UI">SQ-T12: competing workloads can exhaust shared resources.</text><text x="247.5" y="665.971" fill="#000" font-size="14" textLength="355.517" font-family="Segoe UI">These cross-cutting cases affect all applicable boundaries.</text></g><!--link entry to product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="22" data-link-type="dependency"><path d="M438,103.791 C438,126.191 438,152.941 438,177.541" style="stroke:#486777;stroke-width:1;" fill="none" id="entry-to-product"/><polygon points="438,