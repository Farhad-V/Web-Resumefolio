-size="13" textLength="230.242" font-family="Segoe UI">Identified conditional handoff candidate</text><text x="146.361" y="319.94" fill="#000" font-size="13" textLength="363.911" font-family="Segoe UI">04 function gap and exact semantic/dependency limits retained</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M98.361,376.621 L98.361,438.494 A0,0 0 0 0 98.361,438.494 L558.683,438.494 A0,0 0 0 0 558.683,438.494 L558.683,386.621 L548.683,376.621 L332.361,376.621 L328.361,333.781 L324.361,376.621 L98.361,376.621 A0,0 0 0 0 98.361,376.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><path d="M548.683,376.621 L548.683,386.621 L558.683,386.621 L548.683,376.621" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="104.361" y="395.649" fill="#000" font-size="13" textLength="414.991" font-family="Segoe UI">These artifacts exist; no minute-by-minute task timeline is reconstructed.</text><text x="104.361" y="412.94" fill="#000" font-size="13" textLength="439.321" font-family="Segoe UI">A prescribed working method or local PBI date is not actual Sprint execution.</text><text x="104.361" y="430.231" fill="#000" font-size="13" textLength="382.891" font-family="Segoe UI">No elapsed delay or performance gain follows from artifact counts.</text></g><!--link Source to Model--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="17" data-link-type="dependency"><path d="M328.361,101.851 C328.361,120.141 328.361,139.301 328.361,157.561" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Source-to-Model"/><polygon points="328.361,162.561,332.361,153.561,328.361,157.561,324.361,153.561,328.361,162.561" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="329.361" y="137.649" fill="#000" font-size="13" textLength="146.313" font-family="Segoe UI">documentary provenance</text></g><!--link Model to Handoff--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="18" data-link-type="dependency"><path d="M328.361,217.851 C328.361,236.141 328.361,255.301 328.361,273.561" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Model-to-Handoff"/><polygon points="328.361,278.561,332.361,269.561,328.361,273.561,324.361,269.561,328.361,278.561" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="329.361" y="253.649" fill="#000" font-size="13" textLength="187.262" font-family="Segoe UI">inspectable package relationship</text></g><g class="legend" data-source-line="25"><rect x="12" y="459.494" width="635.044" height="47.242" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="479.602" fill="#000" font-size="14" textLength="595.253" font-family="Segoe UI">Source-based analysis; target behavior and hypotheses are not observed current task sequences.</text><text x="17" y="498.223" fill="#000" font-size="14" textLength="625.044" font-family="Segoe UI">No interview, business-task timing, live product/reference inspection or improvement test performed.</text></g><?plantuml-src TLFDJjmm4BxdAKPmPQ7ybG9I9HQ8og5efMrlN1ndaemsiLsFiylsr8Ve4_P9EfEmguNIK-9u_Fdx2o_81HDD1uMnYphwtfMtllKHLWqbp7YxNs9b-ZRbtgL7qo7CiVO8tn_U7vdJJuJZqvrDRapfL-Hgg4pBkyWtCVhLUEd--Sd7wSLqPpEYJSRLBKxVyDk_lylFylT7VImn_W_H-VGlM9xdftVvswbTdEdbvVdvnQk94Xa3d7xQvM3SGZ-UdMI9KejmEuC_ltv3wMtVeKjOWec9AcEJy6rD8k-ueS1PyW6IXyAdvCLAKZMocMrLmTuiKcVY6jZwW70a03zwcLDSbcL9mmcTa0LQOWL_SlVFn4cDPzz7Ys3wrFX8QGt62HrhCIYlGksGf_KHzy0mp8VnLmHyw8Mp3AryN2Xa9oQqF039dFeb00tQXTmxdeUMn19Xr7fhMg1Is58Y71cRMbpJrwqhkDGHErBugl2x31w6unKDF5r9W-0M6Y7WgmgiFAaKXa_kmnbKlHiSWTg4WI8-wmsCdH4GUrHYGAUNhOLaHs9Yn6J8OJbS_kK5TFykpu_lRx8NFPF9vv4NN6rZLSz3z4jqHgXduxOERZ2kW1m7rL68Z23rCpM-Qa2cZTl4xwlDoUnR8otRsiEYGTAyblP1HwvFE2dMa_4Dak459EfGB4SW7Y9nd69l9RF3x4Ou8jj8nMw2A6qeGIe-1ZIRFe0wgEU5alGZzV9v7Y8vIUSPRQ-K3xD73q8_i629MhDMY82nyh5J4yHqSb3vjlKhXYgAgct6LggM-30JzuSVBSjQh7Knodzn