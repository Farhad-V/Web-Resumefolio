1" style="stroke:#B99557;stroke-width:0.5;" fill="#FFF3DF"/><text x="428" y="210.489" fill="#000" font-size="13" textLength="401.965" font-family="Segoe UI">PDF mode, published view, link eligibility and artifact availability differ.</text><text x="428" y="227.78" fill="#000" font-size="13" textLength="394.748" font-family="Segoe UI">Fresh disabled-link access is denied after confirmed effective change.</text><text x="428" y="245.071" fill="#000" font-size="13" textLength="364.933" font-family="Segoe UI">Already delivered bytes are outside recall; no unrelated fallback.</text></g><!--link Viewer to Product--><!--link Viewer to Product--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="18" data-link-type="dependency"><path d="M191.13,132.431 C198.86,132.841 206.56,133.201 214,133.461 C322.94,137.281 442.894,134.075 527.704,130.605" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Viewer-to-Product-1"/><polygon points="532.7,130.401,523.544,126.772,527.704,130.605,523.871,134.766,532.7,130.401" fill="#526B7B" style="stroke:#526B7B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="238" y="95.489" fill="#000" font-size="13" textLength="137.973" font-family="Segoe UI">Exact link/password and</text><text x="239.895" y="112.78" fill="#000" font-size="13" textLength="134.183" font-family="Segoe UI">selected representation</text><text x="285.461" y="130.071" fill="#000" font-size="13" textLength="43.05" font-family="Segoe UI">request</text></g><!--link Product to Viewer--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="19" data-link-type="dependency"><path d="M532.81,135.471 C496.24,142.221 455.6,153.531 422,172.461 C409.13,179.711 412.59,190.661 399,196.461 C323.38,228.731 293.05,219.061 214,196.461 C184.18,187.931 158.585,172.094 137.015,155.974" style="stroke:#526B7B;stroke-width:1;" fill="none" id="Product-to-Viewer"/><polygon points="133.01,152.981,137.825,16