textLength="21.786" font-family="Arial">yes</text><text x="518.322" y="269.428" fill="#000" font-size="14" textLength="80.944" font-family="Arial">not observed</text><rect x="142.682" y="294.395" width="267.461" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.682" y="317.526" fill="#17324D" font-size="14" textLength="247.461" font-family="Arial">Record an actual issue linked to the risk</text><rect x="139.948" y="350.493" width="272.93" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.948" y="373.625" fill="#17324D" font-size="14" textLength="252.93" font-family="Arial">Record evidence, effects and next action</text><rect x="432.878" y="294.395" width="284.585" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="442.878" y="317.526" fill="#17324D" font-size="14" textLength="264.585" font-family="Arial">Retain the risk as possible future exposure</text><polygon points="425.792,392.592,437.792,404.592,425.792,416.592,413.792,404.592,425.792,392.592" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="281.154" y="436.592" width="289.274" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="291.154" y="459.724" fill="#17324D" font-size="14" textLength="269.274" font-family="Arial">Investigate and carry out agreed responses</text><rect x="283.113" y="492.69" width="285.357" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="293.113" y="515.822" fill="#17324D" font-size="14" textLength="265.357" font-family="Arial">Review actual evidence and remaining risk</text><polygon points="195.455,548.789,656.128,548.789,668.128,560.789,656.128,572.789,195.455,572.789,183.455,560.789,195.455,548.789" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;stroke-linejo