<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1097px;height:785px;background:#FFFFFF;" width="1097px" height="785px" viewBox="0 0 1097 785" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="352.622" y="33.132" fill="#000" font-size="14" textLength="389.765" font-weight="700" font-family="Arial">Resumefolio - Change assessment and decision recording</text></g><ellipse cx="627.04" cy="62.099" rx="10" ry="10" fill="#17324D" style="stroke:#222;stroke-width:1;"/><rect x="506.917" y="92.099" width="240.247" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="516.917" y="115.23" fill="#17324D" font-size="14" textLength="220.247" font-family="Arial">Describe the change and its reason</text><rect x="467.227" y="148.197" width="319.626" height="52.197" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="477.227" y="171.329" fill="#17324D" font-size="14" textLength="277.006" font-family="Arial">Assess affected artifacts, effort, cost, quality,</text><text x="477.227" y="187.428" fill="#17324D" font-size="14" textLength="299.626" font-family="Arial">operations, dependencies, risks and alternatives</text><polygon points="440.662,220.395,813.419,220.395,825.419,232.395,813.419,244.395,440.662,244.395,428.662,232.395,440.662,220.395" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="440.662" y="237.477" fill="#17324D" font-size="14" textLength="372.757" font-family="Arial">Changes agreed scope, spending or delivery commitments?</text><text x="406.876" y="229.428" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="825.419" y="229.428" fill="#000" font-size="14" textLength="156.44" font-family="Arial">within agreed boundaries</text><rect x="210.537" y="254.395" width="271.351" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="220.537" y="277.526" fill="#17324D" font-size="14" textLength="251.351" font-family="Arial">Obtain an explicit project-owner decision</text><polygon points="313.133,325.493,379.291,325.493,391.291,337.493,379.291,349.493,313.133,349.493,301.133,337.493,313.133,325.493" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="313.133" y="342.576" fill="#17324D" font-size="14" textLength="66.158" font-family="Arial">Accepted?</text><text x="279.347" y="334.526" fill="#000" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="391.291" y="334.526" fill="#000" font-size="14" textLength="122.179" font-family="Arial">rejected or deferred</text><rect x="16" y="359.493" width="304.061" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="382.625" fill="#17324D" font-size="14" textLength="284.061" font-family="Arial">Record decision, rationale, date and follow-up</text><rect x="340.061" y="359.493" width="368.667" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="350.061" y="382.625" fill="#17324D" font-size="14" textLength="348.667" font-family="Arial">Record outcome and reasons; do not apply the proposal</text><ellipse cx="524.394" cy="426.592" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="524.394" cy="426.592" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="738.728" y="254.395" width="338.281" height="52.197" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="748.728" y="277.526" fill="#17324D" font-size="14" textLength="231.13" font-family="Arial">Proceed within existing authorization;</text><text x="748.728" y="293.625" fill="#17324D" font-size="14" textLength="318.281" font-family="Arial">record significant technical rationale where relevant</text><polygon points="627.04,447.592,639.04,459.592,627.04,471.592,615.04,459.592,627.04,447.592" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="468.403" y="491.592" width="317.274" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="478.403" y="514.724" fill="#17324D" font-size="14" textLength="297.274" font-family="Arial">Update affected work, documents and diagrams</text><rect x="471.537" y="547.69" width="311.006" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="481.537" y="570.822" fill="#17324D" font-size="14" textLength="291.006" font-family="Arial">Perform relevant verification and review results</text><rect x="515.875" y="603.789" width="222.33" height="36.099" fill="#DBEAFE" style="stroke:#94A3B8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="525.875" y="626.921" fill="#17324D" font-size="14" textLength="202.33" font-family="Arial">Record a focused Git checkpoint</text><ellipse cx="627.04" cy="670.888" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="627.04" cy="670.888" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="627.04" y1="72.099" x2="627.04" y2="92.099" style="stroke:#181818;stroke-width:1;"/><polygon points="623.04,82.099,627.04,92.099,631.04,82.099,627.04,86.099" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="627.04" y1="128.197" x2="627.04" y2="148.197" style="stroke:#181818;stroke-width:1;"/><polygon points="623.04,138.197,627.04,148.197,631.04,138.197,627.04,142.197" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="524.394" y1="395.592" x2="524.394" y2="415.5